<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairwell</title>
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pairwell">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css?v=52081535">
<style>
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--f-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;max-width:600px;margin:0 auto;
    padding:
      calc(env(safe-area-inset-top) + 20px)
      calc(env(safe-area-inset-right) + 18px)
      calc(var(--bar) + 26px)
      calc(env(safe-area-inset-left) + 18px);
  }

  header{margin-bottom:22px}
  .date{
    font-family:var(--f-data);font-size:13px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted2);margin:0 0 7px;
  }
  h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.025em;margin:0}
  h1 .who{color:var(--who-active,var(--philipp))}

  /* One card per part of the day. The accent says which module it belongs to,
     so the colour is doing navigational work, not decoration. */
  .card{
    display:block;text-decoration:none;color:inherit;
    background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:0 16px 16px 0;margin-bottom:12px;overflow:hidden;
    transition:background .18s ease, transform .18s ease;
  }
  .card:active{background:var(--surface-2);transform:scale(.99)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .ch{display:flex;align-items:baseline;gap:10px;padding:14px 18px 0}
  .ch .k{
    font-family:var(--f-data);font-size:13px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  }
  .ch .meta{font-family:var(--f-data);font-size:13px;color:var(--muted2);margin-left:auto}
  .cb{padding:8px 18px 16px}
  .headline{font-size:19px;font-weight:600;letter-spacing:-.012em;line-height:1.35}
  .detail{
    font-family:var(--f-read);font-size:15px;line-height:1.55;
    color:var(--muted);margin-top:5px;
  }
  .detail .sep{color:var(--muted2)}
  .rest{color:var(--muted)}

  .warn{
    display:flex;gap:9px;align-items:flex-start;
    margin:10px 18px 14px;padding:11px 13px;
    border-radius:0 10px 10px 0;border-left:3px solid var(--warn);
    background:var(--warn-fill);
  }
  .warn .wt{
    font-family:var(--f-data);font-size:12.5px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--warn);
  }
  .warn p{margin:4px 0 0;font-family:var(--f-read);font-size:14.5px;line-height:1.5;color:var(--text)}

  /* A declared phase, not a warning: same shape as .warn, the module accent
     instead of the alarm colour, because nothing here is wrong. */
  .phase{
    margin:10px 18px 14px;padding:11px 13px;
    border-radius:0 10px 10px 0;border-left:3px solid var(--food);
    background:var(--surface-2);
  }
  .phase .pt{
    font-family:var(--f-data);font-size:12.5px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--food);
  }
  .phase p{margin:4px 0 0;font-family:var(--f-read);font-size:14.5px;
    line-height:1.5;color:var(--text)}
  .phase .pm{margin-top:6px;font-family:var(--f-data);font-size:13px;color:var(--muted2)}
  .targets{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
  .targets div{font-family:var(--f-data);font-size:13px;color:var(--muted2);
    font-variant-numeric:tabular-nums}
  .targets b{display:block;font-size:17px;color:var(--text);font-weight:700;margin-top:2px}

  .meals{display:flex;flex-direction:column;gap:3px;margin-top:2px}
  .meals div{font-size:14.5px;color:var(--text);display:flex;gap:8px}
  .meals span{
    font-family:var(--f-data);font-size:13px;color:var(--muted2);
    min-width:52px;flex:none;
  }

  .phase details.why{margin-top:8px}
  .phase details.why summary{
    font-family:var(--f-data);font-size:13px;color:var(--muted2);
    cursor:pointer;list-style:none;min-height:var(--tap);
    display:flex;align-items:center;
  }
  .phase details.why summary::-webkit-details-marker{display:none}
  .phase details.why summary::after{content:" ▾";margin-left:4px}
  .phase details.why[open] summary::after{content:" ▴"}
  .phase details.why summary:focus-visible{outline:2px solid var(--food);outline-offset:2px}

  footer{
    margin-top:26px;font-family:var(--f-data);font-size:13px;color:var(--muted2);
    display:flex;justify-content:space-between;align-items:center;
  }
  #status.offline{color:var(--food)}

  @media (prefers-reduced-motion:reduce){
    .card{transition:none} .card:active{transform:none}
  }
</style>
</head>
<body>

<div class="pw-bar">
  <span></span>
  <div id="switcher"></div>
</div>

<header>
  <p class="date" id="date">Pairwell</p>
  <h1><span id="greeting">Hello</span>, <span class="who" id="name">Philipp</span></h1>
</header>

<main id="today"></main>

<footer>
  <span id="status">Available offline</span>
  <span id="themeslot"></span>
</footer>

<script src="app.js?v=3f8263a7"></script>
<script>
const D = {"profiles": {"_source": "Core_Health_Logic.md", "priorityHierarchy": ["protein", "fiber", "fat", "calories"], "priorityNote": "Protein is non-negotiable. All other macros flex around it.", "people": {"philipp": {"displayName": "Philipp", "role": "biohacker", "dailyTargets": {"calories": 1900, "proteinG": 164, "fiberG": 45, "fatG": 55, "netCarbsG": 165}, "fixedBreakfast": {"recipeId": "philipp-overnight-oats", "calories": 319.1, "proteinG": 31.8, "fiberG": 5.4, "fatG": 5.1, "ingredients": [{"item": "Haferflocken", "amount": "45 g"}, {"item": "Skyr", "amount": "120 g"}, {"item": "Whey Protein", "amount": "15 g"}, {"item": "Mandelmilch, ungesüßt", "amount": "80 ml"}, {"item": "Ceylon Zimt", "amount": "1 g"}, {"item": "Salz", "amount": "1 pinch"}], "_note": "Numbers copied from recipes.json (philipp-overnight-oats), not typed independently. Replaced the whey shaker on 2026-08-30; the shaker stays in the library for days when no jar travels, exactly as the Magerquark bowl stayed for days at home. Overnight oats were never ruled out for him — Eunice's objection was about packing a second jar for work, and that got applied to the whole household without ever being re-checked. They also fix the shaker's one real weakness: a shake does not satiate. The morning went from 0 g of fibre to 5.4."}, "afternoonPortions": 2, "snackBudgetAfterMirrorMeals": {"calories": 540.9, "proteinG": 52.2, "note": "1900 - 319 (breakfast) - 1040 (lunch+dinner) = remainder. Derived; the kitchen page recomputes it live. Two portions of die-vorratsdose-skyr-schoko-banane fill it (549 kcal, 58.8 g protein, 17.2 g fibre) and run 8 kcal past it — noise, deliberately not optimised away."}, "aestheticGoal": "lean athletic, K-drama V-taper, not bulky", "_phase": {"name": "Maintenance — recovering expenditure", "startedOn": "2026-08-29", "reviewOn": "2026-09-26", "was": 1600, "why": "Not a deficit. MacroFactor measured expenditure falling from 2462 in March to 1801 now — 767 kcal, of which only ~270 is explained by lost mass and fewer steps. At 1600 the deficit had shrunk to ~200 kcal and was still closing; cutting further would have pushed expenditure down again. Eating at measured expenditure is what lets it climb back, and a deficit from a recovered 2100 loses fat faster than one from 1800.", "expect": "1-1.5 kg on the scale in week one. That is water and glycogen refilling, not fat — 300 kcal a day cannot become a kilo of fat in a week. Do not react to it. Judge this phase on the MacroFactor expenditure line, not on bodyweight.", "alsoRequired": "Steps back to 8000/day. That is ~200 kcal of real expenditure and it is what actually moved the weight in July. The calorie change alone does half the job.", "thenWhat": "Re-import MacroFactor on 2026-09-26 and run check_targets.py. If expenditure has climbed above ~2000, drop to expenditure minus 400 for the next cut. If it has not moved at all, the logging is the suspect, not the metabolism."}}, "eunice": {"displayName": "Eunice", "role": "healthy teacher", "dailyTargets": {"calories": 1580, "proteinG": 125, "fiberG": 35, "fatG": 45, "netCarbsG": 151}, "fixedBreakfast": {"recipeId": "eunice-ehrmann-pudding-breakfast", "calories": 174, "proteinG": 20, "fiberG": 0.6, "fatG": 4.6, "ingredients": [{"item": "Ehrmann High Protein Pudding", "amount": "200 g (1 pot)"}], "_note": "Numbers copied from recipes.json (eunice-ehrmann-pudding-breakfast), not typed independently — the exact duplication Philipp's breakfast has is deliberately not repeated here."}, "afternoonPortions": 1, "breakfastPlusSnackBudget": {"_stale": "Written before fixedBreakfast existed for her. The real pudding is 174 kcal / 20 g P / 0.6 g fibre against the 330/28 assumed below — the gap rolls into 'left for snacks' automatically since the kitchen page computes that live, not from this field. Left as-is rather than reconciled by hand; the 2026-09-26 review is the natural point to redo this split against real data.", "calories": 540, "proteinG": 45, "fiberG": 7, "split": {"breakfast": {"calories": 330, "proteinG": 28}, "snack": {"calories": 210, "proteinG": 17}}, "note": "1580 - 1040 (lunch+dinner) = remainder. Derived; the kitchen page recomputes it live rather than reading this. The split is guidance, not a fixed meal — she has no fixedBreakfast yet. 45 g of protein in 540 kcal is 33% of the envelope, which sounds strict and is not: 250 g of skyr with 30 g of whey is 275 kcal and 51 g."}, "aestheticGoal": "curvier, defined, strong lower body already present", "notes": ["picky eater, strong taste preferences — recipe selection must pass her taste test", "~1 year training experience, naturally strong lower body development"], "_phase": {"name": "Provisional — modelled, not measured", "startedOn": "2026-08-30", "reviewOn": "2026-09-26", "why": "Her four targets come from an activity-factor model and nothing else. The same model said Philipp's maintenance was 2424-2688 kcal; MacroFactor measured 1801. A model that was 600 kcal wrong about one person in this household is not evidence about the other. 1580 is a starting guess with roughly +-300 kcal in it, and it should be treated as one until there is an expenditure line to check it against.", "theOpenQuestion": "Whether 45 g of protein fits outside lunch and dinner in practice. On paper it is 250 g of skyr and a scoop of whey; in a real morning it is a habit she does not have yet.", "expect": "Two weeks of hitting 3 of 4 targets on most days. Not perfection — the question is whether the shape of the day is livable, not whether the arithmetic closes.", "thenWhat": "If the protein lands: keep 125 and start trusting the number. If breakfast keeps coming up short, fall back to protein 120 / fat 47 / net carbs 153 — already worked out, same 1580 kcal, and it costs 0.08 g/kg. Do not fall back by eating less protein while leaving the target at 125; change the target, so the report keeps telling the truth.", "blocking": "She has no MacroFactor data at all — private/macrofactor holds only philipp. Until she logs, this phase can only be reviewed against the scale and how she feels, which is exactly the weak evidence that produced the 600 kcal error. Two weeks of logging before 2026-09-26 would give the first real read."}}}, "mirrorMeals": {"note": "Lunch and dinner are identical in size and macros for both people. Fat is a CEILING, not a range: protein and fibre are hit first and fat lands where it lands underneath it. A floor of 8 g was doing nothing — a leaner dish simply leaves the snack more room — while the 12 g ceiling put salmon, eggs, tempeh and tofu out of reach of a 40 g protein meal. Written as \"0-14\" so every reader that splits the range keeps working; read it as \"up to 14\".", "lunch": {"calories": 520, "proteinG": 40, "fiberG": 14, "fatG": "0-14"}, "dinner": {"calories": 520, "proteinG": 40, "fiberG": 14, "fatG": "0-14"}, "_revised": "2026-08-29 — was 425 kcal / 17 g fibre / 12-15 g fat on 1.5 Asian Base blocks. That target could not be cooked: the cheapest combination of these staples reaching it came to 533 kcal, 108 kcal over, at every meal. Raised to 470 kcal on 1 block with 14 g fibre, which the same search reaches at 432 kcal — leaving real slack for sauce and aromatics instead of sitting on the theoretical floor. Run scripts/check_targets.py after touching any of these numbers.", "_revised2": "2026-08-30 — fat band 8-12 -> ceiling of 14, no floor. The day pays for it out of slack it already had: Philipp keeps 17 g of fat for the snack, Eunice 24 g for breakfast plus snack. check_targets.py's REAL FOOD search goes from 4962 to 5697 plates on one block and returns tofu at every block level, salmon on the saucy tier.", "_revised3": "2026-08-30 — mirror meal 470 -> 520 kcal, and Eunice's protein 105 -> 125 g with fat 52 -> 45 and net carbs 160 -> 151 paying for it. Her breakfast-plus-snack envelope was 640 kcal asking for 25 g of protein: 40% of her day, 16% of it accounted for. Because lunch and dinner are identical for both people, growing the meal shrinks both envelopes at once — hers to 540, his to 450. Protein per meal stays 40: raising it would have relieved his snack and emptied hers, which is backwards. The ceiling on how far this can go is HIS snack, which reaches 32% protein at 520 and 37% at 550. Cooking gets easier, not harder — check_targets.py finds 18260 plates at 520 against 11992 at 470.", "dish": {"calories": 401, "proteinG": 35.7, "fiberG": 12.4, "fatG": "0-12.9", "_baselineBlocks": 1, "_why": "The plate is the dish plus base blocks. lunch/dinner above describe the whole PLATE; this describes the dish on its own, which is what adapt_recipe.py actually fits. It is the plate minus 1 standard block (119.4 kcal, 4.3 g protein, 1.6 g fibre, 1.1 g fat), so dish + 1 block lands exactly on the plate target.", "_perPerson": "The block count is a dial at the plate, not a property of the recipe. Philipp's day is 1900 kcal and Eunice's 1580, so the same dish can carry a different number of blocks for each of them. Kitchen shows both. Taking fewer than the baseline leaves protein and fibre a little short; taking more only adds."}}, "_gaps": ["Five dishes were rebuilt on 2026-08-30 (legume as the fibre carrier, fat cut, meat cut, solve() re-fits). Two of the five were reverted the same day: edamame is Japanese, and putting it in a Vietnamese phở and a Korean stew was a macro fix in costume — it also cost the brisket that IS phở bò chín and the potatoes that thicken a dakbokkeumtang. Root cause was in the data: topUps filed edamame under 'asian', which is a continent rather than a cuisine. Fixed there too.", "Two dishes are marked fibreLight and are meant to be: pho-bo (4.8 g) and korean-spicy-chicken-stew (6.1 g). Both close the day beside any of the four 14 g dishes plus 7-9 g of psyllium, inside the 10 g cap. The phở gained its fibre honestly rather than by redesign — the transcription had 40 g of sprouts and no herbs, which is not how phở is served. The rau sống plate (200 g sprouts, Thai basil, coriander, mint, lime) is canonical and carries 4.5 g a serving. That was a missing half of the dish, not a macro patch.", "Eunice's four targets imply 1598 kcal against a 1580 budget — an 18 kcal rounding gap, left alone. Her numbers have no MacroFactor data behind them, so the model is all there is, and the model was 600 kcal wrong for Philipp. Believe her scale over this arithmetic.", "The Vorratsdose has never been tasted, only calculated. It is built against acidity rather than macros — skyr instead of quark, cocoa in the bowl, banana instead of the tart frozen berries, almond milk to loosen it, salt to blunt the sourness. If skyr is still too sour the next step is Greek yoghurt 0-2%, NOT more sweetener: sweetness masks acid, fat and salt remove it. Mix a small test batch before committing 1.5 kg.", "baked-feta-salmon-light lands at 22.2 g of fat against a 14 g per-meal guideline, and that is arithmetic rather than a recipe fault: salmon carries 0.67 g of fat per gram of protein, so 40 g of protein from salmon alone is 26.8 g of fat before anything else. Prawns carry part of the protein and the feta is down from 200 g to 80, which halves the fat from 43. It closes the day next to a lean dish (lemon-herb-chicken-light) and not twice in one day — which is exactly why the planner checks pairs."], "_dayShape": {"_decided": "2026-08-30", "summary": "Two blocks outside the mirror meals. Morning is per-person and NOT shared; the afternoon pudding IS shared. Sharing only pays off where there is a batch operation — the same reason lunch and dinner are identical. The morning is portioned per person anyway, so unifying it would be cosmetic and would cost Eunice a habit that works.", "morning": {"philipp": "philipp-overnight-oats — mixed the night before, eaten around 10 at school. philipp-whey-shaker stays in the library for days when no jar travels.", "eunice": "eunice-ehrmann-pudding-breakfast — bought, sealed, unchanged. She declined overnight oats because she will not pack a second jar for work; that objection is hers and does not generalise to him."}, "afternoon": {"sweet": "die-vorratsdose-skyr-schoko-nuss — ONE bowl, 9 portions, 3 days. Philipp 2 a day, Eunice 1, ~155 g a portion. Skyr for both; nut butter and cocoa mixed in, banana per portion.", "savoury_meat": "die-herzhafte-dose-linsen-pute-paprika — 4 portions. Turkey poached, not roasted. Sesame oil and lemon go on at the bowl, never into the batch.", "savoury_quark": "kraeuterquark-mit-linsen — 4 portions. Kräuterquark was ruled out because Eunice does not eat Magerquark, but that objection belonged to the SWEET context: the same tang reads wrong in a sweet bowl and right in a herb dip. No lemon, no vinegar.", "_swapping": "All three sit at 275-277 kcal, so any mix closes both days on all four macros without recalculating. Verified across every combination.", "_fatCorrection": "2026-08-30: all three were built fat-phobic by reflex, and the aroma in all of them is fat-soluble — herbs, cocoa, cinnamon. Fat went in as a TRADE, not an addition: the calorie window was already full even though the fat column was not, and fat costs 9 kcal a gram. Sweet bowl: 54 g nut butter in, banana halved, oat bran 171 to 140. Quark bowl: 16 g olive oil in, quark 800 to 660. The turkey bowl needed no fat at 4.7 g and got only technique fixes.", "_portions": "afternoonPortions on each person: Philipp 2, Eunice 1, both from the same bowl. The Kitchen planner reads it and asks for that many picks, so he can put a sweet portion next to a savoury one on the same day — which is the whole reason the savoury tubs exist. Before this the planner had one snack slot for everyone and quietly understated his day by a portion."}, "batchRhythm": "The pudding is mixed twice a week, not once for three days: 3 portions a day makes a 3-day batch ~2.1 kg in one tub. It needs no heat and no cooling, so twice is the same total work with fresher berries. The 3-day rhythm stays for lunch and dinner, where it exists because of the cooking.", "fibreTiming": "Fibre does not have to be eaten in the morning — only the daily total matters for what fibre is for. What is true is the satiety argument: fibre slows gastric emptying, so a morning item without it holds less long. That is why the shaker suits someone who does not want to eat in the morning anyway.", "topUp": {"_why": "A six-day simulation showed both eating short every day: Philipp 95-116 kcal, Eunice 195-216 — 13% of her day. Mechanical, not behavioural: the light dishes come in at 450 and 487 kcal against a 520 spec, twice a day.", "calories": "ehrmann-pudding-nachfueller — a cup from the fridge. Nothing to mix, nothing to remember, already on the shopping list. Brings Eunice to -21 kcal; Philipp only needs one on some days (a whole one puts him +58 to +79 over, which is noise but not nothing).", "fibre": "A capped spoon of Flohsamenschalen, see kitchen.json dayFineTuning. Over the same six days the largest gap was 8 g of powder against a 10 g cap, and on the days with the light dishes none was needed at all.", "_deleted": "There was briefly a third recipe here — a top-up of skyr, berries and oat bran. Deleted. It closed the same hole as a bought cup while being one more thing to mix and remember, and this household does not need a third decision at the end of a stressed day. Fewer moving parts beats a slightly better fit."}}}, "training": {"_source": "workout_hub.html — full re-translation of all cues, 2026-08-29", "_supersedes": "earlier training.json draft — this is the authoritative extraction", "_measured": "Gym loads dated 2026-08-29 were read off the machines, not estimated: cable row 42.5 kg P / 27 kg E, face pull 12.5 kg P / 5 kg E, rear delt fly 6.8 kg P, biceps curl 5 kg P / 2.5 kg E. Everything else in this file is still the number the plan was written with. The glute drive machine turned out not to exist at this gym on the same day. Confirmed in the gym the same evening: Eunice did the hip thrusts with a sandbag or a dumbbell across the hips, which is why the sessions name that setup rather than the machine.", "meta": {"title": "Workout Hub · Philipp & Eunice · 2026", "edition": "Lean Athletic Edition", "structure": "Full-Body, Primary/Maintenance tiers, taper-focused", "locations": ["gym", "home", "travel"]}, "profiles": {"philipp": {"badge": "Lean Athletic", "goal": "K-idol taper · fat loss · muscle retention", "meta": {"intensity": "RIR 2"}}, "eunice": {"badge": "Toned & Curvy", "goal": "Hwasa look · glutes · shoulder-to-hip ratio", "meta": {"focus": "Glutes + back", "intensity": "RIR 2-3"}}, "shared": {"badge": "Zusammen", "goal": "same exercises, own load — alternating sets", "meta": {"when": "Sunday", "mode": "alternating sets", "setup": "1 station"}}}, "weeklyRhythm": {"philipp": [{"day": "Mon", "what": "Pad · Zone 1", "type": "move"}, {"day": "Tue", "what": "Gym · Push", "type": "training"}, {"day": "Wed", "what": "Pad · Zone 2", "type": "move"}, {"day": "Thu", "what": "Walk", "type": "move"}, {"day": "Fri", "what": "Gym · with Eunice", "type": "training"}, {"day": "Sat", "what": "Walk", "type": "move"}, {"day": "Sun", "what": "Together", "type": "training"}], "eunice": [{"day": "Mon", "what": "Gym solo", "type": "training"}, {"day": "Tue", "what": "Rest", "type": "rest"}, {"day": "Wed", "what": "Walk", "type": "move"}, {"day": "Thu", "what": "Rest", "type": "rest"}, {"day": "Fri", "what": "Gym · with Philipp", "type": "training"}, {"day": "Sat", "what": "Rest", "type": "rest"}, {"day": "Sun", "what": "Together", "type": "training"}]}, "locationNotes": {"gym": "Holmes Place · cable tower + machines. All primary exercises run on the cable tower — constant tension, exact progression.", "home": "Bodylastics tubes + door anchor. Bands mimic the cable tower 1:1. More resistance = bundle another tube. Height = anchor high/mid/low. Constant tension = stand farther from the door.", "travel": "Tubes only + door anchor. Everything with Bodylastics + door anchor, no dumbbells needed. Tempo 3-0-1 and standing farther from anchor substitute for more weight."}, "equipmentByLocation": {"gym": ["cable tower", "machines", "dumbbells + sandbags", "leg press"], "home": ["Bodylastics tubes", "door anchor high/low", "ankle strap"], "travel": ["3+ tubes", "door anchor", "tempo 3-0-1"]}, "sessions": {"gym": {"philipp": {"push": {"title": "Push + Taper", "day": "Tuesday", "focus": "side delt · chest · lat · triceps", "exercises": [{"name": "Cable Lateral Raise", "ref": "taper driver #1", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "5 kg/arm", "rir": "RIR 2", "rest": "60s"}, "cue": "Fresh first — the most important move for the look. Constant tension at the bottom, where a dumbbell would give you none. Arm slightly bent, lead with the elbow to shoulder height. Goal: a clean 15, then 6 kg."}, {"name": "Cable Chest Press (high-to-low)", "ref": "upper chest", "focus": "a", "tier": "primary", "sets": 4, "reps": "10-12", "extras": {"load": "10 kg/arm", "rir": "RIR 2", "rest": "90s"}, "cue": "Anchor high, stand away from the tower, press forward and downward in front of the chest. The downward angle hits the upper chest automatically — the athletic line under the collarbone. 4 sets, because chest is your second focus."}, {"name": "Wide Lat Pulldown", "ref": "lat width → taper", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "21.25 kg", "rir": "RIR 2", "rest": "90s"}, "cue": "Second most important taper muscle after the side delt — which is why it is in both sessions. Pull the bar to the upper chest, feel the lats, controlled on the way back."}, {"name": "Triceps Pushdown (Rope)", "ref": "arm definition", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "17.5 kg", "rir": "RIR 1-2", "rest": "60s"}, "cue": "Was completely buried in the old plan — now a fixture. Elbows fixed at your sides, pull the rope apart at the bottom, brief hold. A defined arm, not mass."}, {"name": "Leg Press (light)", "ref": "leg proportion", "focus": "g", "tier": "maint", "sets": 2, "reps": "20", "extras": {"load": "~70 kg", "rir": "RIR 3", "rest": "60s"}, "cue": "Maintenance — hold, don't build. High reps, light weight, never progress. Keeps the legs lean and defined without making them thicker."}, {"name": "Cable Crunch", "ref": "waist", "focus": "c", "tier": "maint", "sets": 3, "reps": "12-15", "extras": {"load": "25 kg", "rir": "RIR 2", "rest": "45s"}, "cue": "Fold the ribs towards the hips like a jackknife, hands fixed at the ears. Slow on the way back — that is the eccentric load."}, {"name": "Hollow Hold", "ref": "waist detail", "focus": "c", "tier": "maint", "sets": 3, "reps": "30s", "extras": {"rest": "45s"}, "cue": "Lower back flat on the floor, arms long. Builds the deep abdominal tension that visually tightens the waist."}], "durationMin": 50}, "pull": {"title": "Pull + Posture", "day": "Friday · with Eunice", "focus": "side delt · lat · back · rear delt", "exercises": [{"name": "Cable Lateral Raise", "ref": "taper driver #1", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "5 kg/arm", "rir": "RIR 2", "rest": "60s"}, "cue": "Second side-delt hit of the week. Exactly like Tuesday — constant tension, lead with the elbow. Six side-delt sets a week is the core of the taper."}, {"name": "Wide Lat Pulldown", "ref": "lat width", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "21.25 kg", "rir": "RIR 2", "rest": "90s"}, "cue": "Second lat hit of the week. Replaces the pull-up you cut — that would have thickened the upper traps and shortened the neckline. The pulldown builds width without that drawback."}, {"name": "Cable Row (neutral)", "ref": "upper back", "focus": "a", "tier": "primary", "sets": 3, "reps": "10-12", "extras": {"load": "42.5 kg", "rir": "RIR 2", "rest": "90s"}, "cue": "Sit upright, handle to the belly, elbows close to the body, shoulder blades together. Builds posture without thickening the neck — stay moderate, don't heave."}, {"name": "Hip Thrust (Dumbbell or Sandbag)", "ref": "posterior chain", "focus": "g", "tier": "maint", "sets": 2, "reps": "15", "extras": {"rir": "RIR 3", "rest": "60s"}, "cue": "Maintenance — hold, don't build. Her station, her setup: shoulders against the bench, the weight across the hips. Two sets while she does her three. Hip extension is what the seated curl at the end does not cover, and it is what keeps the back of the leg working as a unit."}, {"name": "Rear Delt Fly (Cable)", "ref": "rear delt", "focus": "a", "tier": "primary", "sets": 3, "reps": "15", "extras": {"load": "6.8 kg", "rir": "RIR 1", "rest": "60s"}, "cue": "Gives the shoulder depth and the 3D look without mass. Arms almost straight, lead with the little fingers, squeeze the rear delts together."}, {"name": "Cable Face Pull", "ref": "shoulder health", "focus": "a", "tier": "maint", "sets": 2, "reps": "15", "extras": {"load": "12.5 kg", "rir": "RIR 1", "rest": "45s"}, "cue": "Maintenance — the counterpart to all the pressing. External rotation keeps the shoulder healthy. Elbows high and wide, hands past the ears. Pair it with the fly the way Eunice does: rounds 1 and 2 fly straight into face pull, round 3 fly only. Same station, same three rounds, so you both leave together."}, {"name": "Cable Biceps Curl", "ref": "arm detail", "focus": "a", "tier": "maint", "sets": 2, "reps": "15", "extras": {"load": "5 kg", "rir": "RIR 2", "rest": "45s"}, "cue": "Maintenance. Elbows fixed, constant tension, brief squeeze at the top. Covers what the pulldown and row don't fully reach."}, {"name": "Seated Hamstring Curl", "ref": "hamstrings", "focus": "g", "tier": "maint", "sets": 2, "reps": "15", "extras": {"load": "50 kg", "rir": "RIR 3", "rest": "60s"}, "cue": "Maintenance. Holds the back of the leg — important for posture and for how trousers sit. Controlled, no swing.", "solo": "Eunice is on the cable crunch"}], "durationMin": 55, "partner": "Eunice", "note": "Friday with Eunice, one station at a time: his set, her set. Her set is his rest — about a minute, whatever the card says. The pulldown and the row want 90s, so let one extra turn go by on those two. Shared all the way to the last exercise."}}, "eunice": {"solo": {"title": "Lower + Push", "day": "Monday · solo", "focus": "fixed machines only — no setup, no cable", "note": "Monday alone in the gym. Deliberately machines only: fixed path, nothing can go wrong, no spotting needed. Cable exercises happen Friday with Philipp.", "exercises": [{"name": "Hip Thrust (Dumbbell or Sandbag)", "ref": "priority #1", "focus": "g", "tier": "primary", "sets": 4, "reps": "12-15", "extras": {"rir": "RIR 2-3", "rest": "90s"}, "cue": "Fresh first — your top exercise. There is no glute drive machine at this gym, so: shoulders against a bench, dumbbell or sandbag across the hips, feet flat and close. Full hip extension, 1s hold at the top, squeeze hard. 4 sets, because glutes are the goal. The muscle that makes the Hwasa look."}, {"name": "Leg Press (wide + high)", "ref": "quads + glutes + inner thigh", "focus": "g", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"rir": "RIR 2-3", "rest": "90s"}, "cue": "Feet wide and high on the platform, knees out — inner thigh plus glutes. Shapes the front of the leg."}, {"name": "Adductor Machine", "ref": "inner thigh", "focus": "g", "tier": "primary", "sets": 3, "reps": "15-20", "extras": {"rir": "RIR 1-2", "rest": "60s"}, "cue": "Squeeze the pads together slowly (3s in), controlled on the way back. The best inner-thigh exercise there is."}, {"name": "Seated Leg Curl", "ref": "hamstrings", "focus": "g", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"rir": "RIR 2-3", "rest": "75s"}, "cue": "Back of the leg — the counterpart to the leg press. Pull the heels under the seat, squeeze, controlled return."}, {"name": "Chest Press Machine", "ref": "chest", "focus": "a", "tier": "maint", "sets": 2, "reps": "10-12", "extras": {"rir": "RIR 2-3", "rest": "75s"}, "cue": "Maintenance. Sit down, handles at chest height, press forward, controlled return. Fixed path, nothing to set up."}, {"name": "Triceps Machine", "ref": "arm detail", "focus": "a", "tier": "maint", "sets": 2, "reps": "12-15", "extras": {"rir": "RIR 1-2", "rest": "60s"}, "cue": "Maintenance. The machine instead of the cable rope — simpler on your own. Back of the upper arm, the 'underarm' area."}, {"name": "Ab Machine", "ref": "core", "focus": "c", "tier": "maint", "sets": 2, "reps": "12-15", "extras": {"rir": "RIR 2-3", "rest": "45s"}, "cue": "Maintenance. Fixed ab machine with a weight stack — fold under control, slow on the way back."}], "durationMin": 50}, "pull": {"title": "Upper + Glutes", "day": "Friday · with Philipp", "focus": "cable tower — alternating sets with Philipp", "note": "Friday with Philipp, one station at a time: her set, his set. His set is her rest — about a minute, whatever the card says. The pulldown and the row want 90s, so let one extra turn go by on those two. Shared all the way to the last exercise.", "exercises": [{"name": "Cable Lateral Raise", "ref": "shoulder-hip relation", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "2.5 kg/arm", "rir": "RIR 2-3", "rest": "60s"}, "cue": "New for you. An emphasised shoulder makes the waist look narrower — exactly the Hwasa effect. Lead with the elbow to shoulder height."}, {"name": "Wide Lat Pulldown", "ref": "back width", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "25 kg", "rir": "RIR 2-3", "rest": "90s"}, "cue": "Bar to the upper chest, squeeze the lats. The back width that makes the waist look smaller."}, {"name": "Cable Row (neutral)", "ref": "upper back", "focus": "a", "tier": "primary", "sets": 3, "reps": "10-12", "extras": {"load": "27 kg", "rir": "RIR 2-3", "rest": "75s"}, "cue": "Sit upright, pull to the belly, shoulder blades together. Posture plus the defined back look."}, {"name": "Hip Thrust (Dumbbell or Sandbag)", "ref": "glutes 2x/week", "focus": "g", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"rir": "RIR 2-3", "rest": "75s"}, "cue": "Glutes again — twice a week is what drives growth. Bench under the shoulders, the dumbbell or sandbag across the hips, and a folded towel under it, or the hip bones take the load instead of the glutes. Philipp does 2 maintenance sets at this station. A dumbbell runs out of weight long before your glutes do, so progress in this order: reps up to 15, then a 2-second squeeze at the top, then feet elevated, then one leg at a time. Reach for something heavier last, not first."}, {"name": "Rear Delt + Face Pull", "ref": "rear delt", "focus": "a", "tier": "primary", "sets": 3, "reps": "15", "extras": {"load": "5 kg", "rir": "RIR 1-2", "rest": "60s"}, "cue": "New — this was missing entirely. Rear delt fly straight into a face pull. Rear shoulder, posture and shoulder health in one."}, {"name": "Cable Biceps Curl", "ref": "arm detail", "focus": "a", "tier": "maint", "sets": 2, "reps": "15", "extras": {"load": "2.5 kg", "rir": "RIR 2-3", "rest": "45s"}, "cue": "Maintenance. Elbows fixed at your sides, curl up and squeeze, slow on the way down. Toned comes from control, not weight."}, {"name": "Cable Crunch", "ref": "core", "focus": "c", "tier": "maint", "sets": 3, "reps": "12-15", "extras": {"rir": "RIR 2-3", "rest": "45s"}, "cue": "Maintenance. Kneeling, fold the ribs towards the hips, hands fixed at the ears, slow on the way back.", "solo": "Philipp is on the leg curl"}], "durationMin": 55, "partner": "Philipp"}}}, "home": {"philipp": {"push": {"title": "Push + Taper", "day": "Home · Push", "focus": "Bodylastics — cable feel at home", "exercises": [{"name": "Band Lateral Raise (cross-body)", "ref": "gym: Cable Lat Raise", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "Yellow (L1)", "rir": "RIR 2", "rest": "60s"}, "cue": "Stand on the band with the opposite foot so it crosses the body — that keeps the tension at the bottom the way the cable does. Lead with the elbow."}, {"name": "Band Chest Press", "ref": "gym: Cable Chest Press", "focus": "a", "tier": "primary", "sets": 4, "reps": "10-12", "extras": {"load": "Red (L3) + Green (L2)", "rir": "RIR 2", "rest": "90s"}, "cue": "Anchor low behind you, stand away from the door, handles at chest height, press forward and upward. Feels almost identical to the cable. More tubes = more resistance."}, {"name": "Band Lat Pulldown (kneeling)", "ref": "gym: Lat Pulldown", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "Blue (L4) + Black (L5)", "rir": "RIR 2", "rest": "90s"}, "cue": "Anchor the band at the very top of the door. Kneeling, wide grip, pull the elbows down and out towards the ribs, squeeze the lats."}, {"name": "Band Triceps Pushdown", "ref": "gym: Triceps Pushdown", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "Red (L3)", "rir": "RIR 1-2", "rest": "60s"}, "cue": "High anchor, elbows fixed at your sides, press down until straight, squeeze."}, {"name": "Band Squat (light)", "ref": "gym: Leg Press", "focus": "g", "tier": "maint", "sets": 2, "reps": "20", "extras": {"load": "Blue (L4)", "rir": "RIR 3", "rest": "60s"}, "cue": "Maintenance. Stand on the tube, handles at the shoulders, high reps, light. Just hold."}, {"name": "Band Kneeling Crunch", "ref": "gym: Cable Crunch", "focus": "c", "tier": "maint", "sets": 3, "reps": "12-15", "extras": {"load": "Blue (L4)", "rir": "RIR 2", "rest": "45s"}, "cue": "Anchor the band high, kneeling, fold the ribs towards the hips, hands fixed at the ears."}, {"name": "Hollow Hold", "ref": "gym: Hollow Hold", "focus": "c", "tier": "maint", "sets": 3, "reps": "30s", "extras": {"rest": "45s"}, "cue": "Lower back flat, arms long. Build up to 40s."}], "durationMin": 45}, "pull": {"title": "Pull + Posture", "day": "Home · Pull", "focus": "Bodylastics — pulling + posture", "exercises": [{"name": "Band Lateral Raise (cross-body)", "ref": "gym: Cable Lat Raise", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "Yellow (L1)", "rir": "RIR 2", "rest": "60s"}, "cue": "Second side-delt hit. Opposite foot on the band for tension at the bottom, lead with the elbow."}, {"name": "Band Lat Pulldown (kneeling)", "ref": "gym: Lat Pulldown", "focus": "a", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "Blue (L4) + Black (L5)", "rir": "RIR 2", "rest": "90s"}, "cue": "Anchor the band high, kneeling, wide, elbows down and out — replaces the pull-up, no bar needed."}, {"name": "Band Seated Row (low anchor)", "ref": "gym: Cable Row", "focus": "a", "tier": "primary", "sets": 3, "reps": "10-12", "extras": {"load": "Blue (L4) + Black (L5)", "rir": "RIR 2", "rest": "90s"}, "cue": "Low anchor, or looped around both feet. Sit upright, pull to the belly, shoulder blades together."}, {"name": "Band Rear Delt Pull-Apart", "ref": "gym: Rear Delt Fly", "focus": "a", "tier": "primary", "sets": 3, "reps": "15", "extras": {"load": "Green (L2)", "rir": "RIR 1", "rest": "60s"}, "cue": "No anchor: band in both hands in front, arms straight, pull apart to the chest, lead with the little fingers."}, {"name": "Band Face Pull (mid anchor)", "ref": "gym: Face Pull", "focus": "a", "tier": "maint", "sets": 2, "reps": "15", "extras": {"load": "Green (L2)", "rir": "RIR 1", "rest": "45s"}, "cue": "Maintenance. Anchor at head height, pull to the forehead, elbows high and wide, rotate externally."}, {"name": "Band RDL (bilateral)", "ref": "gym: Hamstring Curl", "focus": "g", "tier": "maint", "sets": 2, "reps": "15", "extras": {"load": "Blue (L4) folded", "rir": "RIR 3", "rest": "60s"}, "cue": "Maintenance. Carabiners into one handle, stand on the loop, hinge back with a soft knee, 3s down, squeeze the glutes."}, {"name": "Band Biceps Curl", "ref": "gym: Cable Curl", "focus": "a", "tier": "maint", "sets": 2, "reps": "15", "extras": {"load": "Green (L2)", "rir": "RIR 2", "rest": "45s"}, "cue": "Maintenance. Stand on the band, elbows fixed, curl up, squeeze, slow on the way down."}], "durationMin": 45}}, "eunice": {"solo": {"title": "Lower + Push", "day": "Home · Lower", "focus": "Bodylastics — glute focus", "exercises": [{"name": "Band Hip Thrust", "ref": "gym: Hip Thrust", "focus": "g", "tier": "primary", "sets": 4, "reps": "15", "extras": {"load": "Blue (L4) folded", "rir": "RIR 2-3", "rest": "75s"}, "cue": "First — glutes are the priority. Tube over the feet (under the arch), shoulders on the sofa, handles over the hips. Your bodyweight anchors the tube. Drive up, squeeze 2s at the top."}, {"name": "Band Squat (wide + high)", "ref": "gym: Leg Press", "focus": "g", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "Blue (L4)", "rir": "RIR 2-3", "rest": "75s"}, "cue": "Stand on the tube, feet wider, handles at the shoulders, 3s down. Inner thigh plus glutes."}, {"name": "Band Adductor Squeeze (lying)", "ref": "gym: Adductor", "focus": "g", "tier": "primary", "sets": 3, "reps": "15-20", "extras": {"load": "light band", "rir": "RIR 1-2", "rest": "45s"}, "cue": "Band around the ankles, on your back, legs apart, squeeze together for 3s, open under control for 2s. Burns fast."}, {"name": "Band RDL (bilateral)", "ref": "gym: Leg Curl", "focus": "g", "tier": "primary", "sets": 3, "reps": "12-15", "extras": {"load": "Blue (L4) folded", "rir": "RIR 2-3", "rest": "75s"}, "cue": "Back of the leg. Carabiners into one handle, stand on it, soft knee, 3s hinging back, squeeze the glutes."}, {"name": "Push-Up (knee or standard)", "ref": "gym: Chest Press", "focus": "a", "tier": "maint", "sets": 2, "reps": "10-15", "extras": {"rir": "RIR 2-3", "rest": "60s"}, "cue": "Maintenance. Knee version to regress, 3s down. Chest and triceps in one."}, {"name": "Band Triceps Pushdown", "ref": "gym: Triceps Machine", "focus": "a", "tier": "maint", "sets": 2, "reps": "12-15", "extr ial street before the destination rather than the lot — about a 5 min walk each way, same spot every time, no detour. ~1800 steps round trip, ~9000/week", "badWeather": "park in the lot — no penalty rule", "evening": "pad during show/podcast, Zone 1, effortless NEAT", "why": "+3000 steps/day ≈ 200-250 kcal without compensation — bigger lever than the weight gap alone"}}, "progression": {"philipp": {"method": "double progression", "primaryRule": "start low in rep range (e.g. 12), climb over weeks to 15 across all sets, then raise load and drop back to 12. Side delt target: clean 15 → 6kg. Pulldown/row/chest: +2.5kg when all sets hit top of range. RIR 2 non-negotiable in a deficit.", "maintenanceRule": "2 sets, same weight as last time, RIR 3, never progress — one number, no decision", "missedSessionRule": "never two in a row. One missed session is life, two is a pattern. Sunday shared session is the safety net — minimum 1x/week structurally guaranteed.", "deload": "every 6-8 weeks, 1 light week at ~60%. In a deficit, err earlier — cortisol is the enemy of muscle retention."}, "eunice": {"method": "double progression, tuned for growth", "primaryRule": "form before load; on glutes she can push closer to failure (RIR 1-2)", "mindMuscle": "squeeze and hold at the top of every rep — feeling the muscle matters more than the number", "formFirst": "a clean rep beats a heavy one you don't feel in the target muscle", "deload": "every 8 weeks, 1 light week — needed less often than Philipp since she's building, not cutting"}}, "_gaps": ["Sessions still duplicate exercise objects instead of referencing exercises.json by id", "Eunice's loads are confirmed for the row, face pull and biceps curl only. Her hip thrust, leg press, adductor, leg curl, chest press, triceps and ab machine still carry no load at all — only RIR.", "Hip Thrust (Dumbbell or Sandbag) has no demo video; it replaced the glute drive machine on 2026-08-29.", "No warm-up anywhere in this file — zero sessions describe one. Friday opens on a lateral raise and reaches a 45 kg pulldown by the second exercise, which wants a ramp set. Adding one is a training decision, not a data fix.", "Eunice's hip thrust carries no load at all, which mattered less against a machine stack and matters now that it is a dumbbell or sandbag: without the number there is nothing to progress from, and the partner line on Philipp's card stays blank."]}, "routines": {"_source": ["skin_protocol.html conversations", "hair_protocol.html conversation"], "skincare": {"philipp": {"_source": "skin_protocol.html · Issue 2026-07", "_model": "weekly-phased — one AM routine; PM is a fixed 6-step base where only step 03 rotates by weekday, and the weekday schedule itself changes across three phases", "skinType": "combination — oily T-zone, normal-to-dry cheeks", "fitzpatrick": "III–IV", "focus": "prevention over correction", "concerns": ["under-eye dark circles (mostly pigment)", "texture and pores", "general photoaging prevention"], "applicationRule": "Thin before thick, wet before oil. Wait 30–60 seconds between steps for absorption. Apply to damp skin — except actives (adapalene, acids), which go on dry skin to reduce irritation.", "am": {"durationMin": 4, "_note": "Identical Mon → Sun. No thinking needed.", "steps": [{"step": "Cleanse", "product": "CeraVe Hydrating Cream-to-Foam", "how": "Lukewarm water, 20 seconds of gentle massage, rinse fully."}, {"step": "Vitamin C", "product": "Rohto Melano CC Premium Essence", "how": "3–4 drops · targeted on cheekbones and existing spots."}, {"step": "Eye area", "product": "CeraVe Eye Repair Cream", "how": "Ring finger · small dab per eye · tap along the orbital bone · never rub."}, {"step": "Moisturizer", "product": "Beauty of Joseon Dynasty Cream", "how": "Pea-sized amount, thin layer. Optional: skip on days the T-zone feels oily and go straight to sunscreen."}, {"step": "Sunscreen", "product": "Biore UV Aqua Rich (or BoJ Relief Sun)", "how": "Two full finger-lengths · face + neck + ears. Every day, indoor or outdoor."}]}, "pm": {"durationMin": 6, "_note": "Same steps every night. Only step 03 changes — the weekday tells you which bottle.", "steps": [{"step": "Cleanse", "product": "CeraVe Hydrating Cream-to-Foam", "how": "Heavy sunscreen day? Double cleanse — first pass with cleansing oil or micellar, then CeraVe."}, {"step": "Dry fully", "product": null, "how": "Wait 60–90 seconds until the skin is completely dry. Applying actives to damp skin sharply increases irritation.", "isWait": true}, {"step": "Active of the night", "product": null, "activeSlot": true}, {"step": "Hyaluronic acid", "product": "The Ordinary Hyaluronic Acid 2% + B5", "how": "On slightly damp skin, then press in gently. Buffers active nights, restores hydration on rest nights."}, {"step": "Eye area", "product": "Rohto Melano CC Moisture Cream", "how": "Rice-grain per eye · 3 dots along the orbital bone · ring finger · stay 5 mm below the lash line."}, {"step": "Moisturizer", "product": "Beauty of Joseon Dynasty Cream", "how": "Lock everything in."}]}, "actives": {"adapalene": {"name": "Differin Adapalene 0.1% (℞)", "how": "Pea-sized amount. Dot on forehead, both cheeks and chin, spread thin over the whole face. Stay 5 mm from the lash line and mouth corners. Weeks 1–4: wait 20 min before moisturizer, then directly."}, "bha": {"name": "Paula's Choice BHA 2% Liquid", "how": "Soak a cotton pad, swipe over the T-zone (forehead, nose, chin). One pass, no rubbing. Let absorb 30 seconds."}, "glycolic": {"name": "The Ordinary Glycolic Acid 7% Toner", "how": "Soak a cotton pad, sweep over the full face. Avoid the eye area. One pass. Optional — skip if the skin feels tight."}, "niacinamide": {"name": "The Ordinary Niacinamide 10%", "optional": true, "how": "Fingertip amount over the whole face. Gentle, no irritation risk. Optional — skipping step 03 entirely on a rest night is always fine."}}, "phases": [{"id": "weeks-1-4", "label": "Weeks 1–4", "subtitle": "Start here", "note": "Differin only 2× this phase. Wide spacing (Mon → Thu) gives skin time to adapt. Mild tightness is normal. Flaking around nose/mouth in week 3–4 — cover with balm, don't pick. Move on when skin has been calm for a full week.", "schedule": [{"day": "Mon", "active": "adapalene"}, {"day": "Tue", "active": "bha"}, {"day": "Wed", "active": "niacinamide"}, {"day": "Thu", "active": "adapalene"}, {"day": "Fri", "active": "niacinamide"}, {"day": "Sat", "active": "glycolic"}, {"day": "Sun", "active": "niacinamide"}]}, {"id": "weeks-5-8", "label": "Weeks 5–8", "subtitle": "Then this", "note": "Differin now 3×, glycolic paused. Skin may briefly look worse in weeks 5–6 (purging) — do not stop. By week 7–8 texture smooths. Move on when calm for a full week.", "schedule": [{"day": "Mon", "active": "adapalene"}, {"day": "Tue", "active": "bha"}, {"day": "Wed", "active": "adapalene"}, {"day": "Thu", "active": "niacinamide"}, {"day": "Fri", "active": "adapalene"}, {"day": "Sat", "active": "niacinamide"}, {"day": "Sun", "active": "niacinamide"}]}, {"id": "week-9-plus", "label": "Week 9+", "subtitle": "Final", "note": "The permanent schedule. Full rotation with all products. Stay here. Pea-size Differin, cotton pad for acids, eye area always spared.", "schedule": [{"day": "Mon", "active": "adapalene"}, {"day": "Tue", "active": "bha"}, {"day": "Wed", "active": "adapalene"}, {"day": "Thu", "active": "niacinamide"}, {"day": "Fri", "active": "adapalene"}, {"day": "Sat", "active": "glycolic"}, {"day": "Sun", "active": "niacinamide"}]}], "currentPhase": "week-9-plus", "_currentPhaseNote": "Defaults to the permanent schedule because that is what the app already held. The protocol is dated 2026-07, so weeks-5-8 is also plausible — switch it on the page if that is wrong. Getting this wrong means too much adapalene.", "safetyRules": [{"id": "no-adapalene-with-acids", "title": "Never combine adapalene and acids", "rule": "Adapalene together with AHA or BHA in one application massively irritates the skin without boosting results. Always separate nights. To exfoliate the same day: BHA in the morning, adapalene at night — and only when skin is calm.", "critical": true}, {"id": "retinoid-needs-spf", "title": "Retinoid without SPF is net-negative", "rule": "Retinoids temporarily increase UV sensitivity. Without daily sunscreen, new pigmentation forms faster than the retinoid clears old damage. If you are not committed to SPF every day, do not start adapalene.", "critical": true}, {"id": "spf-amount", "title": "Two finger-lengths of SPF, or it is useless", "rule": "SPF ratings are tested at 2 mg/cm² — roughly two strips along the index and middle finger for face and neck. Most people apply a quarter of that and get an effective SPF of ~15."}, {"id": "eye-never-rub", "title": "Never rub the eye area — always tap", "rule": "Under-eye skin is 4× thinner than the rest of the face. Repeated rubbing causes chronic micro-inflammation, which drives the very pigmentation you are treating. Ring finger only — it applies the least pressure by reflex."}, {"id": "patience", "title": "Judge at week 12, not week 3", "rule": "Vitamin C, adapalene and niacinamide need 8–12 weeks to show visible change. Photos every 4 weeks in the same lighting beat the daily mirror check."}], "eyeArea": {"type": "Mixed — mostly pigment. Brown-grey tone, melanin-dominant.", "structural": "Minor tear-trough shadow. Topicals cannot remove this part.", "target": "30–50% lighter in 3–6 months. Consistency beats intensity; full erasure is not possible with products alone.", "timeline": [{"when": "1–2 weeks", "what": "Puffiness down — eye cream plus sleep and lower salt/alcohol."}, {"when": "8–12 weeks", "what": "Pigment lightens — Moisture Cream + SPF + Essence. Judge with 4-week photos."}, {"when": "3–6 months", "what": "Substantial change. Ceiling: 30–50% lighter than baseline."}]}, "coreProducts": {"cleanser": "CeraVe Hydrating Cream-to-Foam — AM 01 + PM 01", "vitaminC": "Rohto Melano CC Premium Essence — AM 02", "eyeCreamAM": "CeraVe Eye Repair Cream — AM 03", "eyeCreamPM": "Rohto Melano CC Moisture Cream — PM 05, under-eye pigment", "moisturizer": "Beauty of Joseon Dynasty Cream — AM 04 + PM 06", "spf": "Biore UV Aqua Rich SPF 50+ PA++++ — AM 05, daily", "hyaluronic": "The Ordinary Hyaluronic Acid 2% + B5 — PM 04", "adapalene": "Differin Adapalene 0.1% — prescription in Germany; pharmacist-guided (指示藥品) in Taiwan, no Rx", "bha": "Paula's Choice Skin Perfecting 2% BHA Liquid", "glycolic": "The Ordinary Glycolic Acid 7% Toning Solution", "niacinamide": "The Ordinary Niacinamide 10% + Zinc 1%"}, "timeline": "Adapalene needs patience — meaningful texture and pore results from week 12+. Weeks 1–8 show little by design.", "weeklyTreatments": [{"id": "nailcare", "title": "Nail care", "day": "Wed", "cadence": "Weekly · Wednesdays", "everyDays": 7, "everyDaysMax": 9}], "nailCareProducts": {"cuticleStick": "Tweezerman Cuticle Stick — loosen/clean cuticles before pushing back", "clippers": "Wilkinson Sword Manicure Nail Clippers / Toenail Clippers with Nail Catcher", "file": "Zwilling Glas-Nagelfeile, doppelseitig, feine Körnung — shape after clipping", "cuticlePusher": "Tweezerman Cuticle Pusher — push back after softening, never cut cuticles", "handCream": "Balea (dm) Hand Cream Urea — finish, both hands"}}, "eunice": {"_source": "Hamburg Seasonal Skincare Masterplan (.docx), added 2026-08-29", "_model": "seasonal-weekly — four season plans, each with its own AM routine and a different PM protocol per weekday. Philipp uses the simpler 'weekly' model (one AM, one active per weekday), so a renderer has to handle both shapes.", "skinType": "mixed / Asian, age 37", "concerns": ["pores (nose area)", "horizontal neck rings", "structural jawline lifting"], "context": {"location": "Hamburg", "waterHardness": "hard — high calcium/magnesium; see the shared hair section for the measured 17.3 °dH"}, "safetyRules": [{"id": "mfu-boundaries", "title": "High Focus Shot (MFU) boundaries", "rule": "Maximum once per week. Completely avoid the eyeballs, eyelids, jawbone edge, lips and the centre of the neck (thyroid area). Target only the jowls, lower face sag and the sides of the neck.", "appliesTo": ["sat"], "critical": true}, {"id": "no-mix-actives", "title": "The no-mix actives rule", "rule": "Never use the Exosome Shot or the Booster Pro Air Shot on the same night as 0.2% Retinol, and never on a High Focus Shot night.", "critical": true}, {"id": "conductivity", "title": "The conductivity rule", "rule": "Use a thick layer of PDRN Booster Gel for the High Focus Shot, or PDRN Pink Peptide Serum for the Booster Pro. Oils (Freiöl, Rose Hip Oil) insulate — always apply them after device use, never before.", "critical": false}, {"id": "hard-water-shield", "title": "The 'Kalk' hard-water shield", "rule": "Hamburg tap water dulls skin and stretches pores. Use the Foreo in the evening to strip mineral buildup mechanically, and always apply The Ordinary HA 2% + B5 while the skin is still damp.", "critical": false}], "seasons": {"winter": {"months": "November – March", "monthNumbers": [11, 12, 1, 2, 3], "goal": "High-lipid shield against dry radiator heat and freezing winds, to stop neck rings cracking and deepening.", "am": {"durationMin": 3, "steps": ["Micellar water (or hydrating toner) on a pad — no hard tap water", "HA 2% + B5 while the skin is still damp from the wipe", "Nivea Day Cream", "SPF"]}, "pmWeekly": [{"day": "Mon", "focus": "Pores & active prep", "steps": ["Foreo Cleanse", "Exosome Shot", "PDRN Serum", "Booster Pro (Booster Mode)"]}, {"day": "Tue", "focus": "Cellular turnover", "steps": ["Foreo Cleanse", "PDRN Serum", "0.2% Retinol", "Nivea Night Cream + 2 drops Rose Hip Oil"]}, {"day": "Wed", "focus": "Midweek detox", "steps": ["Foreo Cleanse", "Freiöl", "Gua Sha (warm the oil in your hands first)"]}, {"day": "Thu", "focus": "Deep volumizing", "steps": ["Gentle Cleanse", "Exosome Shot", "PDRN Serum", "Booster Pro (Booster Mode – Le "toner": "Nivea Toner — Friday mornings, nose only, spring/summer/autumn", "sheetMask": "Sheet Mask"}}}, "hair": {"_source": "hair_protocol.html", "_status": "SHARED — one protocol, both people. Amounts and two treatments differ per person.", "context": {"location": "Hamburg", "waterHardness": "17.3 °dH — hard. Scale: 0 soft · 8.4 · 14 · 25+ very hard.", "why": "Sulfates strip natural oils from dense Asian hair, so the cuticle stays open and the texture turns rough and stiff. Conditioning seals it. On top of that, hard water leaves a calcium/magnesium film on every strand — that is what the weekly rinse removes.", "verify": "Test your own shower tap with strips on day 1 and again at week 8. The district average is a guess; your tap is the real number."}, "everyShower": {"_note": "Four steps, every wash, both of you. The citric rinse is NOT part of this — it is weekly.", "steps": [{"step": "Sulfate-free shampoo", "how": "Warm water. Work in from the roots, massage the scalp for ~60 sec. Check the INCI label — no SLS or SLES."}, {"step": "Rinse thoroughly", "how": "Warm water. A cold 10-second finish is fine if you like it, but the cold itself does not seal the cuticle — the weekly citric rinse does that."}, {"step": "Towel — pat, don't rub", "how": "Microfiber only. Press and squeeze sections. Rubbing roughens the cuticle and causes frizz."}, {"step": "Leave-in conditioner", "how": "Apply to damp hair. Do not rinse out.", "perPerson": {"philipp": "Pea-sized amount. Start at the ends and work up slightly — short hair needs less.", "eunice": "2–3× more product. Work from the ends up through the full length before touching the roots."}}]}, "scheduled": [{"id": "citric-rinse", "title": "Citric acid rinse", "cadence": "Weekly", "who": "both", "recipe": "¼ tsp citric acid per 500 ml warm water — target pH 4–5. Not ½ tsp; that is too acidic.", "order": "Shampoo → rinse → pour the citric solution over all hair → wait 1–2 min → rinse out → leave-in as normal.", "why": "At 17.3 °dH weekly is the right frequency. The acid dissolves the calcium/magnesium film that makes hair feel coated and stiff.", "caution": "Straw-like texture, brittleness, more tangles or scalp itch mean you are overdoing it. Do not go to 2× weekly, and stay at ¼ tsp.", "everyDays": 7, "afterStep": 2, "rank": 2}, {"id": "chelating", "title": "Chelating shampoo", "cadence": "Every 2–3 weeks", "who": "both", "recipe": "Malibu C Hard Water Wellness — use in place of your regular shampoo.", "order": "Lather, leave on 3–5 min, rinse fully. Follow immediately with a deep conditioner or your leave-in — do not skip that.", "why": "EDTA binds calcium and magnesium ions inside the hair shaft and pulls them out when you rinse. Regular shampoo — even sulfate-free — physically cannot do this.", "caution": "Strips moisture and protein if used too often. Every 2–3 weeks is enough; the weekly citric rinse handles maintenance in between.", "everyDays": 14, "everyDaysMax": 21, "replacesStep": 1, "rank": 0}, {"id": "deep-mask", "title": "Deep conditioning mask", "cadence": "Weekly", "who": "eunice", "recipe": "Any mask with glycerin, panthenol or argan oil — Cantu, OGX or Garnier.", "order": "After shampooing, before the citric rinse. Leave on 5–10 min in the shower steam, then rinse, run the citric rinse, apply leave-in.", "why": "Longer hair needs deeper conditioning to prevent split ends and manage tangling. Philipp's length does not need this layer.", "everyDays": 7, "afterStep": 2, "rank": 1}], "products": {"shampoo": {"_note": "Priority order — grab whichever you find first.", "options": [{"name": "Cantu Sulfate-Free Cleansing Cream", "rank": "1st choice", "price": "~€7–8", "where": "Rossmann · Amazon.de", "note": "Built for dense, coarse hair — the right match for both of you. Good lather despite being sulfate-free. Strong enough for 17.3 °dH."}, {"name": "HASK Repair + Argan Oil", "rank": "2nd choice", "price": "~€9", "where": "dm", "note": "473 ml, no SLS/SLES. Uses Sodium C14-16 Olefin Sulfonate — stronger than ideal, but better than classic sulfates."}, {"name": "Alverde Ultra Sensitiv", "rank": "Emergency only", "price": "~€3", "where": "dm", "note": "Cleanest INCI of all, but likely too gentle for dense hair at this hardness. Higher risk for Eunice — more mineral surface area. Switch back to Cantu if the scalp feels unclean after 48h."}]}, "leaveIn": {"_note": "A leave-in you don't rinse out — its job is to re-soften the cuticle the hard water roughened. A rich cream suits long, dense hair; a light keratin or oil spray suits short hair. Either works — the one thing to avoid is using a rinse-out conditioner as a leave-in. For a cream, look for glycerin or panthenol high on the INCI.", "options": [{"name": "Garnier Fructis Leave-in Creme Aloe Air Dry", "rank": "In the drugstore", "price": "~€6 · 400 ml", "where": "dm · Rossmann · Budni", "note": "This is the current name for the old \"Hair Drink\" — Garnier renamed the line, which is why searching the old name found nothing. Glycerin sits high on its list, exactly the humectant this protocol wants. Grab it in the aisle; Amazon stock is patchy."}, {"name": "Cantu Shea Butter Leave-In Repair Cream", "rank": "To order online", "price": "~€8", "where": "Amazon.de · dm", "note": "Same brand as your shampoo, built for dense, coarse hair. Search Amazon.de for \"Cantu Leave-In\" — reliably stocked there. Richer than the Garnier: pea-size for Philipp, 2–3× for Eunice."}, {"name": "Garnier Fructis Schadenlöscher 10-in-1 Leave-in (spray)", "rank": "A spray — good for short hair", "price": "~€6 · 150 ml", "where": "Amazon.de · dm · Rossmann", "note": "A keratin-and-oil spray rather than a glycerin cream — a different tool for the same job, and the lighter one. Ideal for short hair (Philipp): a spritz or two on damp ends, off the scalp; it also protects to 230 °C if you heat-style. Fine on long hair too (Eunice) — if it ever feels stiff or straw-like over weeks, that is keratin build-up, so drop to e function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

var DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function todayKey(){ return DAYS[(new Date().getDay() + 6) % 7]; }

function person(){ return PW.get(); }

/* ---- resolvers: each answers one question about today ---- */

function trainingToday(who, day){
  var rhythm = (D.training.weeklyRhythm[who] || []).filter(function(r){ return r.day === day; })[0];
  if(!rhythm) return null;
  if(rhythm.type !== "training") return { rest:true, what: rhythm.what };

  /* Preferred location first, then anywhere else. Sunday's shared session is
     defined at home and travel only — a gym-preferring person would find
     nothing there, and must never be handed a different day's session
     instead. That fallback used to show Tuesday's Push every Sunday. */
  var pref = "gym";
  try{
    var st = JSON.parse(localStorage.getItem("hub.workout." + who) || "null");
    if(st && st.loc && D.training.sessions[st.loc]) pref = st.loc;
  }catch(e){}

  var LONG = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",
              Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};
  var want = LONG[day].toLowerCase();

  function findAt(loc){
    var atLoc = D.training.sessions[loc] || {};
    var pool = [];
    Object.keys(atLoc[who] || {}).forEach(function(k){ pool.push(atLoc[who][k]); });
    Object.keys(atLoc.shared || {}).forEach(function(k){ pool.push(atLoc.shared[k]); });
    return pool.filter(function(s){
      return (s.day||"").toLowerCase().indexOf(want) !== -1;
    })[0] || null;
  }

  var order = [pref].concat(Object.keys(D.training.sessions).filter(function(l){
    return l !== pref;
  }));
  for(var i = 0; i < order.length; i++){
    var hit = findAt(order[i]);
    if(hit) return { rest:false, session:hit, loc:order[i],
                     elsewhere:(order[i] !== pref), what:rhythm.what };
  }

  /* A training day with no session recorded for it. Say so plainly. */
  return { rest:false, session:null, what:rhythm.what };
}

/* Hair, but only when it has something to say. Same one-date-per-treatment
   store the Hair page writes — the Hub reads it, never writes it. */
function hairDue(who){
  var sched = (D.routines.hair && D.routines.hair.scheduled) || [];
  var code = PW.PEOPLE[who].code;
  var t0 = new Date(); t0.setHours(0,0,0,0);

  return sched.filter(function(t){
    return t.who === "both" || t.who === who;
  }).map(function(t){
    var raw = null;
    try{ raw = localStorage.getItem("hub.hair.done." + t.id + "." + code); }catch(e){}
    if(!raw) return { t:t, state:"unknown", days:null };
    var d = new Date(raw + "T00:00:00");
    if(isNaN(d)) return { t:t, state:"unknown", days:null };
    var days = Math.round((t0 - d) / 86400000);
    var due = t.everyDays || 7;
    var late = t.everyDaysMax || due;
    if(days === 0) return { t:t, state:"done", days:0 };
    if(days >= late && late > due) return { t:t, state:"late", days:days };
    if(days > due && late === due) return { t:t, state:"late", days:days };
    if(days >= due) return { t:t, state:"due", days:days };
    return { t:t, state:"soon", days:days };
  }).filter(function(x){
    return x.state === "due" || x.state === "late" || x.state === "unknown";
  });
}

function seasonFor(r){
  if(!r.seasons) return null;
  var m = new Date().getMonth()+1;
  for(var k in r.seasons){
    if(r.seasons[k].monthNumbers.indexOf(m) !== -1) return r.seasons[k];
  }
  return null;
}

function skincareToday(who, day){
  var r = D.routines.skincare[who];
  if(!r) return null;
  var season = seasonFor(r);
  var out = { am:null, pm:null, pmLabel:null, rules:[] };

  if(season){
    out.am = season.am;
    var ev = season.pmWeekly.filter(function(e){ return e.day === day; })[0];
    if(ev){ out.pm = ev.steps.join(" · "); out.pmLabel = ev.focus; }
  } else if(r.phases){
    out.am = r.am;
    var want = null;
    try{ want = localStorage.getItem("hub.phase." + who); }catch(e){}
    var phase = r.phases.filter(function(p){ return p.id === (want || r.currentPhase); })[0]
             || r.phases[r.phases.length-1];
    var entry = phase.schedule.filter(function(e){ return e.day === day; })[0];
    var act = entry && entry.active && r.actives[entry.active];
    out.pmLabel = act ? act.name : "Rest night";
    out.pm = act ? "Cleanse · dry fully · " + act.name.toLowerCase() + " · hyaluronic · eye · moisturise"
                 : "Cleanse · hyaluronic · eye · moisturise";
  }

  out.rules = (r.safetyRules || []).filter(function(x){
    return x.appliesTo && x.appliesTo.indexOf(day.toLowerCase()) !== -1 && x.critical;
  });
  return out;
}

function card(href, accent, kicker, meta, headline, detail){
  return '<a class="card" href="' + href + '" style="--accent:' + accent + '">' +
    '<div class="ch"><span class="k">' + esc(kicker) + '</span>' +
    (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') + '</div>' +
    '<div class="cb"><div class="headline">' + headline + '</div>' +
    (detail ? '<div class="detail">' + detail + '</div>' : '') +
    '</div></a>';
}

function render(){
  var who = person();
  var day = todayKey();
  var hour = new Date().getHours();
  var prof = D.profiles.people[who];

  document.getElementById("name").textContent = PW.PEOPLE[who].name;

  var skin = skincareToday(who, day);
  var train = trainingToday(who, day);

  /* Morning */
  var morning = "";
  if(skin && skin.am){
    var steps = skin.am.steps.map(function(s){
      return typeof s === "string" ? s : s.step;
    });
    morning = card("skincare/", "var(--skin)", "Morning",
      skin.am.durationMin ? skin.am.durationMin + " min" : "",
      esc(steps.length + " steps"),
      esc(steps.join(" · ")));
  }

  /* Training */
  var training = "";
  if(train){
    if(train.rest){
      training = card("workout/", "var(--train)", "Training", "",
        '<span class="rest">' + esc(train.what || "Rest day") + '</span>', "");
    } else if(!train.session){
      /* Better to admit the gap than to show the wrong workout. */
      training = card("workout/", "var(--train)", "Training", "",
        '<span class="rest">' + esc(train.what || "Training day") + '</span>',
        "No session recorded for today.");
    } else {
      var s = train.session;
      var names = s.exercises.slice(0,3).map(function(e){ return e.name; }).join(" · ");
      var together = /together|with /i.test(s.day || "");
      training = card("workout/", "var(--train)", "Training",
        train.loc.charAt(0).toUpperCase() + train.loc.slice(1) +
          (together ? " · together" : ""),
        esc(s.title),
        '<span class="pw-num">' + s.exercises.length + ' exercises</span>' +
        (s.durationMin ? ' <span class="sep">·</span> <span class="pw-num">~' + s.durationMin + ' min</span>' : '') +
        '<br>' + esc(names) + ' …');
    }
  }

  /* Food — the targets are constants and were the only thing this card showed.
     What actually changed today is the plan, and it was already sitting in
     localStorage one page away. */
  var t = prof.dailyTargets;
  var blocks = D.kitchen.asianMacroBase.blockRules.standardLeanDish;

  var plan = null;
  try{ plan = JSON.parse(localStorage.getItem("hub.kitchen.plan") || "null"); }catch(e){}
  function mealName(id){ return id && D.mealTitles[id] ? D.mealTitles[id] : null; }
  var lunch  = plan ? mealName(plan.lunch)  : null;
  var dinner = plan ? mealName(plan.dinner) : null;

  var targetsRow =
    '<div class="targets">' +
      '<div>Protein<b>' + t.proteinG + ' g</b></div>' +
      '<div>Fibre<b>' + t.fiberG + ' g</b></div>' +
      '<div>Fat<b>' + t.fatG + ' g</b></div>' +
    '</div>';

  var food;
  if(lunch || dinner){
    /* Lead with the meal you have not eaten yet. */
    var next = (hour >= 15 ? (dinner || lunch) : (lunch || dinner));
    food = card("kitchen/", "var(--food)", "Food",
      t.calories + " kcal",
      esc(next),
      '<div class="meals">' +
        (lunch  ? '<div><span>Lunch</span>'  + esc(lunch)  + '</div>' : '') +
        (dinner ? '<div><span>Dinner</span>' + esc(dinner) + '</div>' : '') +
      '</div>' + targetsRow);
  } else {
    food = card("kitchen/", "var(--food)", "Food",
      blocks + (blocks === 1 ? " block / meal" : " blocks / meal"),
      esc(t.calories + " kcal"),
      targetsRow);
  }

  /* Why the number changed. Without this the target just moves one day and
     the scale goes up a kilo two days later, which reads as failure. */
  var ph = prof._phase;
  if(ph){
    food = food.replace("</a>",
      '</a><div class="phase"><div class="pt">' + esc(ph.name) + '</div>' +
      '<div class="pm">' + (ph.was == null ? '' :
        'was ' + esc(String(ph.was)) + ' kcal <span class="sep">·</span> ') +
      'review ' + esc(ph.reviewOn) + '</div>' +
      /* The reasoning matters, but not at a glance — a dashboard is for
         recognition, and this was 45 words of it. */
      (ph.expect ? '<details class="why"><summary>What to expect</summary>' +
        '<p>' + esc(ph.expect) + '</p></details>' : '') +
      '</div>');
  }

  /* Tonight */
  var tonight = "";
  if(skin && skin.pm){
    tonight = card("skincare/", "var(--skin)", "Tonight", "",
      esc(skin.pmLabel || "Evening routine"), esc(skin.pm));
    if(skin.rules.length){
      var r = skin.rules[0];
      tonight = tonight.replace("</a>",
        '</a><div class="warn"><div><div class="wt">&#9888; ' + esc(r.title) + '</div>' +
        '<p>' + esc(r.rule) + '</p></div></div>');
    }
  }

  /* Hair — silent unless something is actually due. A card that says
     "nothing to do" every day is a card you stop reading. */
  var hair = "";
  var due = hairDue(who);
  if(due.length){
    var lead = due[0];
    hair = card("hair/", "var(--hair)", "Hair",
      due.length > 1 ? due.length + " due" : "",
      esc(lead.t.title),
      esc(lead.state === "unknown"
            ? "Never logged — " + lead.t.cadence.toLowerCase()
            : lead.state === "late"
              ? "Overdue — last done " + lead.days + " days ago"
              : "Due — last done " + lead.days + " days ago") +
      (due.length > 1
        ? ' <span class="sep">·</span> plus ' + esc(due[1].t.title.toLowerCase())
        : ''));
  }

  /* After 18:00 tonight leads. Before that, the morning does. */
  var order = hour >= 18
    ? [tonight, hair, training, food, morning]
    : [morning, hair, training, food, tonight];

  document.getElementById("today").innerHTML = order.join("");
}

/* header chrome */
(function(){
  var d = new Date();
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
  document.getElementById("date").textContent =
    days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()];
  var h = d.getHours();
  document.getElementById("greeting").textContent =
    h < 5 ? "Good night" : h < 11 ? "Good morning" : h < 18 ? "Hello" : "Good evening";
})();

(function(){
  var el = document.getElementById("status");
  function paint(){
    el.textContent = navigator.onLine ? "Available offline" : "Offline — showing saved version";
    el.classList.toggle("offline", !navigator.onLine);
  }
  window.addEventListener("online", paint);
  window.addEventListener("offline", paint);
  paint();
})();

PW.mountRail();
PW.mountThemeToggle(document.getElementById("themeslot"), "in");
PW.mountSwitcher(document.getElementById("switcher"));
PW.mountTabs("hub", "");
window.addEventListener("pw:person", render);
render();
PW.registerServiceWorker("sw.js");
</script>
