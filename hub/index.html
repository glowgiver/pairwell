<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pairwell</title>
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pairwell">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css?v=86fee2d7">
<style>
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--f-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;max-width:600px;margin:0 auto;
    padding:
      calc(env(safe-area-inset-top) + 20px)
      calc(env(safe-area-inset-right) + 18px)
      calc(var(--bar) + 26px)
      calc(env(safe-area-inset-left) + 18px);
  }

  header{margin-bottom:22px}
  .date{
    font-family:var(--f-data);font-size:13px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted2);margin:0 0 7px;
  }
  h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.025em;margin:0}
  h1 .who{color:var(--who-active,var(--philipp))}

  /* One card per part of the day. The accent says which module it belongs to,
     so the colour is doing navigational work, not decoration. */
  .card{
    display:block;text-decoration:none;color:inherit;
    background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:0 16px 16px 0;margin-bottom:12px;overflow:hidden;
    transition:background .18s ease, transform .18s ease;
  }
  .card:active{background:var(--surface-2);transform:scale(.99)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .ch{display:flex;align-items:baseline;gap:10px;padding:14px 18px 0}
  .ch .k{
    font-family:var(--f-data);font-size:13px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  }
  .ch .meta{font-family:var(--f-data);font-size:13px;color:var(--muted2);margin-left:auto}
  .cb{padding:8px 18px 16px}
  .headline{font-size:19px;font-weight:600;letter-spacing:-.012em;line-height:1.35}
  .detail{
    font-family:var(--f-read);font-size:15px;line-height:1.55;
    color:var(--muted);margin-top:5px;
  }
  .detail .sep{color:var(--muted2)}
  .rest{color:var(--muted)}

  .warn{
    display:flex;gap:9px;align-items:flex-start;
    margin:10px 18px 14px;padding:11px 13px;
    border-radius:0 10px 10px 0;border-left:3px solid var(--warn);
    background:var(--warn-fill);
  }
  .warn .wt{
    font-family:var(--f-data);font-size:12.5px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--warn);
  }
  .warn p{margin:4px 0 0;font-family:var(--f-read);font-size:14.5px;line-height:1.5;color:var(--text)}

  .targets{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
  .targets div{font-family:var(--f-data);font-size:13px;color:var(--muted2);
    font-variant-numeric:tabular-nums}
  .targets b{display:block;font-size:17px;color:var(--text);font-weight:700;margin-top:2px}

  footer{
    margin-top:26px;font-family:var(--f-data);font-size:13px;color:var(--muted2);
    display:flex;justify-content:space-between;align-items:center;
  }
  #status.offline{color:var(--food)}

  @media (prefers-reduced-motion:reduce){
    .card{transition:none} .card:active{transform:none}
  }
</style>
</head>
<body>

<div class="pw-bar">
  <span></span>
  <div id="switcher"></div>
</div>

<header>
  <p class="date" id="date">Pairwell</p>
  <h1><span id="greeting">Hello</span>, <span class="who" id="name">Philipp</span></h1>
</header>

<main id="today"></main>

<footer>
  <span id="status">Available offline</span>
  <span>v3</span>
</footer>

e, rinse fully."}, {"step": "Vitamin C", "product": "Rohto Melano CC Premium Essence", "how": "3–4 drops · targeted on cheekbones and existing spots."}, {"step": "Eye area", "product": "CeraVe Eye Repair Cream", "how": "Ring finger · small dab per eye · tap along the orbital bone · never rub."}, {"step": "Moisturizer", "product": "Beauty of Joseon Dynasty Cream", "how": "Pea-sized amount, thin layer. Optional: skip on days the T-zone feels oily and go straight to sunscreen."}, {"step": "Sunscreen", "product": "Biore UV Aqua Rich (or BoJ Relief Sun)", "how": "Two full finger-lengths · face + neck + ears. Every day, indoor or outdoor."}]}, "pm": {"durationMin": 6, "_note": "Same steps every night. Only step 03 changes — the weekday tells you which bottle.", "steps": [{"step": "Cleanse", "product": "CeraVe Hydrating Cream-to-Foam", "how": "Heavy sunscreen day? Double cleanse — first pass with cleansing oil or micellar, then CeraVe."}, {"step": "Dry fully", "product": null, "how": "Wait 60–90 seconds until the skin is completely dry. Applying actives to damp skin sharply increases irritation.", "isWait": true}, {"step": "Active of the night", "product": null, "activeSlot": true}, {"step": "Hyaluronic acid", "product": "The Ordinary Hyaluronic Acid 2% + B5", "how": "On slightly damp skin, then press in gently. Buffers active nights, restores hydration on rest nights."}, {"step": "Eye area", "product": "Rohto Melano CC Moisture Cream", "how": "Rice-grain per eye · 3 dots along the orbital bone · ring finger · stay 5 mm below the lash line."}, {"step": "Moisturizer", "product": "Beauty of Joseon Dynasty Cream", "how": "Lock everything in."}]}, "actives": {"adapalene": {"name": "Differin Adapalene 0.1% (℞)", "how": "Pea-sized amount. Dot on forehead, both cheeks and chin, spread thin over the whole face. Stay 5 mm from the lash line and mouth corners. Weeks 1–4: wait 20 min before moisturizer, then directly."}, "bha": {"name": "Paula's Choice BHA 2% Liquid", "how": "Soak a cotton pad, swipe over the T-zone (forehead, nose, chin). One pass, no rubbing. Let absorb 30 seconds."}, "glycolic": {"name": "The Ordinary Glycolic Acid 7% Toner", "how": "Soak a cotton pad, sweep over the full face. Avoid the eye area. One pass. Optional — skip if the skin feels tight."}, "niacinamide": {"name": "The Ordinary Niacinamide 10%", "optional": true, "how": "Fingertip amount over the whole face. Gentle, no irritation risk. Optional — skipping step 03 entirely on a rest night is always fine."}}, "phases": [{"id": "weeks-1-4", "label": "Weeks 1–4", "subtitle": "Start here", "note": "Differin only 2× this phase. Wide spacing (Mon → Thu) gives skin time to adapt. Mild tightness is normal. Flaking around nose/mouth in week 3–4 — cover with balm, don't pick. Move on when skin has been calm for a full week.", "schedule": [{"day": "Mon", "active": "adapalene"}, {"day": "Tue", "active": "bha"}, {"day": "Wed", "active": "niacinamide"}, {"day": "Thu", "active": "adapalene"}, {"day": "Fri", "active": "niacinamide"}, {"day": "Sat", "active": "glycolic"}, {"day": "Sun", "active": "niacinamide"}]}, {"id": "weeks-5-8", "label": "Weeks 5–8", "subtitle": "Then this", "note": "Differin now 3×, glycolic paused. Skin may briefly look worse in weeks 5–6 (purging) — do not stop. By week 7–8 texture smooths. Move on when calm for a full week.", "schedule": [{"day": "Mon", "active": "adapalene"}, {"day": "Tue", "active": "bha"}, {"day": "Wed", "active": "adapalene"}, {"day": "Thu", "active": "niacinamide"}, {"day": "Fri", "active": "adapalene"}, {"day": "Sat", "active": "niacinamide"}, {"day": "Sun", "active": "niacinamide"}]}, {"id": "week-9-plus", "label": "Week 9+", "subtitle": "Final", "note": "The permanent schedule. Full rotation with all products. Stay here. Pea-size Differin, cotton pad for acids, eye area always spared.", "schedule": [{"day": "Mon", "active": "adapalene"}, {"day": "Tue", "active": "bha"}, {"day": "Wed", "active": "adapalene"}, {"day": "Thu", "active": "niacinamide"}, {"day": "Fri", "active": "adapalene"}, {"day": "Sat", "active": "glycolic"}, {"day": "Sun", "active": "niacinamide"}]}], "currentPhase": "week-9-plus", "_currentPhaseNote": "Defaults to the permanent schedule because that is what the app already held. The protocol is dated 2026-07, so weeks-5-8 is also plausible — switch it on the page if that is wrong. Getting this wrong means too much adapalene.", "safetyRules": [{"id": "no-adapalene-with-acids", "title": "Never combine adapalene and acids", "rule": "Adapalene together with AHA or BHA in one application massively irritates the skin without boosting results. Always separate nights. To exfoliate the same day: BHA in the morning, adapalene at night — and only when skin is calm.", "critical": true}, {"id": "retinoid-needs-spf", "title": "Retinoid without SPF is net-negative", "rule": "Retinoids temporarily increase UV sensitivity. Without daily sunscreen, new pigmentation forms faster than the retinoid clears old damage. If you are not committed to SPF every day, do not start adapalene.", "critical": true}, {"id": "spf-amount", "title": "Two finger-lengths of SPF, or it is useless", "rule": "SPF ratings are tested at 2 mg/cm² — roughly two strips along the index and middle finger for face and neck. Most people apply a quarter of that and get an effective SPF of ~15."}, {"id": "eye-never-rub", "title": "Never rub the eye area — always tap", "rule": "Under-eye skin is 4× thinner than the rest of the face. Repeated rubbing causes chronic micro-inflammation, which drives the very pigmentation you are treating. Ring finger only — it applies the least pressure by reflex."}, {"id": "patience", "title": "Judge at week 12, not week 3", "rule": "Vitamin C, adapalene and niacinamide need 8–12 weeks to show visible change. Photos every 4 weeks in the same lighting beat the daily mirror check."}], "eyeArea": {"type": "Mixed — mostly pigment. Brown-grey tone, melanin-dominant.", "structural": "Minor tear-trough sha function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

var DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function todayKey(){ return DAYS[(new Date().getDay() + 6) % 7]; }

function person(){ return PW.get(); }

/* ---- resolvers: each answers one question about today ---- */

function trainingToday(who, day){
  var rhythm = (D.training.weeklyRhythm[who] || []).filter(function(r){ return r.day === day; })[0];
  if(!rhythm) return null;
  if(rhythm.type !== "training") return { rest:true, what: rhythm.what };

  /* Find the session whose day label mentions today, at whichever location
     that person last used. Falls back to the first session. */
  var loc = "gym";
  try{
    var st = JSON.parse(localStorage.getItem("hub.workout." + who) || "null");
    if(st && st.loc && D.training.sessions[st.loc]) loc = st.loc;
  }catch(e){}
  var atLoc = D.training.sessions[loc] || {};
  var pool = [];
  Object.keys(atLoc[who] || {}).forEach(function(k){ pool.push(atLoc[who][k]); });
  Object.keys(atLoc.shared || {}).forEach(function(k){ pool.push(atLoc.shared[k]); });

  var LONG = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",
              Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};
  var hit = pool.filter(function(s){
    return (s.day||"").toLowerCase().indexOf(LONG[day].toLowerCase()) !== -1;
  })[0] || pool[0];

  return hit ? { rest:false, session:hit, loc:loc, what:rhythm.what } : { rest:true, what:rhythm.what };
}

function seasonFor(r){
  if(!r.seasons) return null;
  var m = new Date().getMonth()+1;
  for(var k in r.seasons){
    if(r.seasons[k].monthNumbers.indexOf(m) !== -1) return r.seasons[k];
  }
  return null;
}

function skincareToday(who, day){
  var r = D.routines.skincare[who];
  if(!r) return null;
  var season = seasonFor(r);
  var out = { am:null, pm:null, pmLabel:null, rules:[] };

  if(season){
    out.am = season.am;
    var ev = season.pmWeekly.filter(function(e){ return e.day === day; })[0];
    if(ev){ out.pm = ev.steps.join(" · "); out.pmLabel = ev.focus; }
  } else if(r.phases){
    out.am = r.am;
    var want = null;
    try{ want = localStorage.getItem("hub.phase." + who); }catch(e){}
    var phase = r.phases.filter(function(p){ return p.id === (want || r.currentPhase); })[0]
             || r.phases[r.phases.length-1];
    var entry = phase.schedule.filter(function(e){ return e.day === day; })[0];
    var act = entry && entry.active && r.actives[entry.active];
    out.pmLabel = act ? act.name : "Rest night";
    out.pm = act ? "Cleanse · dry fully · " + act.name.toLowerCase() + " · hyaluronic · eye · moisturise"
                 : "Cleanse · hyaluronic · eye · moisturise";
  }

  out.rules = (r.safetyRules || []).filter(function(x){
    return x.appliesTo && x.appliesTo.indexOf(day.toLowerCase()) !== -1 && x.critical;
  });
  return out;
}

function card(href, accent, kicker, meta, headline, detail){
  return '<a class="card" href="' + href + '" style="--accent:' + accent + '">' +
    '<div class="ch"><span class="k">' + esc(kicker) + '</span>' +
    (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') + '</div>' +
    '<div class="cb"><div class="headline">' + headline + '</div>' +
    (detail ? '<div class="detail">' + detail + '</div>' : '') +
    '</div></a>';
}

function render(){
  var who = person();
  var day = todayKey();
  var hour = new Date().getHours();
  var prof = D.profiles.people[who];

  document.getElementById("name").textContent = PW.PEOPLE[who].name;

  var skin = skincareToday(who, day);
  var train = trainingToday(who, day);

  /* Morning */
  var morning = "";
  if(skin && skin.am){
    var steps = skin.am.steps.map(function(s){
      return typeof s === "string" ? s : s.step;
    });
    morning = card("skincare/", "var(--skin)", "Morning",
      skin.am.durationMin ? skin.am.durationMin + " min" : "",
      esc(steps.length + " steps"),
      esc(steps.join(" · ")));
  }

  /* Training */
  var training = "";
  if(train){
    if(train.rest){
      training = card("workout/", "var(--train)", "Training", "",
        '<span class="rest">' + esc(train.what || "Rest day") + '</span>', "");
    } else {
      var s = train.session;
      var names = s.exercises.slice(0,3).map(function(e){ return e.name; }).join(" · ");
      training = card("workout/", "var(--train)", "Training",
        train.loc.charAt(0).toUpperCase()+train.loc.slice(1),
        esc(s.title),
        '<span class="pw-num">' + s.exercises.length + ' exercises</span>' +
        (s.durationMin ? ' <span class="sep">·</span> <span class="pw-num">~' + s.durationMin + ' min</span>' : '') +
        '<br>' + esc(names) + ' …');
    }
  }

  /* Food */
  var t = prof.dailyTargets;
  var blocks = D.kitchen.asianMacroBase.blockRules.standardLeanDish;
  var food = card("kitchen/", "var(--food)", "Food",
    blocks + " blocks / meal",
    esc(t.calories + " kcal"),
    '<div class="targets">' +
      '<div>Protein<b>' + t.proteinG + ' g</b></div>' +
      '<div>Fibre<b>' + t.fiberG + ' g</b></div>' +
      '<div>Fat<b>' + t.fatG + ' g</b></div>' +
    '</div>');

  /* Tonight */
  var tonight = "";
  if(skin && skin.pm){
    tonight = card("skincare/", "var(--skin)", "Tonight", "",
      esc(skin.pmLabel || "Evening routine"), esc(skin.pm));
    if(skin.rules.length){
      var r = skin.rules[0];
      tonight = tonight.replace("</a>",
        '</a><div class="warn"><div><div class="wt">&#9888; ' + esc(r.title) + '</div>' +
        '<p>' + esc(r.rule) + '</p></div></div>');
    }
  }

  /* After 18:00 tonight leads. Before that, the morning does. */
  var order = hour >= 18
    ? [tonight, training, food, morning]
    : [morning, training, food, tonight];

  document.getElementById("today").innerHTML = order.join("");
}

/* header chrome */
(function(){
  var d = new Date();
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
  document.getElementById("date").textContent =
    days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()];
  var h = d.getHours();
  document.getElementById("greeting").textContent =
    h < 5 ? "Good night" : h < 11 ? "Good morning" : h < 18 ? "Hello" : "Good evening";
})();

(function(){
  var el = document.getElementById("status");
  function paint(){
    el.textContent = navigator.onLine ? "Available offline" : "Offline — showing saved version";
    el.classList.toggle("offline", !navigator.onLine);
  }
  window.addEventListener("online", paint);
  window.addEventListener("offline", paint);
  paint();
})();

PW.mountRail();
PW.mountThemeToggle(document.getElementById("switcher"));
PW.mountSwitcher(document.getElementById("switcher"));
PW.mountTabs(null, "");
window.addEventListener("pw:person", render);
render();
PW.registerServiceWorker("sw.js");
</script>
