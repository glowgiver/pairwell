<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen · Pairwell</title>
<meta name="theme-color" content="#0B1220">
<link rel="stylesheet" href="../app.css?v=7b31c9e5">
<style>
  :root{ --accent:var(--food); }

  body{
    background:var(--bg);color:var(--text);
    font-family:var(--f-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;max-width:600px;margin:0 auto;
    padding:
      calc(env(safe-area-inset-top) + 20px)
      calc(env(safe-area-inset-right) + 18px)
      calc(var(--bar) + 26px)
      calc(env(safe-area-inset-left) + 18px);
  }

  h1{font-size:29px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;color:var(--accent)}
  .sub{font-family:var(--f-read);font-size:15.5px;line-height:1.6;color:var(--muted);margin:0 0 20px}

  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:16px;margin-bottom:14px;overflow:hidden;
  }
  .ch{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:15px 18px 12px;border-bottom:1px solid var(--line);
  }
  .ch .k{
    font-family:var(--f-data);
    font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);
  }
  .ch .meta{font-family:var(--f-data);font-size:13px;color:var(--muted2);margin-left:auto}
  .ch .title{font-size:17px;font-weight:600;width:100%;margin-top:3px;letter-spacing:-.01em}

  /* ---- the day ledger: what the person switcher is for on this page ---- */
  .ledger{padding:2px 0}
  /* The fine-tuning line sits under the ledger and only appears on a fully
     planned day. Quiet by default, amber when the gap is too big for powder. */
  .finetune{margin:8px 0 0;padding:10px 12px;border-radius:10px;font:400 13px/1.45 var(--f-read);
            background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--food)}
  .finetune b{font-family:var(--f-data);font-variant-numeric:tabular-nums}
  .finetune.warn{background:transparent;border-style:dashed;color:var(--muted)}
  .lrow{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:13px 18px;align-items:baseline}
  .lrow+.lrow{border-top:1px solid var(--line)}
  .lrow .lb{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .lrow .ls span.tag{
    font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);
  }
  .lrow .lv{
    font-family:var(--f-data);font-size:16px;font-weight:600;
    font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;
  }
  .lrow .ls{grid-column:1/-1;display:flex;gap:13px;flex-wrap:wrap;margin-top:5px}
  .lrow .ls span{font-family:var(--f-data);font-size:13px;color:var(--muted2);
    font-variant-numeric:tabular-nums}
  .lrow .ls b{color:var(--text);font-weight:600}
  .lrow.left{background:var(--surface-2)}
  .lrow.left .lb{color:var(--accent)}
  .lrow.left .lv{color:var(--accent)}
  .lrow .ls span.short b{color:var(--warn)}

  .empty{
    padding:16px 18px;font-family:var(--f-read);font-size:15px;
    line-height:1.6;color:var(--muted);
  }
  .rmac{display:flex;gap:13px;flex-wrap:wrap;padding:0 18px 14px}
  .rmac span{font-family:var(--f-data);font-size:13px;color:var(--muted2);
    font-variant-numeric:tabular-nums}
  .rmac b{color:var(--text);font-weight:600}
  .card details{
    background:transparent;border:0;border-top:1px solid var(--line);
    border-radius:0;margin:0;
  }
  .card details summary{font-size:15px;font-weight:500;color:var(--muted)}
  .rnote{
    border-top:1px solid var(--line);padding:14px 18px;
    font-family:var(--f-read);font-size:14.5px;line-height:1.6;color:var(--muted);
  }
  .rnote b{color:var(--text);font-weight:600}
  .brief{padding:4px 18px 16px}
  .brief .env{
    font-family:var(--f-data);font-size:15px;font-weight:600;color:var(--accent);
    font-variant-numeric:tabular-nums;padding:10px 0 4px;line-height:1.5;
  }
  .brief h4{
    font-family:var(--f-data);font-size:13px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted2);margin:14px 0 6px;
  }
  .brief ul{margin:0;padding:0;list-style:none}
  .brief li{
    font-family:var(--f-read);font-size:15px;line-height:1.55;color:var(--muted);
    padding:4px 0 4px 16px;position:relative;
  }
  .brief li::before{content:"";position:absolute;left:0;top:11px;
    width:5px;height:5px;border-radius:50%;background:var(--muted2)}
  .brief p{margin:8px 0 0;font-family:var(--f-read);font-size:14.5px;
    line-height:1.6;color:var(--muted2)}
  .rnote .path{
    display:block;margin-top:7px;font-family:var(--f-data);font-size:13px;
    color:var(--accent);letter-spacing:.01em;
  }
  /* The second step is the one that gets forgotten, so it gets its own line
     rather than trailing off the end of a paragraph. */
  .rnote .then{
    display:block;margin-top:11px;padding-top:11px;
    border-top:1px solid var(--line);
  }
  .rnote .then b{display:block;margin-bottom:2px}
  .card details[open] summary{color:var(--text);border-bottom:1px solid var(--line)}

  /* ---- the splitter: the reason this page exists ---- */
  .weigh{padding:18px}
  .weigh label{
    display:block;font-family:var(--f-data);font-size:13px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px;
  }
  .weigh-row{display:flex;gap:10px;align-items:stretch}
  .weigh input{
    flex:1;min-width:0;min-height:var(--tap);
    background:var(--surface-2);border:1px solid var(--line-2,var(--line));
    border-radius:12px;padding:0 16px;
    font-family:var(--f-data);font-size:22px;font-weight:600;
    color:var(--text);font-variant-numeric:tabular-nums;
  }
  .weigh input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .weigh .unit{
    display:flex;align-items:center;padding:0 14px;border-radius:12px;
    background:var(--surface-2);border:1px solid var(--line);
    font-family:var(--f-data);font-size:15px;color:var(--muted2);
  }
  .hint{font-family:var(--f-read);font-size:14.5px;line-height:1.55;color:var(--muted2);margin:11px 0 0}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border-top:1px solid var(--line)}
  .half{background:var(--surface);padding:16px 18px}
  .half .who{
    font-family:var(--f-data);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    display:flex;align-items:center;gap:7px;margin-bottom:9px;
  }
  .half .dot{width:8px;height:8px;border-radius:50%;background:var(--who)}
  .half.p .who{color:var(--philipp)} .half.p{--who:var(--philipp)}
  .half.e .who{color:var(--eunice)}  .half.e{--who:var(--eunice)}
  .half .g{
    font-family:var(--f-data);font-size:27px;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;
  }
  .half .kcal{font-family:var(--f-data);font-size:15px;color:var(--muted);margin-top:6px;
    font-variant-numeric:tabular-nums}
  .macros{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px}
  .macros span{
    font-family:var(--f-data);font-size:13px;color:var(--muted2);
    font-variant-numeric:tabular-nums;
  }
  .macros b{color:var(--text);font-weight:600}

  .n{font-family:var(--f-data);font-size:13px;font-weight:600;color:var(--muted2);
    font-variant-numeric:tabular-nums}
  .t{font-size:16px;font-weight:600;line-height:1.4}
  ol.steps .t{font-weight:500}
  .amt{font-family:var(--f-data);font-size:15px;color:var(--accent);
    font-variant-numeric:tabular-nums;text-align:right}
  ul.ing li{grid-template-columns:1fr auto}

  .flag{
    border:1px solid var(--line);border-left:3px solid var(--accent);
    background:var(--surface-2);border-radius:0 12px 12px 0;
    padding:14px 17px;margin-bottom:14px;
  }
  .flag .ft{
    font-family:var(--f-data);font-size:13px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--accent);margin-bottom:6px;
  }
  .flag p{margin:0;font-family:var(--f-read);font-size:15px;line-height:1.6;color:var(--muted)}
  .flag.warn{border-left-color:var(--warn);background:var(--warn-fill)}
  .flag.warn .ft{color:var(--warn)}

  details{
    background:var(--surface);border:1px solid var(--line);
    border-radius:14px;margin-bottom:12px;overflow:hidden;
  }
  details summary{
    min-height:var(--tap);display:flex;align-items:center;gap:9px;
    padding:13px 18px;cursor:pointer;font-size:15px;font-weight:600;
    list-style:none;color:var(--text);
  }
  details summary::-webkit-details-marker{display:none}
  details summary::after{
    content:"";margin-left:auto;width:8px;height:8px;flex:none;
    border-right:2px solid var(--muted2);border-bottom:2px solid var(--muted2);
    transform:rotate(45deg);transition:transform .18s ease;
  }
  details[open] summary::after{transform:rotate(-135deg)}
  details summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .dl{padding:2px 18px 16px}
  .dl div{padding:9px 0;border-top:1px solid var(--line)}
  .dl .dk{font-family:var(--f-data);font-size:13px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted2);margin-bottom:3px}
  .dl .dv{font-family:var(--f-read);font-size:15px;line-height:1.55;color:var(--muted)}
  .dl .dv strong{color:var(--text)}

  /* ---- the planner: pick a dish, get the other one and the shopping list ---- */
  /* min-width:0 matters here: a grid item defaults to min-width:auto, so a
     long unbroken dish title (or a wrapped meta line) can hold the whole
     track open past the viewport instead of wrapping inside it — that is
     what was cutting text off on a phone. Stacking to one column below
     480px sidesteps it entirely once titles get long, columns get narrow. */
  .planrow{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .planslot{background:var(--surface);padding:14px 16px;min-width:0}
  .planslot-snack{border-top:1px solid var(--line);padding:14px 16px}
  .planslot-snack .ps-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:480px){
    .planrow{grid-template-columns:1fr}
    .planslot-snack .ps-list{grid-template-columns:1fr}
  }
  .ps-label{
    font-family:var(--f-data);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted2);margin-bottom:10px;
  }
  .ps-hint{text-transform:none;letter-spacing:0;font-family:var(--f-read);color:var(--muted2)}
  .ps-portion + .ps-portion{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .ps-tier{margin:14px 0 6px;font:600 12px/1 var(--f-ui);letter-spacing:.06em;
           text-transform:uppercase;color:var(--muted)}
  .ps-rest{margin-top:14px;border-top:1px solid var(--line)}
  .ps-rest>summary{cursor:pointer;font:400 13px/1.4 var(--f-read);color:var(--muted);
                   padding:12px 0;min-height:var(--tap);display:flex;align-items:center}
  .ps-note{
    margin:0 0 12px;font-family:var(--f-read);font-size:14px;line-height:1.55;
    color:var(--muted2);
  }
  .ps-list{display:flex;flex-direction:column;gap:8px;min-width:0}
  .dishpick{
    display:block;width:100%;text-align:left;min-height:var(--tap);min-width:0;
    background:var(--surface-2);border:1px solid var(--line-2,var(--line));
    border-radius:12px;padding:9px 12px;cursor:pointer;position:relative;
  }
  .dishpick:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .dishpick.picked{border-color:var(--accent);background:var(--accent);color:var(--bg)}
  .dp-title{
    display:block;font-size:15px;font-weight:600;line-height:1.35;
    overflow-wrap:break-word;word-break:break-word;
  }
  .dp-meta{
    display:block;margin-top:3px;font-family:var(--f-data);font-size:12.5px;
    color:var(--muted2);font-variant-numeric:tabular-nums;line-height:1.5;
    overflow-wrap:break-word;
  }
  .dishpick.picked .dp-meta{color:var(--bg);opacity:.82}
  .dp-pair{
    display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);
    font-family:var(--f-data);font-size:12.5px;line-height:1.5;
    font-variant-numeric:tabular-nums;color:var(--muted2);overflow-wrap:break-word;
  }
  .dp-pair.ok{color:var(--accent)}
  .dp-pair.warn{color:var(--warn)}
  /* A pair that is one spoon of husk away is not a failure — red said "error"
     for something that works. Reserve --warn for actually being over budget;
     the pairs that genuinely cannot close no longer print a line at all,
     because they are folded into the disclosure. */
  .dp-pair.husk{color:var(--muted)}
  .dp-badge{
    display:inline-block;margin-top:6px;font-family:var(--f-data);font-size:11.5px;
    font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);
  }
  .ps-change{
    margin-top:10px;min-height:var(--tap);background:none;border:1px solid var(--line);
    border-radius:10px;padding:0 16px;font-size:13px;color:var(--muted);cursor:pointer;
  }

  /* ---- shopping list ticks ------------------------------------------
     The whole row is the button. In a shop the phone is held one-handed
     and the other hand is full. */
  ul.ing li.shop{padding:0;display:block}
  .shoptick{
    width:100%;min-height:var(--tap);
    display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px;
    padding:8px 18px;background:none;border:0;cursor:pointer;
    font-family:inherit;font-size:15px;color:var(--text);text-align:left;
  }
  .shoptick .box{
    position:relative;
    width:20px;height:20px;border:1.5px solid var(--muted2);border-radius:5px;
  }
  .shoptick .amt{
    font-family:var(--f-data);font-size:14px;color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .shoptick[aria-pressed="true"] .box{
    background:var(--accent);border-color:var(--accent);
  }
  /* The tick is drawn in the page ground — the one ink a filled accent is
     built to carry, in either theme. */
  .shoptick[aria-pressed="true"] .box::after{
    content:"";position:absolute;left:6px;top:2.5px;
    width:4px;height:9px;
    border:solid var(--bg);border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  li.shop.got .shoptick .t{text-decoration:line-through;color:var(--muted2)}
  li.shop.got .shoptick .amt{color:var(--muted2)}
  .shoptick:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  /* ---- the three jobs ------------------------------------------------ */
  .ktabs{display:flex;gap:6px;margin-bottom:14px}
  .ktab{
    flex:1;min-height:var(--tap);padding:8px 4px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface);
    font-family:inherit;font-size:15px;font-weight:600;color:var(--muted);
    cursor:pointer;
  }
  .ktab span{
    display:block;font-family:var(--f-data);font-size:12.5px;font-weight:400;
    color:var(--muted2);margin-top:2px;
  }
  .ktab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  /* Vary the weight on a filled accent, never the ink. */
  .ktab[aria-selected="true"] span{color:inherit;font-weight:400;opacity:.85}
  .ktab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- a dish's own scale reading ------------------------------------- */
  .dishsplit{padding:14px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
  .dishsplit label{
    display:block;font-family:var(--f-data);font-size:12.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted2);margin-bottom:8px;
  }
  .dishsplit .weigh-row{display:flex;align-items:center;gap:10px}
  .dishsplit input{
    flex:1;min-width:0;min-height:var(--tap);padding:0 14px;
    border:1px solid var(--line);border-radius:11px;background:var(--surface);
    color:var(--text);font-family:var(--f-data);font-size:19px;font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .dishsplit input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .dishsplit .unit{font-family:var(--f-data);font-size:14px;color:var(--muted2)}
  .serveout{margin-top:11px;font-size:16px;color:var(--text)}
  .serveout b{font-family:var(--f-data);font-size:20px;font-weight:700}
  .serveout.muted{
    font-family:var(--f-read);font-size:14.5px;color:var(--muted);line-height:1.55;
  }
  .perserve{
    margin-top:12px;padding-top:11px;border-top:1px solid var(--line);
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  }
  .perserve .ps-k{
    font-family:var(--f-data);font-size:12.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted2);
  }
  .perserve .ps-v{font-family:var(--f-data);font-size:17px;font-weight:700;color:var(--text)}
  .perserve .ps-m{display:flex;gap:12px;margin-left:auto}
  .perserve .ps-m span{font-family:var(--f-data);font-size:13.5px;color:var(--muted)}
  .perserve .ps-m b{color:var(--text);font-weight:700}

  .dp-top{display:flex;align-items:flex-start;gap:9px}
  .dp-icon{
    width:22px;height:22px;flex:none;margin-top:1px;
    stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;opacity:.75;
  }
  .dishpick.picked .dp-icon{opacity:.9}
  .dp-cuisine{
    display:inline-block;margin-right:8px;
    font-family:var(--f-data);font-size:12px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--accent);font-weight:600;
  }
  .dishpick.picked .dp-cuisine{color:inherit;opacity:.85}

  /* Inside the reference card the rows are already contained, so they drop
     their own borders and radii and read as one list. */
  .refcard > details{
    background:none;border:0;border-top:1px solid var(--line);
    border-radius:0;margin:0;
  }
  .refcard > details:first-of-type{border-top:0}

  /* ---- what goes in the bowl ----------------------------------------- */
  .blockdial{padding:0;border-top:1px solid var(--line);background:var(--surface-2)}
    .bd-row{
    display:grid;grid-template-columns:1fr auto;
    align-items:center;gap:4px 12px;
    padding:13px 18px;border-bottom:1px solid var(--line);
  }
  .bd-who{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700}
  .bd-who .dot{width:8px;height:8px;border-radius:50%;background:var(--who)}
  .bd-step{display:flex;align-items:center;gap:2px;justify-self:end}
  .bd-b{
    width:38px;height:38px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);border-radius:10px;
    font-family:inherit;font-size:19px;line-height:1;cursor:pointer;
  }
  .bd-b:disabled{opacity:.35;cursor:default}
  .bd-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bd-n{
    min-width:1.8em;text-align:center;font-family:var(--f-data);
    font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .bd-what{grid-column:1/3;font-size:15px;line-height:1.45;color:var(--text)}
  .bd-what b{font-family:var(--f-data);font-weight:700}
  .bd-what i{color:var(--muted2);font-style:italic;font-size:14px}
  .bd-what .plus{color:var(--muted2)}
  .bd-what .g{font-family:var(--f-data);font-size:13px;color:var(--muted2)}
  .bd-out{
    grid-column:1/3;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    font-family:var(--f-data);font-size:12.5px;color:var(--muted2);
    font-variant-numeric:tabular-nums;
  }
  .bd-out b{font-size:16px;color:var(--text)}
  .bd-out .bd-delta{margin-left:auto}
  /* Context, not a verdict. 520 is the mirror-MEAL reference; whether the day
     works is decided by the day check on Plan, and a bigger plate there is
     often exactly right for the person with the bigger day. Colouring this
     red said "wrong" about something that is usually fine. */
  .bd-delta{color:var(--muted2)}

  /* The library, kept reachable but no longer three thousand pixels tall. */
  details.library > summary{font-weight:600}

  /* A picked dish, or the base block: slot, name, size — enough to know what
     it is without opening it. */
  /* Named areas so the disclosure chevron keeps its own column instead of
     wrapping onto a third row once the title runs long. */
  .cookcard > details > summary{
    display:grid;
    grid-template-columns:auto auto 1fr auto;
    grid-template-areas:"k icon title chev" "k icon meta chev";
    align-items:center;gap:1px 10px;padding:14px 18px;
  }

<script>
const D = {"kitchen": {"_source": ["Asian_Carb_Base.md", "Cooking_Standards.md", "Core_Health_Logic.md"], "_changelog": ["2026-08-29 — Asian Base Block macros corrected. The file previously carried three independently hand-maintained figures (per-block macros, per-100g-cooked macros, batch yield) that contradicted each other by ~34%. The per-100g-cooked value of 105 kcal implied a cooked weight of ~1126 g, which is more than goes into the pot. Since MacroFactor logging uses grams, the wrong one of the two was in daily use. Ingredients now carry their own nutrition, cooked weight is a single declared field, and every macro below is DERIVED by scripts/recompute_macros.py. Do not edit the 'computed' blocks by hand.", "2026-08-29 — energyFactors added so the kitchen page can check a meal target against its own arithmetic. First result: the mirror-meal spec overshoots its calorie budget by ~10 kcal at the theoretical floor, i.e. it is unreachable, not merely difficult. No recipe can satisfy it.", "2026-08-29 — mirror meal raised to 470 kcal on 1 block with 14 g fibre, after a search over the kitchen's own staples showed the old 425/17/1.5 spec had a floor of 533 kcal. Block ladder halved to 0.5 / 1 / 1.5.", "2026-08-30 — check_targets.py gained a REAL FOOD section. The block ladder prices macros at the Atwater floor, so its verdict was necessary and not sufficient; the new search constructs actual plates from foods.json and reports how many fit and which protein sources cannot. Result: the current spec is comfortable, the old one returns zero plates at 1, 1.5 and 2 blocks, and the binding constraint is the 12 g fat ceiling rather than the fibre."], "hardware": {"device": "Ninja Foodi OL750UK SmartLid", "primaryModes": ["Pressure Cook", "Air Fry", "Steam-Air Fry", "Sauté/Sear"], "philosophy": "prefer one-pot dishes to save time and cleanup"}, "culinaryStandards": {"flavorProfile": "anti-spartan — Mediterranean, Asian, always with an aroma base", "texture": "always aim for contrast — crispy + juicy", "sauceBase": "low-calorie — Magerquark, mustard, or stock", "lunchboxFiber": "space-saving sources only — lentils, finely grated vegetables, spinach; no bulky salad piles"}, "asianMacroBase": {"purpose": "carb component with more protein/fiber than plain rice, lower volume, high satiety", "portionSize": "100-120 ml silicone mold", "_nutritionSource": "Generic composition tables, not brand labels. Calories are reliable within a few percent; protein and fiber vary most between brands. When convenient, replace per100gRaw with the numbers from your actual packaging and re-run scripts/recompute_macros.py.", "ingredients": [{"item": "Jasminreis", "amount": "210 g", "g": 210, "per100gRaw": {"calories": 360, "proteinG": 6.7, "carbsG": 79.0, "fiberG": 1.3, "fatG": 0.6}}, {"item": "Quinoa", "amount": "45 g", "g": 45, "per100gRaw": {"calories": 368, "proteinG": 14.1, "carbsG": 64.0, "fiberG": 7.0, "fatG": 6.1}}, {"item": "Rote Linsen (trocken)", "amount": "30 g", "g": 30, "per100gRaw": {"calories": 350, "proteinG": 24.0, "carbsG": 60.0, "fiberG": 11.0, "fatG": 1.1}}, {"item": "Edamame (geschält, TK)", "amount": "130 g", "g": 130, "per100gRaw": {"calories": 120, "proteinG": 11.0, "carbsG": 9.0, "fiberG": 5.0, "fatG": 5.0}}, {"item": "Gemüsebrühepulver", "amount": "1 tsp", "g": 4, "per100gRaw": {"calories": 200, "proteinG": 7.0, "carbsG": 30.0, "fiberG": 0.0, "fatG": 5.0}}, {"item": "Sojasauce (low sodium)", "amount": "1 tsp", "g": 6, "per100gRaw": {"calories": 53, "proteinG": 8.1, "carbsG": 4.9, "fiberG": 0.8, "fatG": 0.1}}, {"item": "Wasser", "amount": "450 ml", "g": 450, "isWater": true, "per100gRaw": {"calories": 0, "proteinG": 0, "carbsG": 0, "fiberG": 0, "fatG": 0}}], "steps": ["Rinse the rice, quinoa and red lentils until the water runs clear", "Mix the water with the stock powder and soy sauce and pour it into the inner pot", "Add the rice, quinoa and lentils — NOT the edamame yet", "SmartLid to Pressure, mode Pressure Cook, level High, 4 minutes", "10 minutes natural release, then vent the remaining pressure by hand", "Fluff with a fork, fold in the edamame, leave uncovered 5–10 min to steam off", "WEIGH THE COOKED BATCH and enter it in yield.cookedWeightG, then run scripts/recompute_macros.py", "Press into 100–120 ml silicone moulds, cool, then freeze or chill"], "yield": {"cookedWeightG": 850, "_status": "ESTIMATED", "_note": "425 g raw solids plus the water retained after the 5-10 min steam-off. This is the ONE number that must be measured. Weigh the next batch, put the real figure here, re-run scripts/recompute_macros.py — every macro in this file follows from it. An estimate that is 50 g off shifts kcal/100g by about 6%.", "blocks": 10}, "computed": {"_generated": "by scripts/recompute_macros.py — do not edit by hand", "rawSolidsG": 425, "batchTotal": {"calories": 1193.8, "proteinG": 42.7, "carbsG": 225.9, "fiberG": 15.7, "fatG": 11.0}, "per100gCooked": {"calories": 140.4, "proteinG": 5.0, "carbsG": 26.6, "fiberG": 1.9, "fatG": 1.3}, "perBlock": {"calories": 119.4, "proteinG": 4.3, "carbsG": 22.6, "fiberG": 1.6, "fatG": 1.1}, "gramsPerBlock": 85.0}, "blockRules": {"saucyOrCalorieDense": 0.5, "standardLeanDish": 1, "extremelyLeanProtein": 1.5}, "substitutions": {"quinoaUnavailable": {"replaceWith": "Bulgur", "waterAdjustment": "reduce water from 450ml to 425ml proportionally (tested: 540ml→510ml at larger batch size)", "ninjaSettings": "unchanged — Pressure Cook High, 4 min + 10 min Natural Release", "_note": "changing the water also changes the cooked weight — re-weigh and re-run the calculator"}}, "_blockRulesNote": "Halved on 2026-08-29. The old ladder (1 / 1.5 / 2) spent 179 kcal of a 425 kcal meal on the carb base, which is what made the target unreachable.", "_wholeBlocksOnly": "A block is a frozen 85 g puck out of a 100-120 ml silicone mould. You cannot take half of one, so the plate deals in whole blocks and the Kitchen dial steps by one. blockRules below still carries 0.5 and 1.5 because they say what a dish type WANTS in carb terms, and check_targets.py searches those levels to prove the target is reachable — but on an actual plate they round to a whole puck. If half blocks are ever wanted for real, freeze a second tray in smaller moulds; do not chip one in half at the counter."}, "recipeOutputFormat": {"_note": "The shape of the report scripts/adapt_recipe.py prints. Product language is English, so the block names are too; ingredient names stay German, because that is what is on the packet.", "order": ["Block 1 — what changed from the original", "Block 2 — target vs result (calories, protein, fibre, fat)", "Block 3 — Ninja OL750 method, numbered, with mode/level/time"]}, "recipeChecks": {"proteinCheck": "the MEAL totals 40 g protein, including whatever the Asian Base Blocks contribute — size the protein source to make up the difference, do not add 40 g on top", "fatCheck": "minimize fat to 12-15g per meal", "fiberCheck": "prefer space-saving sources — lentils, spinach, grated vegetables", "_fixed2026_08_29": "proteinCheck previously read 'raise protein source to 40g per portion', which contradicted mirrorMeals (40 g for the whole meal) and would have overshot the target on every recipe."}, "macroFactorLogging": {"asianBaseCustomFoodPer100gCooked": {"_generated": "by scripts/recompute_macros.py — do not edit by hand", "calories": 140.4, "proteinG": 5.0, "carbsG": 26.6, "fiberG": 1.9, "fatG": 1.3}, "note": "both partners log ~150g each in their individual MacroFactor accounts", "_actionRequired": "The custom food in MacroFactor still holds the old 105 kcal/100g. Update it to the value below, otherwise the correction only exists in this file."}, "eunicePreferences": {"note": "hard constraint — dish selection must pass her taste test", "cuisineAffinity": ["Taiwanese braised dishes", "Japanese-adjacent flavors", "Vietnamese"], "avoid": ["expensive specialty imports", "flavor sacrificed purely for macro precision"]}, "_gaps": ["the revised mirror-meal target (470 kcal / 40 P / 14 fibre on 1 block) is reachable AND cookable — check_targets.py now builds real plates out of foods.json and finds 4962 of them on 1 block, aroma base included. Still untested in a pan: the search costs ingredients, not shrinkage, seasoning to taste, or whether Eunice will eat it.", "cookedWeightG is estimated, not weighed — the single highest-value measurement to take on the next batch", "no actual recipes yet: this file holds standards and one carb base, but zero dishes. 'What do we commonly meal-prep?' is still unanswerable.", "per-ingredient nutrition comes from generic tables, not the actual packaging", "meal-history / rating log (👍/👎 per dish) not yet built", "shopping list generator logic not yet formalized as data"], "energyFactors": {"_note": "Atwater factors, kcal per gram. Present for one purpose: to check whether a meal target is arithmetically reachable before anyone tries to cook it. Fibre is priced at the generous 2 kcal/g; the digestible carbohydrate that carries it in real food costs more on top.", "proteinG": 4, "fatG": 9, "fiberG": 2}, "dayFineTuning": {"_purpose": "The last few grams of fibre on a day that lands just short. DAY level, not recipe level — deliberately a separate list from topUps, which adapt_recipe.py reads and must never see this.", "_whySeparate": "topUps excludes Flohsamenschalen for two reasons: on cost it would win every proposal, and nobody wants psyllium stirred into a braise. Neither objection applies to a glass of water at the end of a day. The objection that DOES still apply is dose and physiology, and that is what maxG is for.", "_whyCapped": "Psyllium is almost purely viscous soluble fibre. It does stool bulk, cholesterol binding and slowing glucose absorption well; it is poorly fermented, so it barely feeds the microbiome, and it brings none of the resistant starch, beta-glucan and polyphenols that come attached to legumes and oats. The 45 g and 35 g targets come from population data where fibre is a MARKER for eating plants — powder hits the marker without doing the thing the marker stands for. On top of that, 29 g (what a 23 g gap would need) is three to six times a normal dose and costs bloating and a litre of water. Hence 10 g: enough for the last few grams, never enough to replace a dish.", "fiber": [{"food": "flohsamenschalen", "maxG": 10, "note": "into a large glass of water, drink straight away (it gels within seconds)", "coversFiberG": 8.0, "_ifBigger": "A gap larger than this is not a powder problem. It means one of the two dishes is short, and the dish has to be rebuilt the way tuscan-chicken-light and orange-ginger-chicken-light were: add a legume and let solve() re-fit the plate around it."}]}}, "profiles": {"_source": "Core_Health_Logic.md", "priorityHierarchy": ["protein", "fiber", "fat", "calories"], "priorityNote": "Protein is non-negotiable. All other macros flex around it.", "people": {"philipp": {"displayName": "Philipp", "role": "biohacker", "dailyTargets": {"calories": 1900, "proteinG": 164, "fiberG": 45, "fatG": 55, "netCarbsG": 165}, "fixedBreakfast": {"recipeId": "philipp-overnight-oats", "calories": 319.1, "proteinG": 31.8, "fiberG": 5.4, "fatG": 5.1, "ingredients": [{"item": "Haferflocken", "amount": "45 g"}, {"item": "Skyr", "amount": "120 g"}, {"item": "Whey Protein", "amount": "15 g"}, {"item": "Mandelmilch, ungesüßt", "amount": "80 ml"}, {"item": "Ceylon Zimt", "amount": "1 g"}, {"item": "Salz", "amount": "1 pinch"}], "_note": "Numbers copied from recipes.json (philipp-overnight-oats), not typed independently. Replaced the whey shaker on 2026-08-30; the shaker stays in the library for days when no jar travels, exactly as the Magerquark bowl stayed for days at home. Overnight oats were never ruled out for him — Eunice's objection was about packing a second jar for work, and that got applied to the whole household without ever being re-checked. They also fix the shaker's one real weakness: a shake does not satiate. The morning went from 0 g of fibre to 5.4."}, "afternoonPortions": 2, "snackBudgetAfterMirrorMeals": {"calories": 540.9, "proteinG": 52.2, "note": "1900 - 319 (breakfast) - 1040 (lunch+dinner) = remainder. Derived; the kitchen page recomputes it live. Two portions of die-vorratsdose-skyr-schoko-banane fill it (549 kcal, 58.8 g protein, 17.2 g fibre) and run 8 kcal past it — noise, deliberately not optimised away."}, "aestheticGoal": "lean athletic, K-drama V-taper, not bulky", "_phase": {"name": "Maintenance — recovering expenditure", "startedOn": "2026-08-29", "reviewOn": "2026-09-26", "was": 1600, "why": "Not a deficit. MacroFactor measured expenditure falling from 2462 in March to 1801 now — 767 kcal, of which only ~270 is explained by lost mass and fewer steps. At 1600 the deficit had shrunk to ~200 kcal and was still closing; cutting further would have pushed expenditure down again. Eating at measured expenditure is what lets it climb back, and a deficit from a recovered 2100 loses fat faster than one from 1800.", "expect": "1-1.5 kg on the scale in week one. That is water and glycogen refilling, not fat — 300 kcal a day cannot become a kilo of fat in a week. Do not react to it. Judge this phase on the MacroFactor expenditure line, not on bodyweight.", "alsoRequired": "Steps back to 8000/day. That is ~200 kcal of real expenditure and it is what actually moved the weight in July. The calorie change alone does half the job.", "thenWhat": "Re-import MacroFactor on 2026-09-26 and run check_targets.py. If expenditure has climbed above ~2000, drop to expenditure minus 400 for the next cut. If it has not moved at all, the logging is the suspect, not the metabolism."}}, "eunice": {"displayName": "Eunice", "role": "healthy teacher", "dailyTargets": {"calories": 1580, "proteinG": 125, "fiberG": 35, "fatG": 45, "netCarbsG": 151}, "fixedBreakfast": {"recipeId": "eunice-ehrmann-pudding-breakfast", "calories": 174, "proteinG": 20, "fiberG": 0.6, "fatG": 4.6, "ingredients": [{"item": "Ehrmann High Protein Pudding", "amount": "200 g (1 pot)"}], "_note": "Numbers copied from recipes.json (eunice-ehrmann-pudding-breakfast), not typed independently — the exact duplication Philipp's breakfast has is deliberately not repeated here."}, "afternoonPortions": 1, "breakfastPlusSnackBudget": {"_stale": "Written before fixedBreakfast existed for her. The real pudding is 174 kcal / 20 g P / 0.6 g fibre against the 330/28 assumed below — the gap rolls into 'left for snacks' automatically since the kitchen page computes that live, not from this field. Left as-is rather than reconciled by hand; the 2026-09-26 review is the natural point to redo this split against real data.", "calories": 540, "proteinG": 45, "fiberG": 7, "split": {"breakfast": {"calories": 330, "proteinG": 28}, "snack": {"calories": 210, "proteinG": 17}}, "note": "1580 - 1040 (lunch+dinner) = remainder. Derived; the kitchen page recomputes it live rather than reading this. The split is guidance, not a fixed meal — she has no fixedBreakfast yet. 45 g of protein in 540 kcal is 33% of the envelope, which sounds strict and is not: 250 g of skyr with 30 g of whey is 275 kcal and 51 g."}, "aestheticGoal": "curvier, defined, strong lower body already present", "notes": ["picky eater, strong taste preferences — recipe selection must pass her taste test", "~1 year training experience, naturally strong lower body development"], "_phase": {"name": "Provisional — modelled, not measured", "startedOn": "2026-08-30", "reviewOn": "2026-09-26", "why": "Her four targets come from an activity-factor model and nothing else. The same model said Philipp's maintenance was 2424-2688 kcal; MacroFactor measured 1801. A model that was 600 kcal wrong about one person in this household is not evidence about the other. 1580 is a starting guess with roughly +-300 kcal in it, and it should be treated as one until there is an expenditure line to check it against.", "theOpenQuestion": "Whether 45 g of protein fits outside lunch and dinner in practice. On paper it is 250 g of skyr and a scoop of whey; in a real morning it is a habit she does not have yet.", "expect": "Two weeks of hitting 3 of 4 targets on most days. Not perfection — the question is whether the shape of the day is livable, not whether the arithmetic closes.", "thenWhat": "If the protein lands: keep 125 and start trusting the number. If breakfast keeps coming up short, fall back to protein 120 / fat 47 / net carbs 153 — already worked out, same 1580 kcal, and it costs 0.08 g/kg. Do not fall back by eating less protein while leaving the target at 125; change the target, so the report keeps telling the truth.", "blocking": "She has no MacroFactor data at all — private/macrofactor holds only philipp. Until she logs, this phase can only be reviewed against the scale and how she feels, which is exactly the weak evidence that produced the 600 kcal error. Two weeks of logging before 2026-09-26 would give the first real read."}}}, "mirrorMeals": {"note": "Lunch and dinner are identical in size and macros for both people. Fat is a CEILING, not a range: protein and fibre are hit first and fat lands where it lands underneath it. A floor of 8 g was doing nothing — a leaner dish simply leaves the snack more room — while the 12 g ceiling put salmon, eggs, tempeh and tofu out of reach of a 40 g protein meal. Written as \"0-14\" so every reader that splits the range keeps working; read it as \"up to 14\".", "lunch": {"calories": 520, "proteinG": 40, "fiberG": 14, "fatG": "0-14"}, "dinner": {"calories": 520, "proteinG": 40, "fiberG": 14, "fatG": "0-14"}, "_revised": "2026-08-29 — was 425 kcal / 17 g fibre / 12-15 g fat on 1.5 Asian Base blocks. That target could not be cooked: the cheapest combination of these staples reaching it came to 533 kcal, 108 kcal over, at every meal. Raised to 470 kcal on 1 block with 14 g fibre, which the same search reaches at 432 kcal — leaving real slack for sauce and aromatics instead of sitting on the theoretical floor. Run scripts/check_targets.py after touching any of these numbers.", "_revised2": "2026-08-30 — fat band 8-12 -> ceiling of 14, no floor. The day pays for it out of slack it already had: Philipp keeps 17 g of fat for the snack, Eunice 24 g for breakfast plus snack. check_targets.py's REAL FOOD search goes from 4962 to 5697 plates on one block and returns tofu at every block level, salmon on the saucy tier.", "_revised3": "2026-08-30 — mirror meal 470 -> 520 kcal, and Eunice's protein 105 -> 125 g with fat 52 -> 45 and net carbs 160 -> 151 paying for it. Her breakfast-plus-snack envelope was 640 kcal asking for 25 g of protein: 40% of her day, 16% of it accounted for. Because lunch and dinner are identical for both people, growing the meal shrinks both envelopes at once — hers to 540, his to 450. Protein per meal stays 40: raising it would have relieved his snack and emptied hers, which is backwards. The ceiling on how far this can go is HIS snack, which reaches 32% protein at 520 and 37% at 550. Cooking gets easier, not harder — check_targets.py finds 18260 plates at 520 against 11992 at 470.", "dish": {"calories": 401, "proteinG": 35.7, "fiberG": 12.4, "fatG": "0-12.9", "_baselineBlocks": 1, "_why": "The plate is the dish plus base blocks. lunch/dinner above describe the whole PLATE; this describes the dish on its own, which is what adapt_recipe.py actually fits. It is the plate minus 1 standard block (119.4 kcal, 4.3 g protein, 1.6 g fibre, 1.1 g fat), so dish + 1 block lands exactly on the plate target.", "_perPerson": "The block count is a dial at the plate, not a property of the recipe. Philipp's day is 1900 kcal and Eunice's 1580, so the same dish can carry a different number of blocks for each of them. Kitchen shows both. Taking fewer than the baseline leaves protein and fibre a little short; taking more only adds."}}, "_gaps": ["Five dishes were rebuilt on 2026-08-30 (legume as the fibre carrier, fat cut, meat cut, solve() re-fits). Two of the five were reverted the same day: edamame is Japanese, and putting it in a Vietnamese phở and a Korean stew was a macro fix in costume — it also cost the brisket that IS phở bò chín and the potatoes that thicken a dakbokkeumtang. Root cause was in the data: topUps filed edamame under 'asian', which is a continent rather than a cuisine. Fixed there too.", "Two dishes are marked fibreLight and are meant to be: pho-bo (4.8 g) and korean-spicy-chicken-stew (6.1 g). Both close the day beside any of the four 14 g dishes plus 7-9 g of psyllium, inside the 10 g cap. The phở gained its fibre honestly rather than by redesign — the transcription had 40 g of sprouts and no herbs, which is not how phở is served. The rau sống plate (200 g sprouts, Thai basil, coriander, mint, lime) is canonical and carries 4.5 g a serving. That was a missing half of the dish, not a macro patch.", "Eunice's four targets imply 1598 kcal against a 1580 budget — an 18 kcal rounding gap, left alone. Her numbers have no MacroFactor data behind them, so the model is all there is, and the model was 600 kcal wrong for Philipp. Believe her scale over this arithmetic.", "The Vorratsdose has never been tasted, only calculated. It is built against acidity rather than macros — skyr instead of quark, cocoa in the bowl, banana instead of the tart frozen berries, almond milk to loosen it, salt to blunt the sourness. If skyr is still too sour the next step is Greek yoghurt 0-2%, NOT more sweetener: sweetness masks acid, fat and salt remove it. Mix a small test batch before committing 1.5 kg.", "baked-feta-salmon-light lands at 22.2 g of fat against a 14 g per-meal guideline, and that is arithmetic rather than a recipe fault: salmon carries 0.67 g of fat per gram of protein, so 40 g of protein from salmon alone is 26.8 g of fat before anything else. Prawns carry part of the protein and the feta is down from 200 g to 80, which halves the fat from 43. It closes the day next to a lean dish (lemon-herb-chicken-light) and not twice in one day — which is exactly why the planner checks pairs."], "_dayShape": {"_decided": "2026-08-30", "summary": "Two blocks outside the mirror meals. Morning is per-person and NOT shared; the afternoon pudding IS shared. Sharing only pays off where there is a batch operation — the same reason lunch and dinner are identical. The morning is portioned per person anyway, so unifying it would be cosmetic and would cost Eunice a habit that works.", "morning": {"philipp": "philipp-overnight-oats — mixed the night before, eaten around 10 at school. philipp-whey-shaker stays in the library for days when no jar travels.", "eunice": "eunice-ehrmann-pudding-breakfast — bought, sealed, unchanged. She declined overnight oats because she will not pack a second jar for work; that objection is hers and does not generalise to him."}, "afternoon": {"sweet": "die-vorratsdose-skyr-schoko-nuss — ONE bowl, 9 portions, 3 days. Philipp 2 a day, Eunice 1, ~155 g a portion. Skyr for both; nut butter and cocoa mixed in, banana per portion.", "savoury_meat": "die-herzhafte-dose-linsen-pute-paprika — 4 portions. Turkey poached, not roasted. Sesame oil and lemon go on at the bowl, never into the batch.", "savoury_quark": "kraeuterquark-mit-linsen — 4 portions. Kräuterquark was ruled out because Eunice does not eat Magerquark, but that objection belonged to the SWEET context: the same tang reads wrong in a sweet bowl and right in a herb dip. No lemon, no vinegar.", "_swapping": "All three sit at 275-277 kcal, so any mix closes both days on all four macros without recalculating. Verified across every combination.", "_fatCorrection": "2026-08-30: all three were built fat-phobic by reflex, and the aroma in all of them is fat-soluble — herbs, cocoa, cinnamon. Fat went in as a TRADE, not an addition: the calorie window was already full even though the fat column was not, and fat costs 9 kcal a gram. Sweet bowl: 54 g nut butter in, banana halved, oat bran 171 to 140. Quark bowl: 16 g olive oil in, quark 800 to 660. The turkey bowl needed no fat at 4.7 g and got only technique fixes.", "_portions": "afternoonPortions on each person: Philipp 2, Eunice 1, both from the same bowl. The Kitchen planner reads it and asks for that many picks, so he can put a sweet portion next to a savoury one on the same day — which is the whole reason the savoury tubs exist. Before this the planner had one snack slot for everyone and quietly understated his day by a portion."}, "batchRhythm": "The pudding is mixed twice a week, not once for three days: 3 portions a day makes a 3-day batch ~2.1 kg in one tub. It needs no heat and no cooling, so twice is the same total work with fresher berries. The 3-day rhythm stays for lunch and dinner, where it exists because of the cooking.", "fibreTiming": "Fibre does not have to be eaten in the morning — only the daily total matters for what fibre is for. What is true is the satiety argument: fibre slows gastric emptying, so a morning item without it holds less long. That is why the shaker suits someone who does not want to eat in the morning anyway.", "topUp": {"_why": "A six-day simulation showed both eating short every day: Philipp 95-116 kcal, Eunice 195-216 — 13% of her day. Mechanical, not behavioural: the light dishes come in at 450 and 487 kcal against a 520 spec, twice a day.", "calories": "ehrmann-pudding-nachfueller — a cup from the fridge. Nothing to mix, nothing to remember, already on the shopping list. Brings Eunice to -21 kcal; Philipp only needs one on some days (a whole one puts him +58 to +79 over, which is noise but not nothing).", "fibre": "A capped spoon of Flohsamenschalen, see kitchen.json dayFineTuning. Over the same six days the largest gap was 8 g of powder against a 10 g cap, and on the days with the light dishes none was needed at all.", "_deleted": "There was briefly a third recipe here — a top-up of skyr, berries and oat bran. Deleted. It closed the same hole as a bought cup while being one more thing to mix function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function n1(v){ return (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,""); }
function n0(v){ return Math.round(v); }
/* mirrorMeals.fatG is a range like "0-14", deliberately. Print it, do not round it.
   A range that starts at 0 is a ceiling wearing a range's clothes; say so, because
   "0-14 g" invites you to hunt for a lower bound that does not exist. */
function g(v){
  if(isFinite(v)) return n0(v);
  var m = String(v).match(/^0\s*-\s*(.+)$/);
  return m ? "≤" + m[1] : String(v);
}

/* Every figure in the ledger is derived here rather than read from the
   pre-computed budget fields in profiles.json. Those fields agree today; the
   point is that they cannot silently stop agreeing. */
function mealsOfDay(who){
  var prof = D.profiles.people[who];
  var t = prof.dailyTargets;
  var mm = D.profiles.mirrorMeals;
  var rows = [];

  if(prof.fixedBreakfast){
    var b = prof.fixedBreakfast;
    rows.push({ label:"Breakfast", tag:"fixed", kcal:b.calories, p:b.proteinG,
                fib:b.fiberG, fat:b.fatG, ing:b.ingredients });
  }
  /* Once a dish is actually picked in the planner below, the ledger uses its
     real computed macros instead of the abstract mirror target — Baked Feta
     Salmon really does carry 1.2 g fibre, not 14, and "left for snacks"
     should know that, not just the idealised number. */
  ["lunch","dinner"].forEach(function(k){
    var picked = PLAN[k] ? recipeById(PLAN[k]) : null;
    var c = picked ? eatenBy(picked, who)
                   : { kcal:mm[k].calories, p:mm[k].proteinG,
                       fib:mm[k].fiberG, fat:mm[k].fatG };
    var n = picked ? blocksFor(picked, who) : 0;
    rows.push({ label:k.charAt(0).toUpperCase()+k.slice(1),
                tag: picked ? (n ? "picked + " + n0(n) + " blk" : "picked") : "mirror",
                kcal:c.kcal, p:c.p, fib:c.fib, fat:c.fat });
  });
  pickedSnacks(who).forEach(function(id){
    var c = recipeById(id).computed;
    rows.push({ label:recipeById(id).title, tag:"snack", kcal:c.calories, p:c.proteinG,
                fib:c.fiberG, fat:c.fatG });
  });

  var used = rows.reduce(function(a,r){
    a.kcal += r.kcal; a.p += r.p; a.fib += r.fib || 0;
    return a;
  }, {kcal:0, p:0, fib:0});

  rows.push({
    label: prof.fixedBreakfast ? "Left for snacks" : "Left for breakfast + snacks",
    tag: "open", left: true,
    kcal: t.calories - used.kcal,
    p:    t.proteinG - used.p,
    fib:  t.fiberG   - used.fib
  });
  return rows;
}

/* What the rest of the plate has to deliver once the carb base is on it.
   This is recipeChecks.proteinCheck made arithmetic instead of advisory. */
function mealRemainder(){
  var blocks = base.blockRules.standardLeanDish;
  var pb = comp.perBlock;
  var m = D.profiles.mirrorMeals.lunch;
  /* Fat has no floor since 2026-08-30, so the blocks can already exceed what the
     meal demands. Clamped at zero — a negative need would credit those calories
     back and make the feasibility floor look lower than it is. */
  var fatLo = parseFloat(String(m.fatG).split("-")[0]);
  return {
    blocks: blocks,
    from:  { kcal:pb.calories*blocks, p:pb.proteinG*blocks,
             fib:pb.fiberG*blocks, fat:pb.fatG*blocks },
    need:  { kcal:m.calories - pb.calories*blocks,
             p:  m.proteinG - pb.proteinG*blocks,
             fib:m.fiberG   - pb.fiberG*blocks,
             fat:Math.max(0, fatLo - pb.fatG*blocks),
             fatMax:parseFloat(String(m.fatG).split("-").pop()) - pb.fatG*blocks }
  };
}

/* Can the target be hit at all? Price the macros it asks for at their own
   energy content. If that floor is above the calories left, no choice of
   ingredient rescues it — the target contradicts itself. */
function feasibility(){
  var r = mealRemainder();
  var f = D.kitchen.energyFactors;
  if(!f) return null;
  var floor = r.need.p*f.proteinG + r.need.fat*f.fatG + r.need.fib*f.fiberG;
  return { floor:floor, have:r.need.kcal, over:floor - r.need.kcal };
}

var base = D.kitchen.asianMacroBase;
var comp = base.computed;
var per100 = comp.per100gCooked;

/* Last weight typed, so you do not retype it while the pan is still hot. */
function loadWeight(){
  try{ var v = parseFloat(localStorage.getItem("hub.kitchen.weight")); if(v>0) return v; }catch(e){}
  return comp.gramsPerBlock * base.yield.blocks;   // a full batch
}
function saveWeight(v){
  try{ localStorage.setItem("hub.kitchen.weight", String(v)); }catch(e){}
}

var weight = loadWeight();

function macrosFor(grams){
  var f = grams/100;
  return {
    kcal: per100.calories*f, p: per100.proteinG*f,
    c: per100.carbsG*f, fib: per100.fiberG*f, fat: per100.fatG*f
  };
}

function splitHTML(){
  var each = weight/2;
  var m = macrosFor(each);
  function half(cls,who){
    return '<div class="half ' + cls + '">' +
      '<div class="who"><span class="dot"></span>' + esc(who) + '</div>' +
      '<div class="g">' + n0(each) + ' g</div>' +
      '<div class="kcal">' + n0(m.kcal) + ' kcal</div>' +
      '<div class="macros">' +
        '<span>P <b>' + n1(m.p) + '</b></span>' +
        '<span>C <b>' + n1(m.c) + '</b></span>' +
        '<span>Fib <b>' + n1(m.fib) + '</b></span>' +
        '<span>F <b>' + n1(m.fat) + '</b></span>' +
      '</div></div>';
  }
  return '<div class="split">' + half("p","Philipp") + half("e","Eunice") + '</div>';
}

function ledgerHTML(who){

        (r.fat == null ? '' : '<span>F <b>' + g(r.fat) + ' g</b></span>') +
      '</div></div>';
  }).join("");

  var t = prof.dailyTargets;
  var card = '<div class="card"><div class="ch"><span class="k">' +
    esc(PW.PEOPLE[who].name) + '’s day</span>' +
    '<span class="meta">' + n0(t.calories) + ' kcal &middot; ' + n0(t.proteinG) + ' g P</span>' +
    '</div><div class="ledger">' + body + '</div></div>';

  /* The last few grams. Only once lunch, dinner AND a snack are all picked is
     the day actually specified — before that "left over" is just budget, not a
     shortfall. Capped hard: psyllium is fine for a rounding error and wrong as
     a replacement for a dish, and the cap is what keeps that line honest. */
  /* The last few grams. Only once lunch, dinner AND a snack are all picked is
     the day actually specified — before that "left over" is budget, not a
     shortfall. Capped hard: psyllium is fine for a rounding error and wrong as
     a replacement for a dish, and the cap is what keeps that line honest. */
  var ft = D.fineTuneFiber;
  var snacksDone = pickedSnacks(who).length === snackSlots(who);
  if(ft && PLAN.lunch && PLAN.dinner && snacksDone){
    var open = rows[rows.length - 1];
    if(open.left && open.fib > 0.05){
      var needG = open.fib / ft.fiberPerG;
      if(needG <= ft.maxG){
        card += '<div class="finetune"><b>' + g(needG) + ' g ' + esc(ft.name) + '</b> ' +
                'schließen die letzten ' + g(open.fib) + ' g Ballaststoffe — ' +
                esc(ft.note) + '.</div>';
      } else {
        card += '<div class="finetune warn">' + g(open.fib) + ' g Ballaststoffe fehlen — ' +
                'das wären ' + g(needG) + ' g ' + esc(ft.name) + ', mehr als die ' +
                ft.maxG + ' g, die hier erlaubt sind. Die Lücke gehört ins Gericht, ' +
                'nicht ins Pulver.</div>';
      }
    }
  }

  /* The ingredients only exist for whoever has a fixed breakfast. */
  if(prof.fixedBreakfast){
    card += '<details><summary>' + esc(PW.PEOPLE[who].name) +
      '’s breakfast, as built</summary><div class="dl">' +
      prof.fixedBreakfast.ingredients.map(function(i){
        return '<div><div class="dk">' + esc(i.item) + '</div>' +
               '<div class="dv"><strong>' + esc(i.amount) + '</strong></div></div>';
      }).join("") + '</div></details>';
  }
  return card;
}

function mealHTML(){

  var m = D.profiles.mirrorMeals.lunch;
  return '<div class="card"><div class="ch"><span class="k">One mirror meal</span>' +
    '<span class="meta">' + n0(m.calories) + ' kcal target</span>' +

}

function feasibilityHTML(){

  if(!f || f.over <= 0) return "";
  return '<div class="flag warn"><div class="ft">This target cannot be cooked</div><p>' +
    'Those macros are worth ' + n0(f.floor) + ' kcal on their own — protein at 4, fat at 9, ' +
    'fibre at 2 kcal per gram — but only ' + n0(f.have) + ' kcal are left for them. ' +
    'That is ' + n0(f.over) + ' kcal over before any digestible carbohydrate comes along for ' +

}

/* Recipes whose `person` is null belong to both — that is what a mirror meal is. */
function recipesFor(who){
  return (D.recipes || []).filter(function(r){
    return !r.person || r.person === who;
  });
}

/* The library grows by dropping files in a folder, and the folder is in iCloud,

/* What to hunt for. The envelope is derived from the same two files the rest of

function lookForHTML(){

    '<h4>Works</h4>' +
    list(['Cod, prawns, turkey, chicken breast, pork fillet',
          'Braises and one-pot stews — Taiwanese, Vietnamese, Japanese',
          'Stir-fries heavy on vegetables, with a weighable protein portion',

    list(['Coconut milk at full fat, cream, cheese sauce, peanut or satay — the light tin is fine, 40–80 g of it fits',
          'Deep-fried, battered, breaded',
          'Eggs or tempeh as the only protein — neither reaches 40 g inside the fat ceiling',
          'Salads that reach their fibre through sheer volume',
          'Protein minced into a mixture, so no portion can be weighed']) +

    '<h4>What to write down</h4>' +
    '<p>The ingredients in grams, and the method. Skip the nutrition panel — every ' +
