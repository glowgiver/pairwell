<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Style · Pairwell</title>
<meta name="theme-color" content="#0B1220">
<link rel="stylesheet" href="../app.css?v=52081535">
<style>
  /* Palette lives in ../app.css — only the accent choice is page-local. */
  :root{ --accent:var(--style); }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--f-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    padding:
      calc(env(safe-area-inset-top) + 22px)
      calc(env(safe-area-inset-right) + 16px)
      calc(var(--bar) + 26px)
      calc(env(safe-area-inset-left) + 16px);
    max-width:640px;
    margin:0 auto;
  }

  h1{font-size:27px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;color:var(--accent)}
  .sub{font-family:var(--f-read);font-size:15px;color:var(--muted);margin:0 0 20px;line-height:1.55}

  .empty{padding:22px 18px;font-family:var(--f-read);font-size:15px;
    color:var(--muted);line-height:1.6;border:1px solid var(--line);
    border-radius:14px;background:var(--surface)}
  .empty strong{color:var(--text)}

  /* Jump bar. Ten cards is roughly seven screens, and the two things looked up
     most often in a shop — Size and Brands — sit at the bottom because the
     reading order is by importance, not by how often you need it. Rather than
     fight that, this gives every card a one-tap address. It scrolls
     horizontally and is built from the cards actually rendered, so it cannot
     drift out of step with them. */
  .jump{
    display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;
    margin:0 -16px 18px;padding:2px 16px 6px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .jump::-webkit-scrollbar{display:none}
  .jump a{
    flex:none;display:inline-flex;align-items:center;min-height:var(--tap);
    padding:0 14px;border-radius:22px;text-decoration:none;
    background:var(--surface);border:1px solid var(--line);
    font-family:var(--f-data);font-size:15px;color:var(--muted);
  }
  .jump a:active{background:var(--surface-2);color:var(--text)}
  .jump a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* The top bar is sticky, so an anchor that lands flush at the viewport top
     lands underneath it. Its height is min-height var(--tap) plus 8px of
     padding either side. */
  .ref-card{
    margin-bottom:16px;border:1px solid var(--line);border-radius:14px;
    overflow:hidden;background:var(--surface);
    scroll-margin-top:calc(var(--tap) + 26px);
  }
  .ref-head{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  /* A real h2, not a styled div: this page is ten sections of reference text
     and without headings it has no outline to navigate by at all. */
  .ref-title{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
  .ref-intro{font-family:var(--f-read);font-size:14.5px;color:var(--muted);margin-top:4px;line-height:1.55}
  .ref-body{padding:4px 16px}
  /* Stacked first. Several values here are full paragraphs, and a fixed label
     column on a 375px screen leaves them about 215px wide — a text ribbon.
     The side-by-side form is an enhancement for wider screens only. */
  .ref-item{padding:10px 0;border-bottom:1px solid var(--line)}
  .ref-item:last-child{border-bottom:none}
  .ref-item-k{font-family:var(--f-data);font-size:13px;font-weight:700;color:var(--accent)}
  .ref-item-v{font-family:var(--f-read);font-size:15px;color:var(--muted);line-height:1.55;margin-top:3px}
  .ref-item-v strong{color:var(--text)}

  /* Short values — measurements — keep the label column at every width,
     because "38 cm" on its own line is wasted space, not clarity. */
  .ref-item.compact{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:baseline}
  .ref-item.compact .ref-item-v{margin-top:0}

  @media (min-width:480px){
    .ref-item{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:baseline}
    .ref-item .ref-item-v{margin-top:0}
  }

  .tagrow{display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px 14px}
  .tag{
    font-family:var(--f-data);font-size:13px;padding:5px 10px;border-radius:20px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  }

  .note{padding:11px 16px 14px;font-family:var(--f-read);font-size:14.5px;
    color:var(--muted);line-height:1.55;border-top:1px solid var(--line)}
  .note strong{color:var(--text)}

  /* Colour swatches. The name always sits BESIDE the chip, never on it —
     these are arbitrary wardrobe colours, so no contrast ratio against them
     can be guaranteed and text on top would be a coin flip. */
  .sw{display:flex;flex-wrap:wrap;gap:10px 14px;padding:13px 16px 15px}
  .sw-item{display:flex;align-items:center;gap:8px;min-height:24px}
  /* Outlined with --muted2, not --line: half this palette is deep navy and
     charcoal, which vanish against the dark card if the ring is as faint as
     a divider. --muted2 is a mid-tone that holds in both themes. */
  .sw-dot{width:20px;height:20px;border-radius:6px;border:1px solid var(--muted2);flex:none}
  .sw-name{font-family:var(--f-data);font-size:13px;color:var(--text);white-space:nowrap}
  .sw-why{font-family:var(--f-read);font-size:13px;color:var(--muted2);line-height:1.4}
  /* When each swatch carries a reason, one per row — inline flow turned the
     two-word names into two-line names. */
  .sw.reasons{gap:11px}
  .sw.reasons .sw-item{width:100%;align-items:baseline}
  .sw.reasons .sw-dot{align-self:center}
  .sw-label{
    font-family:var(--f-data);font-size:12.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted2);padding:12px 16px 0;
  }
  /* .sw-sub lived here for the two branches of the unresolved undertone
     question. The question is answered, there are no branches, and a rule
     nothing uses is worse than no rule. */

  /* Looks — the drawn outfits. */
  .look{padding:14px 16px;border-bottom:1px solid var(--line)}
  .look:last-of-type{border-bottom:none}
  .lk-when{font-size:16px;font-weight:700}
  .lk-sub{font-family:var(--f-read);font-size:13.5px;color:var(--muted2);margin-top:2px;line-height:1.45}
  .lk-body{display:flex;gap:14px;align-items:flex-start;margin-top:11px}
  /* The drawing is fixed-width so five of them line up down the page; a
     figure that resized per card would read as five different people. */
  .fig{width:82px;height:150px;flex:none}
  .lk-rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  .lk-row{display:grid;grid-template-columns:20px 74px 1fr;gap:8px;align-items:baseline}
  .lk-row .sw-dot{align-self:center}
  .lk-part{font-family:var(--f-data);font-size:12.5px;color:var(--muted2);
    text-transform:uppercase;letter-spacing:.04em}
  .lk-item{font-family:var(--f-read);font-size:14.5px;color:var(--text);line-height:1.4}
  .lk-note{font-family:var(--f-read);font-size:14px;color:var(--muted);
    margin-top:10px;line-height:1.55}
  /* The generated illustration sits on its own white plate. The house style
     asks for a white background, and a white rectangle floating on a dark
     card reads as a bug — a plate with a border and a radius reads as a
     lookbook page, and works unchanged in both themes. */
  .lk-plate{width:96px;aspect-ratio:3/4;flex:none;background:#fff;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;line-height:0}
  .lk-img{width:100%;height:100%;display:block;object-fit:contain}
  /* Prompt, shown only while an illustration is missing. */
  .pr{padding:0 16px 14px}
  .pr-t{margin:0 0 10px;font-family:var(--f-read);font-size:13.5px;
    color:var(--muted);line-height:1.5}
  .pr-c{
    min-height:var(--tap);padding:0 16px;border-radius:22px;cursor:pointer;
    background:var(--accent);color:var(--bg);border:none;
    font-family:var(--f-data);font-size:15px;font-weight:700;
  }
  .pr-c:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pr-h{margin:10px 0 0;font-family:var(--f-read);font-size:13px;
    color:var(--muted2);line-height:1.5}
  .pr-h b{color:var(--text);font-family:var(--f-data)}
  /* Below ~360px the three-column row runs out of room for the garment name. */
  @media (max-width:359px){
    .lk-row{grid-template-columns:20px 1fr}
    .lk-part{grid-column:2}
    .lk-item{grid-column:2}
  }

  /* Silhouette rules — the rule reads as a heading, the reason underneath it. */
  .rule{padding:12px 16px;border-bottom:1px solid var(--line)}
  .rule:last-child{border-bottom:none}
  .rule-r{font-size:15px;font-weight:700;line-height:1.35}
  .rule-w{font-family:var(--f-read);font-size:14.5px;color:var(--muted);
    margin-top:4px;line-height:1.55}

  /* Buy next — ordered, because the order is the advice. */
  .buy{list-style:none;margin:0;padding:4px 0}
  .buy li{display:grid;grid-template-columns:26px 1fr;gap:12px;
    padding:12px 16px;align-items:baseline;border-bottom:1px solid var(--line)}
  .buy li:last-child{border-bottom:none}
  .buy .n{font-family:var(--f-data);font-size:15px;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums}
  .buy .t{font-size:15.5px;font-weight:700}
  .buy .c{font-family:var(--f-data);font-size:13px;color:var(--muted2);margin-top:2px}
  .buy .p{font-family:var(--f-read);font-size:14.5px;color:var(--muted);
    margin-top:5px;line-height:1.55}

  /* Reference figures */
  .refperson{padding:11px 16px;border-bottom:1px solid var(--line)}
  .refperson:last-child{border-bottom:none}
  .refperson .rp-n{font-size:15px;font-weight:700}
  .refperson .rp-w{font-family:var(--f-read);font-size:14.5px;color:var(--muted);
    margin-top:3px;line-height:1.55}

  /* A revision note — something that was deliberately changed, with the reason.
     Same shape as .note but marked, so it does not read as original source. */
  .rev{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
  .rev-t{font-family:var(--f-data);font-size:12.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent)}
  .rev p{margin:5px 0 0;font-family:var(--f-read);font-size:14.5px;
    color:var(--muted);line-height:1.55}
  .rev p strong{color:var(--text)}

  /* Progressive disclosure, same shape the skincare page already uses. What
     goes in here is the read-once justification — why a recommendation was
     changed, how well supported it is. Real reference content never folds:
     hiding a colour or a measurement behind a tap would defeat the page. */
  details.fold{border-top:1px solid var(--line);background:var(--surface-2)}
  details.fold summary{
    min-height:var(--tap);display:flex;align-items:center;gap:9px;
    padding:11px 16px;cursor:pointer;list-style:none;
    font-family:var(--f-data);font-size:15px;font-weight:600;color:var(--muted);
  }
  details.fold summary::-webkit-details-marker{display:none}
  details.fold summary::after{
    content:"";margin-left:auto;width:8px;height:8px;flex:none;
    border-right:2px solid var(--muted2);border-bottom:2px solid var(--muted2);
    transform:rotate(45deg);transition:transform .18s ease;
  }
  details.fold[open] summary{color:var(--text)}
  details.fold[open] summary::after{transform:rotate(-135deg)}
  details.fold summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  details.fold .rev{border-top:none;padding-top:0}
  details.fold .note{border-top:none}

  /* An intro paragraph belonging to a .sw-label section. Was an inline style
     repeated at three call sites. */
  .sect-note{font-family:var(--f-read);font-size:14.5px;color:var(--muted);
    line-height:1.55;padding:2px 16px 4px}

  /* Seasons — one sub-card per calendar season, inside the wardrobe card. */
  .season{padding:13px 16px;border-bottom:1px solid var(--line)}
  .season:last-child{border-bottom:none}
  /* Style is the only module with no notion of "today", which is why it is
     absent from the Today screen. The wardrobe is the one place a date does
     mean something, so the current season is marked — cheap, and it turns
     four blocks of text into one answer plus three for reference. */
  .season.now{background:var(--surface-2)}
  .season-h{font-size:15.5px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .season-h .now-pill{
    /* 13px, the secondary floor. The .pi-status pill nearby is 12px and
       predates the rule; new markup holds it. */
    font-family:var(--f-data);font-size:13px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;padding:2px 8px;border-radius:20px;
    background:var(--accent);color:var(--bg);
  }
  .season-h .heading{font-family:var(--f-read);font-style:italic;font-weight:400;font-size:13.5px;color:var(--muted2)}
  .season dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
  .season dt{font-family:var(--f-data);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2);white-space:nowrap}
  .season dd{margin:0;font-family:var(--f-read);font-size:14.5px;color:var(--text);line-height:1.5}

  /* Brands */
  .brandrow{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .brandrow:last-child{border-bottom:none}
  .brandrow .bn{font-weight:600;font-size:15px}
  .brandrow .bc{font-family:var(--f-data);font-size:13px;color:var(--muted2);text-align:right}

  /* Chino plan */
  .plan-item{padding:12px 16px;border-bottom:1px solid var(--line)}
  .plan-item:last-child{border-bottom:none}
  .plan-item .pi-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .plan-item .pi-name{font-weight:700;font-size:15px}
  .plan-item .pi-status{font-family:var(--f-data);font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:20px;
    background:var(--surface-2);color:var(--accent);white-space:nowrap}
  .plan-item .pi-detail{font-family:var(--f-read);font-size:14px;color:var(--muted);margin-top:4px;line-height:1.5}
  .plan-item .pi-detail b{color:var(--text);font-weight:600}
  /* The second-hand search string — real but the least-often-needed line,
     only relevant once he is actually on Vinted. Smaller and dimmer keeps it
     present without competing with brand/colour/price for the eye. */
  .plan-item .pi-detail.pi-muted{font-size:13px;color:var(--muted2);font-style:italic}

  /* Outfit planner */
  .outfitrow{padding:12px 16px;border-bottom:1px solid var(--line)}
  .outfitrow:last-child{border-bottom:none}
  .outfitrow .or-day{font-family:var(--f-data);font-size:13px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
  .outfitrow .or-body{margin-top:5px}
  .outfitrow dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
  .outfitrow dt{font-family:var(--f-data);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted2)}
  .outfitrow dd{margin:0;font-family:var(--f-read);font-size:14.5px;color:var(--text)}
  .outfitrow .or-empty{font-family:var(--f-read);font-size:14px;font-style:italic;color:var(--muted2);margin-top:4px}

  /* Deliberately no scroll-behavior:smooth. This page is around fifteen
     screens tall, so animating a jump from the index to Size is a couple of
     seconds of blur on the way to somewhere you already chose. A jump link
     should jump; the browser's Back button restores the previous position. */
  @media (prefers-reduced-motion:reduce){ * { transition:none !important } }
</style>
</head>

<h1>Style</h1>
<p class="sub">Direction, palette, silhouette, sizes — a lookup, not a checklist.</p>

<main id="stage"></main>

<script src="../app.js?v=3f8263a7"></script>
<script>
const S = {"philipp": {"direction": {"register": "Modern preppy, elevated — mature, not collegiate", "thesis": "The wardrobe he was already buying toward (Ralph Lauren, Suitsupply, Charles Tyrwhitt) stops being an exception and becomes the actual plan: tailored coats and knitwear over a collared shirt, chinos with a clean line, camel and khaki back in alongside the cool core. Preppy's usual signals — bright polos, popped collars, varsity branding — are exactly the collegiate register this avoids; the 2026 version of this look is described everywhere as sophisticated and mature rather than campus, and that is the half being kept.", "builtFrom": "Three facts about him, not a look: colouring that is Dark Winter and high-contrast, a 25 cm waist-to-hip drop, and a face that reads a decade younger than the passport. Those decide the trouser cut and how far the styling may mature regardless of register; the palette itself is cool by test, with camel and khaki confirmed back in on his own report on 2026-09-06.", "onTheOriginalFraming": "Written first in Korean-actor vocabulary, then generalised — the palette, cut and hair depend on his own measurements and colouring, not the label. The register itself changed again on 2026-09-06, quiet minimalism to modern preppy; the old references matched the old register, not this one.", "ageRead": "Reads early-to-mid 30s in photographs, not 43: full hairline, even skin tone, no deep static lines. The clothes are currently the oldest thing in the picture. That widens the range rather than narrowing it — the limiter is context (school, parent evenings, Germany), not the birth year, and over-mature styling would hand back years the face has not lost.", "notThis": [{"register": "Costume", "why": "Sheer fabric, embellishment, stage pieces — the idol register."}, {"register": "Collegiate preppy", "why": "Bright polos, popped collars, varsity, baseball caps — the campus version this register avoids."}], "referencesNote": "Byeon Woo Seok is sourced for the garment specifics; Beckham and Reynolds for silhouette and attitude only. Colour is already settled from his own skin and the metal test, not from a reference photo.", "references": [{"name": "Byeon Woo Seok", "why": "Actor, not idol; Prada ambassador; documented in cable-knit-over-collared-shirt layering — the core preppy combination, executed adult rather than campus. Age and build read close to his own."}, {"name": "David Beckham", "why": "Named directly in 2026 coverage of the trend: 'blending traditional tailoring with casual, sporty elements'. Mature, not collegiate, and the sportswear-into-tailoring move matches a man who trains regularly."}, {"name": "Ryan Reynolds", "why": "Named in the same coverage: 'clean, polished ensembles with a touch of whimsy'. The whimsy is the one thing to leave behind — the register wanted here is quieter than his press-tour persona — but the clean, tailored-casual base is exactly it."}], "readOfCurrentPhotos": "Four photographs, four sets of functional clothing: sport tee, polo, sport tee, printed sweatshirt. Not a taste problem — a control problem. Nothing in the set is a chosen silhouette. What already works: the gum-sole Sambas, and navy, which appears in three of four and flatters in all three. What works against him: the printed sweatshirt (busy, boxy, adds volume exactly where the training is removing it) and visible athletic branding outside the gym."}, "hair": {"priority": "The single biggest lever — roughly 60% of the effect is decided before any garment is chosen. Hair either rounds the face or lengthens it, and nothing worn below the collar can undo that.", "current": "Short, flat on top, growing forward, no taper at the sides and no volume at the crown. It rounds the face and takes height away.", "cut": "Two-block — 7–10 cm on top, sides tapered rather than shaved. If the name does not land at the barber, ask for length and volume on top with the sides tapered short but not clipped.", "shape": "Soft side sweep or a loose middle part, with lift at the crown", "color": "Leave it. Near-black is a Dark Winter's own colour and the high contrast against the skin is the asset. If it is ever touched, a cool dark brown — ash or espresso, never caramel or warm brown.", "product": "Matte clay, not gel. Blow-dry lift from underneath first — glossy is a decade out of date.", "why": "Vertical lift lengthens the face and gives the jaw its line back; shaved sides would read harder than intended and add years the face has not earned. The colour advice here used to say the opposite — soften the black to a warm brown — and the undertone test overturned it. That recommendation was warm-season reasoning applied to cool skin, and it was the one thing in this file genuinely riding on the answer. The cut is unaffected: it comes from face shape, not colouring."}, "palette": {"type": "Dark Winter — deep, high-contrast, cool", "confidence": "Settled for metal, not for every fabric. Depth and contrast were never in doubt. The gold-versus-silver test (2026-09-05) is the strongest-supported claim in here for metal specifically — reflective gold at the jaw is a definite no, silver reads clean — and that rule is not in question. What was overreached was extending it to every warm-toned fabric: on 2026-09-06 he reported his own camel coat and khaki both suit him, which a metal test cannot actually rule out. A polished gold ring returns raw, saturated warmth straight onto the skin; a matte wool coat is muted and sits further from the face, and depth/muting can outweigh hue in a way a mirror shows and a metal swatch cannot. So: metal is a closed question, cool only. Fabric neutrals are open beyond the deep core — camel and khaki are back in, on his word, and nothing else warm has been tested.", "established": "Near-black hair, dark brown eyes, light-to-medium skin, high hair-to-skin contrast. Deep colours hold across every lighting seen so far — black and navy both sit at the face without draining it.", "resolved": "Cool for metal: silver at the face reads clean, gold pulls yellow into the skin. Dark Winter depth and contrast stand regardless. Fabric is less absolute than metal — see `warmNeutrals` below for the two colours his own mirror has already settled.", "rule": "Deep tones throughout, and let the contrast stand. Black is a real neutral here, mid tones are not. Charcoal and true white are the cool default; camel and khaki are allowed too, on his own report — see `warmNeutrals`.", "metal": "Silver, steel, white gold, gunmetal — not gold. Watch, belt buckle, glasses frames, any ring. Metal only; doesn't extend to camel or khaki fabric.", "core": [{"name": "Black", "hex": "#16181C"}, {"name": "Navy", "hex": "#1F2A44"}, {"name": "Charcoal", "hex": "#3A3F47"}, {"name": "True white", "hex": "#FFFFFF"}, {"name": "Forest", "hex": "#2E4535"}, {"name": "Burgundy", "hex": "#6B2233"}], "accent": {"note": "Where colour is allowed in an otherwise dark wardrobe.", "colors": [{"name": "Emerald", "hex": "#0F5C4A"}, {"name": "Sapphire", "hex": "#1B3F7A"}, {"name": "Deep berry", "hex": "#7A1140"}, {"name": "Icy blue", "hex": "#BFD4E8"}]}, "warmNeutrals": {"note": "Confirmed on his own word, 2026-09-06 — not a metal-test result.", "colors": [{"name": "Camel", "hex": "#A8825A", "why": "His own coat."}, {"name": "Khaki", "hex": "#C2B49A", "why": "Confirmed same day."}]}, "ruledOut": {"note": "Untested for fabric, not wrong on anyone — just wrong next to cool skin.", "colors": [{"name": "Cream", "hex": "#EFE7D8", "why": "True white does this cool."}, {"name": "Stone", "hex": "#C7BFAE", "why": "Untested, unlike khaki."}, {"name": "Chocolate", "hex": "#4A3728", "why": "Warm brown at the face."}, {"name": "Rust", "hex": "#9C4A2A", "why": "Autumn's signature."}, {"name": "Deep olive", "hex": "#4A503A", "why": "Forest does this cool."}]}, "avoid": [{"name": "Fuchsia", "hex": "#E4409B", "why": "Too light and too bright against this depth — this was never an undertone question"}, {"name": "Apple green", "hex": "#8DC63F", "why": "Same reason: brightness. Cool it further and it is still wrong."}, {"name": "Lemon yellow", "hex": "#F2E85C", "why": "Light and bright — disappears next to near-black hair"}, {"name": "Ice pink", "hex": "#F5D3DE", "why": "Pale and washed — the opposite of a Dark palette"}, {"name": "Mid grey", "hex": "#9AA0A8", "why": "Not wrong, just inert — mid tones flatten a high-contrast face. Go darker."}]}, "looks": {"note": "Added 2026-09-05 because the page could describe a wardrobe but not show one. Every colour here comes from `palette.core` or `palette.accent` — these are assemblies, not new decisions, and if the palette changes these have to change with it. Five is deliberate: enough to cover the week he actually has, few enough that each one is a real outfit rather than a combination generator.", "imageStyle": {"adaptedFrom": "The Teaching Hub house style — 'black and white graphic novel illustration, bold clean ink lines, no grey gradients, white background, no text, no labels, no captions'. Reused so the two projects look like they come from the same hand.", "deviation": "One deliberate change: colour is allowed. On a wardrobe page the colour IS the content — a navy knit under a charcoal overshirt is the whole point — and a black-and-white plate would remove exactly the thing the reader came for. So: ink linework as in Teaching Hub, but garments filled flat in the palette hexes, with no rendering, no gradients and no fabric texture.", "correction": {"date": "2026-09-06", "problem": "The first two renders (school-day, parent-evening) came back reading as modern preppy / dark academia — glossy K-webtoon shading and doe-eyed rendering rather than the graphic-novel ink asked for, a flapped topstitched chest pocket, a button-down collar, and trousers with a visible break at the shoe. None of that was written into the prompt; the generator defaulted to the dominant house style for 'handsome young Asian man' illustrations, which is exactly that look. The palette and garments were correct — the rendering and a few unstated details were not.", "fix": "prefix and figure below now say explicitly what they used to leave to chance: matte flat ink, no glossy or anime/webtoon shading, no doe-eyed romance-comic rendering, matte textured hair rather than a glossy side part, no decorative top-stitching or flapped pockets, no crease-break at the shoe. The parent-evening shirt keeps its collar — a plain spread collar is exactly right under an open coat — but loses the button-down oxford collar (the version with buttons at the points), which is the specific detail that read Ivy. This is not a new direction — it is the one already written in `direction` and `hair`, enforced in the prompt instead of assumed.", "existingImages": "school-day.png and parent-evening.png predate this fix and were not regenerated — that is a real cost, not a rounding error, and worth redoing only if the drift bothers him enough to spend the effort again."}, "prefix": "Full-length fashion-plate illustration in a graphic novel style — flat matte ink, like a European or American adult graphic novel, not an anime or webtoon romance comic. Bold clean black ink outlines of even weight, no cross-hatching, no soft cel-shading, no grey gradients, no glossy highlights anywhere including on hair and skin. Garments filled with flat solid colour exactly as specified, no texture and no fabric rendering. Plain white background, no scenery, no props, no shadow on the ground. No text, no labels, no captions, no logos, no visible branding, no decorative top-stitching, no flapped or patterned pockets — keep every garment plain and unornamented.", "figure": "The same man in all five images so they read as one series: early-30s East Asian man, slim athletic build, mature and quiet rather than boyish or doe-eyed, calm neutral expression with no smile. Near-black hair with length and volume on top and tapered sides, matte and textured with natural separation — not glossy, not a slicked or glassy side part. Standing straight and facing the viewer, arms relaxed at his sides, full body visible from head to shoes. Trousers fall in one continuous straight line with no crease and no break at the shoe.", "suffix": "Portrait orientation, roughly 3:4. The whole figure must fit inside the frame with clear margin above the head and below the shoes.", "howToUse": "Concatenate prefix + figure + the look's own `imagePrompt` + suffix, generate, and drop the file into hub/style/img/ named after the occasion slug — school-day.png, parent-evening.png, weekend.png, evening-out.png, colour-carefully.png. The build picks it up on the next run and replaces the drawn placeholder; .png, .jpg and .webp are all accepted.", "background": "A transparent background is better than white if the generator can do it, because the page has a dark theme as well as a light one. If it cannot, white is fine — the build puts the image on its own white plate so it looks deliberate in both themes rather than like a bug."}, "items": [{"occasion": "School day", "when": "The default, and the one worth getting right — it is most of the week", "note": "Tonal from collar to shoe, one shoulder seam on the outside. Nothing here needs ironing on a Tuesday morning.", "imagePrompt": "He wears an open charcoal grey overshirt (#3A3F47) with a defined shoulder seam, worn over a navy blue fine-gauge merino crew neck knit (#1F2A44), straight-leg charcoal grey trousers (#3A3F47) that fall clear of the hip and break once at the ankle, and black leather chelsea boots (#16181C). The overshirt hangs open and straight, forming one unbroken vertical line down each side.", "layers": [{"part": "Outerwear", "item": "Charcoal overshirt", "hex": "#3A3F47"}, {"part": "Top", "item": "Navy merino crew", "hex": "#1F2A44"}, {"part": "Bottom", "item": "Charcoal straight trousers", "hex": "#3A3F47"}, {"part": "Shoes", "item": "Black chelsea", "hex": "#16181C"}]}, {"occasion": "Parent evening", "when": "When the room has other adults in it and the clothes are read once, quickly", "note": "The only look with real contrast, and it is at the collar where it flatters. The coat does the work; nothing else is trying.", "imagePrompt": "He wears an open single-breasted charcoal grey wool coat (#3A3F47) that reaches just below the knee, over a plain pure white shirt (#FFFFFF) with a spread collar and no tie — a plain collar, not a button-down oxford collar, and no visible collar buttons — straight-leg navy blue trousers (#1F2A44), and black leather derby shoes (#16181C). The coat is single-breasted with a narrow lapel and hangs open in one long straight vertical line.", "layers": [{"part": "Outerwear", "item": "Charcoal knee-length coat", "hex": "#3A3F47"}, {"part": "Top", "item": "True white shirt", "hex": "#FFFFFF"}, {"part": "Bottom", "item": "Navy straight trousers", "hex": "#1F2A44"}, {"part": "Shoes", "item": "Black derby", "hex": "#16181C"}]}, {"occasion": "Weekend", "when": "Errands, coffee, the park", "note": "The Sambas stay. They are the one thing in the current photographs that already works, and shoes sit far enough from the face that the palette rule is not doing much down there.", "imagePrompt": "He wears an open dark forest green overshirt (#2E4535) over a plain pure white t-shirt (#FFFFFF), straight-leg dark indigo denim jeans (#23314A) in a deep even wash with no fading and no distressing, and low-profile white leather sneakers with a gum sole (#E9E7E2) and three plain stripes. Relaxed but not loose; the jeans are straight through the leg, never skinny and never baggy.", "layers": [{"part": "Outerwear", "item": "Forest overshirt", "hex": "#2E4535"}, {"part": "Top", "item": "True white tee", "hex": "#FFFFFF"}, {"part": "Bottom", "item": "Dark straight denim, no fading", "hex": "#23314A"}, {"part": "Shoes", "item": "Samba", "hex": "#E9E7E2"}]}, {"occasion": "Evening out", "when": "Dinner, a bar, anywhere with low light", "note": "Black on black on black, broken only by the coat being a shade lighter. This is the look the high contrast in his colouring was made for.", "imagePrompt": "He wears an open single-breasted charcoal grey wool coat (#3A3F47) reaching just below the knee, over a black fine-gauge mock neck knit (#16181C), straight-leg black trousers (#16181C), and black leather chelsea boots (#16181C). Almost entirely black from the neck down, with the coat one clear shade lighter so the silhouette still separates from the layers beneath it.", "layers": [{"part": "Outerwear", "item": "Charcoal coat", "hex": "#3A3F47"}, {"part": "Top", "item": "Black mock neck", "hex": "#16181C"}, {"part": "Bottom", "item": "Black straight trousers", "hex": "#16181C"}, {"part": "Shoes", "item": "Black chelsea", "hex": "#16181C"}]}, {"occasion": "Colour, carefully", "when": "When the whole week has been navy and charcoal", "note": "One accent, at the top, with everything under it quiet. Emerald is a Dark Winter colour rather than a bright one, so it reads as depth and not as a statement.", "imagePrompt": "He wears an open navy blue overshirt (#1F2A44) over a deep emerald green fine-gauge merino crew neck knit (#0F5C4A), straight-leg charcoal grey trousers (#3A3F47), and black leather chelsea boots (#16181C). The emerald is deep and saturated rather than bright or minty, and it is the only colour in the image that draws the eye.", "layers": [{"part": "Outerwear", "item": "Navy overshirt", "hex": "#1F2A44"}, {"part": "Top", "item": "Emerald merino crew", "hex": "#0F5C4A"}, {"part": "Bottom", "item": "Charcoal straight trousers", "hex": "#3A3F47"}, {"part": "Shoes", "item": "Black chelsea", "hex": "#16181C"}]}]}, "silhouette": {"rules": [{"rule": "Straight leg, mid-to-high rise", "why": "Hip 105 cm over waist 80 cm is a 25 cm drop. A slim cut pulls at the seat and advertises exactly the ratio the training is working on; straight falls clear of the hip and lengthens the leg."}, {"rule": "Defined shoulder line", "why": "The taper is being built in the gym. Outerwear with a real shoulder seam — overshirt, coat, unstructured blazer — anticipates it instead of waiting for it."}, {"rule": "Tonal column, top to bottom", "why": "One depth of colour head to foot reads as height. Splitting light-over-dark cuts the body in half at the waist, which is the one place not to draw a line."}, {"rule": "Outerwear to the knee, single-breasted", "why": "A long unbroken vertical is the most reliable lengthening device there is. Double-breasted adds width across the chest and works against it."}, {"rule": "No visible branding outside the gym", "why": "Sport logos say 'on the way to train'. The clothes should not be doing that when the destination is a classroom."}, {"rule": "Relaxed, never skinny — and never baggy", "why": "Easy through the leg, clean at the line. Tight reads dated and fights the hip; oversized reads borrowed and loses the shoulder the whole silhouette is built on."}]}, "buyNext": [{"item": "Overshirt / shirt jacket", "colors": "Charcoal or forest — forest replaces the deep olive this used to say", "why": "Replaces the printed sweatshirt outright. The slight shoulder structure does work a sweatshirt physically cannot, and it goes over anything already in the wardrobe."}, {"item": "Fine-gauge merino knit, crew or mock neck", "colors": "Navy, charcoal", "why": "The base layer the whole tonal column is built on. Uniqlo is already on the brand list and their merino is exactly the right weight."}, {"item": "Straight-leg trousers, mid-to-high rise", "colors": "Charcoal, navy, or khaki — khaki confirmed 2026-09-06. Not stone, not cream — untested, stay out for now.", "why": "The actual silhouette change. This is the piece that does more than the other four combined."}, {"item": "Single-breasted coat, knee length", "colors": "Camel or charcoal. Camel confirmed 2026-09-06 — it's the coat he already owns and already wears well.", "why": "The signature garment of the reference set, and it works unchanged from a school corridor to an evening out."}, {"item": "One clean leather shoe beside the Sambas", "colors": "Black, or espresso if a softer option is wanted — never tan or cognac", "why": "Derby or chelsea. Shoepassion is already on the list and the size is already known — 8. This one changed with the test: brown was the default answer, black is the Dark Winter answer, and it also happens to be the shoe that goes with a charcoal coat and charcoal trousers."}], "seasonalWardrobe": {"note": "Rewritten 2026-09-05 into the target register, then corrected the same day when the undertone test came back cool — cream, stone, camel, chocolate, tortoise and dark brown all removed. Camel and khaki came back on 2026-09-06 on his own report; cream, stone, chocolate, tortoise and dark brown are still out, untested. The four-season structure, the straight-leg correction and the tonal-column rule are unchanged throughout.", "styleNote": "Natural fabrics — wool, cotton, leather. The rule that carries every season: one depth of colour throughout, a defined shoulder on whatever is outermost. Neutrals default cool — charcoal and true white — with camel and khaki confirmed as the two exceptions.", "seasons": [{"season": "Spring", "heading": "Light layers, one tone", "tops": "Fine merino or cotton knit in navy or true white, worn under rather than alone", "outerwear": "Overshirt or unlined coach jacket in forest or charcoal", "bottoms": "Straight chinos in khaki, charcoal or navy", "shoes": "Sambas, or a black derby when the day needs it"}, {"season": "Summer", "heading": "Cut, not exposure", "tops": "Boxy-but-clean linen or linen-blend shirt in true white or sapphire, short sleeve with a proper shoulder seam", "bottoms": "Straight trousers in charcoal or navy, or wide-leg shorts to just above the knee — not sport shorts", "accessories": "Sunglasses in black or dark grey with a grey lens. Tortoise is a warm frame and sits at the face, which is the one place the undertone actually matters.", "shoes": "Clean white leather sneaker or a black loafer"}, {"season": "Autumn", "heading": "Deep tones, before the coats come out", "tops": "Merino crew or mock neck in forest, burgundy or deep berry", "outerwear": "Overshirt layered under a camel or charcoal coat", "bottoms": "Straight trousers in charcoal, or dark denim with no fading", "shoes": "Black chelsea or derby"}, {"season": "Winter", "heading": "The strongest season for this palette", "tops": "Heavier knit in navy, charcoal or emerald, mock or turtleneck", "outerwear": "Knee-length single-breasted wool coat in camel or charcoal", "bottoms": "Straight wool-blend trousers in charcoal or black", "shoes": "Lined black boot"}]}, "chinoPlan": {"goal": "End goal: capsule wardrobe largely in Ralph Lauren. This used to be framed as a collector's habit tolerated despite the styling, back when the register was quiet minimalism. Under modern preppy it is the opposite — Ralph Lauren is close to the definitive brand for this register, so wanting it and the styling actually agreeing is the correction, not a coincidence.", "midGoal": "Interim: a pragmatic mix — Dockers (budget), Suitsupply (midrange), Ralph Lauren (premium)", "fit": "Straight leg, mid-to-high rise. Ask for the straight or relaxed cut by fit, not by model name.", "revision": {"date": "2026-09-05", "change": "Fit corrected from Slim Fit + Mid-Rise to Straight + Mid-High-Rise, 2026-09-05. Colours followed the metal test the same day — stone and Classic Khaki out — then Khaki came back in on 2026-09-06 when he confirmed it suits him; stone stays out, untested. Brands and the Ralph Lauren end goal stand throughout.", "why": "The fit change rests on a measurement — a 25 cm waist-to-hip drop, where a slim cut pulls at the seat and shortens the leg line — and stands regardless of colour. The colour history is worth keeping honest: the gold-versus-silver test ruled out gold jewellery, and that got extended to every warm fabric including Ralph Lauren's own Classic Khaki, the reason half their catalogue looks the way it does. That extension didn't survive contact with his own coat and his own trousers. Khaki chino is back; stone remains untested and stays out until it is."}, "roadmap": [{"phase": "Phase 1 — Now", "brand": "Dockers", "model": "Ultimate Chino, straight", "colors": "Khaki, Charcoal, Navy", "priceNew": "€40–50", "whereNew": "Dockers DE, Zalando, Amazon.de", "secondHandSearch": "\"Dockers Ultimate Chino straight 32/32\"", "purpose": "Everyday, school — the cheapest way to test the straight cut before spending real money", "status": "Planned"}, {"phase": "Phase 2 — Once the cut is confirmed", "brand": "Suitsupply", "model": "Wider chino block in store — Brescia is their slim one", "colors": "Navy, Charcoal, Black", "priceNew": "~€119", "whereNew": "Suitsupply DE (Berlin, Frankfurt, Munich)", "secondHandSearch": "\"Suitsupply chino 32/32\" — check the cut in photos, not the model name", "purpose": "Smart casual, first one where the fabric shows", "status": "Planned"}, {"phase": "Phase 3 — 1–2 years", "brand": "Ralph Lauren", "model": "Stretch Chino, straight or relaxed", "colors": "Classic Khaki, Navy", "priceNew": "€120–150 (outlet/Vinted often €80–100)", "whereNew": "Ralph Lauren DE, Zalando, outlets (Ingolstadt, Roermond)", "secondHandSearch": "\"Polo Ralph Lauren chino straight 32/32\"", "purpose": "Prestige, parent evenings, events", "status": "Planned"}, {"phase": "Phase 4 — End goal", "brand": "Ralph Lauren", "model": "Stretch Chino, straight — same range as Phase 3", "colors": "Charcoal, possibly Forest", "purpose": "Complete the capsule", "status": "End goal"}]}, "brands": [{"name": "Charles Tyrwhitt", "category": "Shirts", "note": "Stands — collar 38, extra slim fit already established"}, {"name": "Suitsupply", "category": "Suits, chinos", "note": "Stands for tailoring; take the wider chino block, not Brescia"}, {"name": "Uniqlo", "category": "Knitwear", "note": "Now the most important name on this list — the merino line is the tonal base layer"}, {"name": "Eterna", "category": "Silk ties"}, {"name": "Shoepassion", "category": "Men's shoes", "note": "Size 8 — the black derby or chelsea comes from here. Was dark brown until the undertone test."}, {"name": "Adidas", "category": "Sneakers, socks", "note": "Sambas stay. The branded sport tees stay in the gym."}, {"name": "Levi's", "category": "Jeans — Denim 511 Slim", "note": "511 is a slim cut; the straight-leg correction applies here too when it is replaced"}, {"name": "Banana Republic", "category": "Chino — 31/32 Mason Athletic Fit", "note": "Superseded by the fit revision"}, {"name": "Burberry", "category": null}, {"name": "Villeroy und Boch", "category": "Porcelain (not clothing)"}], "size": {"collar": "38 cm", "shoulder": "46 cm", "chest": "96 cm", "belly": "87 cm", "waist": "80 cm", "hip": "105 cm", "armLength": "83 cm", "sleeveLength": "61 cm", "shirtLength": "67 cm", "notes": ["Extra Slim Fit — Tyrwhitt 38 business shirt, casual size S", "31/32 Regular Fit — Boss Orange chino", "Shoes: 26 cm foot = EU 42.6–43.3 at Adidas, EU 43 at Nike", "Shoepassion size 8", "Waist 80 to hip 105 is a 25 cm drop — the single measurement that decides the trouser cut"]}, "outfitPlanner": {"note": "Empty on purpose. The source carried a single day, and it reads as someone else's outfit — it is held back in the repo notes until he confirms it is his.", "days": [{"day": "Monday"}, {"day": "Tuesday"}, {"day": "Wednesday"}, {"day": "Thursday"}, {"day": "Friday"}, {"day": "Saturday"}, {"day": "Sunday"}]}}, "eunice": null};

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function person(){ return PW.get(); }
function profile(){ return S[person()]; }

/* Card functions return a card's INSIDE — head plus body. renderStage wraps
   each one in its <section> and derives the anchor id from the nav label, so
   the jump bar and the cards cannot disagree about what a section is called
   or whether it exists. Both arguments are HTML and are escaped by callers,
   because most titles are a literal joined to an escaped value. */
function head(title, intro){
  return '<div class="ref-head"><h2 class="ref-title">' + title + '</h2>' +
    (intro ? '<div class="ref-intro">' + intro + '</div>' : '') + '</div>';
}

/* For the read-once material: why something was changed, how well supported a
   call is. Never for a colour, a measurement or a rule. */
function fold(label, inner){
  if(!inner) return "";
  return '<details class="fold"><summary>' + esc(label) + '</summary>' + inner + '</details>';
}

function slug(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

/* The frame everything else is read through, so it comes first. */
function directionCard(d){
  if(!d) return "";
  var refs = (d.references || []).map(function(r){
    return '<div class="refperson"><div class="rp-n">' + esc(r.name) + '</div>' +
      '<div class="rp-w">' + esc(r.why) + '</div></div>';
  }).join("");

  /* Three long paragraphs used to open the page. The thesis in the head says
     the same thing in a sentence; these argue for it, and arguing is what
     folds. */
  var reasoning = [
    ["Built from", d.builtFrom], ["Age read", d.ageRead],
    ["Where it stands", d.readOfCurrentPhotos]
  ].filter(function(r){ return r[1]; }).map(function(r){
    return '<div class="ref-item"><div class="ref-item-k">' + esc(r[0]) + '</div>' +
      '<div class="ref-item-v">' + esc(r[1]) + '</div></div>';
  }).join("");

  return head('Direction — ' + esc(d.register), d.thesis ? esc(d.thesis) : "") +
    fold("What this is built on", reasoning ? '<div class="ref-body">' + reasoning + '</div>' : "") +
    (refs
      ? '<div class="sw-label">Reference</div>' +
        (d.referencesNote ? '<div class="sect-note">' + esc(d.referencesNote) + '</div>' : '') +
        refs
      : '') +
    /* "Not this" stays open — it is a rule about what to avoid, which is
       lookup content. The note about how this file came to be written is
       not, and folds. Accepts one object or a list, because there is now
       more than one thing this register is explicitly not. */
    (d.notThis
      ? (Array.isArray(d.notThis) ? d.notThis : [d.notThis]).map(function(n){
          return '<div class="rev"><div class="rev-t">Not this — ' + esc(n.register) + '</div>' +
            '<p>' + esc(n.why) + '</p></div>';
        }).join("")
      : '') +
    fold("How this was framed", d.onTheOriginalFraming
      ? '<div class="rev"><p>' + esc(d.onTheOriginalFraming) + '</p></div>'
      : "");
}

/* Its own card rather than a line in Direction, because it is the one change
   that outranks every garment on the page. */
function hairCard(h){
  if(!h) return "";
  var rows = [
    ["Now", h.current], ["Cut", h.cut], ["Shape", h.shape],
    ["Color", h.color], ["Product", h.product]
  ].filter(function(r){ return r[1]; }).map(function(r){
    return '<div class="ref-item"><div class="ref-item-k">' + esc(r[0]) + '</div>' +
      '<div class="ref-item-v">' + esc(r[1]) + '</div></div>';
  }).join("");

  return head('Hair — the biggest lever', h.priority ? esc(h.priority) : "") +
    '<div class="ref-body">' + rows + '</div>' +
    fold("Why", h.why ? '<div class="note">' + esc(h.why) + '</div>' : "");
}

function swatches(list, withWhy){
  return '<div class="sw' + (withWhy ? ' reasons' : '') + '">' + list.map(function(c){
    return '<div class="sw-item">' +
      '<span class="sw-dot" style="background:' + esc(c.hex) + '"></span>' +
      '<span class="sw-name">' + esc(c.name) + '</span>' +
      (withWhy && c.why ? '<span class="sw-why">' + esc(c.why) + '</span>' : '') +
      '</div>';
  }).join("") + '</div>';
}

function paletteCard(p){
  if(!p) return "";

  /* The undertone used to be an open question and this card used to say so,
     showing two half-palettes side by side under "if warm" / "if cool". The
     gold-versus-silver test settled it cool, so the shape changed with the
     answer: one palette, then the colours the answer took away. Keeping the
     ruled-out list visible is the point — camel and stone are what he would
     otherwise reach for, so the card has to say why they are gone, not just
     omit them. */
  function group(g, label, withWhy){
    if(!g || !g.colors) return "";
    return '<div class="sw-label">' + esc(label) + '</div>' +
      (g.note ? '<div class="sect-note">' + esc(g.note) + '</div>' : '') +
      swatches(g.colors, withWhy);
  }

  /* Metal stays open — it is a rule you act on when buying a watch or frames.
     Colouring and undertone are the evidence for the swatches below, and the
     swatches are the answer, so the evidence folds. */
  var evidence = [
    ["Colouring", p.established], ["Undertone", p.resolved]
  ].filter(function(r){ return r[1]; }).map(function(r){
    return '<div class="ref-item"><div class="ref-item-k">' + esc(r[0]) + '</div>' +
      '<div class="ref-item-v">' + esc(r[1]) + '</div></div>';
  }).join("");

  return head('Palette — ' + esc(p.type), p.rule ? esc(p.rule) : "") +
    (p.metal ? '<div class="ref-body"><div class="ref-item"><div class="ref-item-k">Metal</div>' +
      '<div class="ref-item-v">' + esc(p.metal) + '</div></div></div>' : '') +
    (p.core ? '<div class="sw-label">Core</div>' + swatches(p.core, false) : '') +
    group(p.accent, "Accents", false) +
    group(p.warmNeutrals, "Warm neutrals — his call, not the metal test's", true) +
    group(p.ruledOut, "Ruled out by the metal test", true) +
    (p.avoid ? '<div class="sw-label">Avoid — wrong at any undertone</div>' + swatches(p.avoid, true) : '') +
    fold("Why this palette", (evidence ? '<div class="ref-body">' + evidence + '</div>' : "") +
      (p.confidence ? '<div class="rev"><div class="rev-t">Confidence</div><p>' +
        esc(p.confidence) + '</p></div>' : ""));
}

/* The page could describe a wardrobe but not show one, and "a lot of text and
   you cannot picture any of it" was the verdict. Photographs are out — zero
   external requests is the rule, and the useful ones would be someone else's
   copyright anyway — so the outfit is drawn instead. Flat geometry, filled
   with the outfit's own hexes: a coat open over a top, straight legs, shoes.
   It is not a fashion illustration and does not pretend to be; what it has to
   carry is the tonal column, which is exactly what a stack of four colours
   in the right proportions does show. */
function figure(layers){
  var by = {};
  layers.forEach(function(l){ by[l.part] = l.hex; });
  var outer = by.Outerwear, top = by.Top, bottom = by.Bottom, shoe = by.Shoes;

  /* Sleeves belong to whatever is outermost. Without them the first version
     read as a tabard rather than a coat over a knit, which was the single
     thing the drawing had to communicate. */
  var sleeve = outer || top;

  return '<svg class="fig" viewBox="0 0 104 190" aria-hidden="true">' +
    /* Trousers first, so the coat falls over them the way a coat does.
       Straight leg, no taper — the one silhouette rule that rests on a
       measurement rather than on taste. */
    (bottom ? '<path d="M38 88h28l-1 66h-10l-3-44-3 44H39z" fill="' + esc(bottom) + '"/>' : '') +
    (shoe ? '<path d="M37 152h12v6a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z" fill="' + esc(shoe) + '"/>' +
            '<path d="M55 152h12v6a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z" fill="' + esc(shoe) + '"/>' : '') +
    /* Neck and torso in the top colour. Only a strip of this stays visible
       once the coat is drawn over it — which is exactly what an open coat
       shows of the knit underneath. */
    (top ? '<path d="M48 22h8v8h-8z" fill="' + esc(top) + '"/>' +
           '<path d="M40 28h24v66H40z" fill="' + esc(top) + '"/>' : '') +
    (sleeve ? '<path d="M24 34l10-5 1 60h-10z" fill="' + esc(sleeve) + '"/>' +
              '<path d="M80 34l-10-5-1 60h10z" fill="' + esc(sleeve) + '"/>' : '') +
    /* Two open front panels to just below the knee: the long unbroken
       vertical every silhouette rule on this page keeps asking for. */
    (outer ? '<path d="M28 34l18-6v104H30z" fill="' + esc(outer) + '"/>' +
             '<path d="M76 34l-18-6v104h16z" fill="' + esc(outer) + '"/>' : '') +
    '<circle cx="52" cy="13" r="9.5" fill="none" stroke="var(--muted2)" stroke-width="1.5"/>' +
    '</svg>';
}

/* The illustration if one has been generated, the drawn figure if not. The
   fallback is the whole design: the page is useful today and gets better one
   file at a time, rather than being broken until all five exist. */
function lookVisual(o, id){
  var src = IMG[id];
  if(!src){
    return figure(o.layers || []);
  }
  /* No width/height attributes: the build does not read image headers, so any
     pair it wrote would be a guess, and a wrong one reserves the wrong box and
     shifts the layout on load. The plate holds a fixed 3:4 instead — the ratio
     the prompt asks for — and object-fit contains anything that is not. */
  return '<div class="lk-plate"><img class="lk-img" src="' + esc(src) + '" alt="' +
    esc(o.occasion + ": " + (o.layers || []).map(function(x){ return x.item; }).join(", ")) +
    '" loading="lazy" decoding="async"></div>';
}

/* The prompt, shown only while the image is still missing. Copying it is the
   next action at that point, so it is a button rather than a block of text to
   select by hand. */
function promptBlock(o, id, style){
  if(IMG[id] || !o.imagePrompt || !style) return "";
  var full = [style.prefix, style.figure, o.imagePrompt, style.suffix]
    .filter(Boolean).join(" ");
  return fold("Image prompt — not generated yet",
    '<div class="pr"><p class="pr-t">' + esc(full) + '</p>' +
    '<button type="button" class="pr-c" data-prompt="' + esc(full) + '">Copy prompt</button>' +
    '<p class="pr-h">Generate it, then save the file as <b>' + esc(id) +
    '.png</b> in <b>hub/style/img/</b> and re-run the build. It replaces the drawing on its own.</p></div>');
}

function looksCard(l){
  if(!l || !l.items || !l.items.length) return "";
  var style = l.imageStyle;
  var items = l.items.map(function(o){
    var id = slug(o.occasion);
    var rows = (o.layers || []).map(function(x){
      return '<div class="lk-row">' +
        '<span class="sw-dot" style="background:' + esc(x.hex) + '"></span>' +
        '<span class="lk-part">' + esc(x.part) + '</span>' +
        '<span class="lk-item">' + esc(x.item) + '</span></div>';
    }).join("");
    return '<div class="look">' +
      '<div class="lk-head"><div class="lk-when">' + esc(o.occasion) + '</div>' +
      (o.when ? '<div class="lk-sub">' + esc(o.when) + '</div>' : '') + '</div>' +
      '<div class="lk-body">' + lookVisual(o, id) +
      '<div class="lk-rows">' + rows + '</div></div>' +
      (o.note ? '<div class="lk-note">' + esc(o.note) + '</div>' : '') +
      promptBlock(o, id, style) +
      '</div>';
  }).join("");

  var missing = l.items.filter(function(o){ return !IMG[slug(o.occasion)]; }).length;
  var intro = missing === 0
    ? 'Five assemblies. Every colour comes from the palette above.'
    : 'Five assemblies. ' + missing + ' of 5 still show the drawn placeholder — ' +
      'each one carries the prompt that replaces it.';

  var c = style && style.correction;
  var correction = c
    ? '<div class="rev"><div class="rev-t">Style corrected ' + esc(c.date) + '</div>' +
      '<p><strong>' + esc(c.problem) + '</strong></p>' +
      '<p>' + esc(c.fix) + '</p>' +
      (c.existingImages ? '<p>' + esc(c.existingImages) + '</p>' : '') + '</div>'
    : "";

  return head('Looks', intro) + items +
    fold("Where these came from", (l.note ? '<div class="note">' + esc(l.note) + '</div>' : "") + correction);
}

function silhouetteCard(s){
  if(!s || !s.rules) return "";
  var rules = s.rules.map(function(r){
    return '<div class="rule"><div class="rule-r">' + esc(r.rule) + '</div>' +
      '<div class="rule-w">' + esc(r.why) + '</div></div>';
  }).join("");
  /* The count came from counting the rules, so it is counted rather than
     written down — the sentence used to say "six" and the array is data. */
  return head('Silhouette', s.rules.length +
    ' rules. They do more work than any single garment.') + rules;
}

function buyNextCard(list){
  if(!list || !list.length) return "";
  var items = list.map(function(b, i){
    return '<li><span class="n">' + (i + 1) + '</span><div>' +
      '<div class="t">' + esc(b.item) + '</div>' +
      (b.colors ? '<div class="c">' + esc(b.colors) + '</div>' : '') +
      (b.why ? '<div class="p">' + esc(b.why) + '</div>' : '') +
      '</div></li>';
  }).join("");
  return head('Buy next', 'In this order. The order is the advice.') +
    '<ol class="buy">' + items + '</ol>';
}

/* Meteorological seasons, northern hemisphere — the boundaries a wardrobe
   actually follows. Astronomical dates would put the first three weeks of
   September in Summer, which is not what anyone wears. */
function currentSeason(){
  return ["Winter","Winter","Spring","Spring","Spring","Summer",
          "Summer","Summer","Autumn","Autumn","Autumn","Winter"][new Date().getMonth()];
}

function seasonalWardrobeCard(w){
  if(!w) return "";
  var FIELDS = [
    ["tops", "Tops"], ["outerwear", "Outerwear"], ["bottoms", "Bottoms"],
    ["shoes", "Shoes"], ["accessories", "Accessories"]
  ];
  var now = currentSeason();
  var seasons = (w.seasons || []).map(function(s){
    var here = s.season === now;
    var dl = FIELDS.filter(function(f){ return s[f[0]]; }).map(function(f){
      return '<dt>' + esc(f[1]) + '</dt><dd>' + esc(s[f[0]]) + '</dd>';
    }).join("");
    return '<div class="season' + (here ? ' now' : '') + '"><div class="season-h">' +
      esc(s.season) +
      (here ? '<span class="now-pill">Now</span>' : '') +
      (s.heading ? '<span class="heading">' + esc(s.heading) + '</span>' : '') +
      '</div><dl>' + dl + '</dl></div>';
  }).join("");

  return head('Seasonal wardrobe', w.paletteNote ? esc(w.paletteNote) : "") +
    seasons +
    (w.styleNote ? '<div class="note">' + esc(w.styleNote) + '</div>' : '') +
    fold("What changed here", w.note ? '<div class="note">' + esc(w.note) + '</div>' : "");
}

function brandsCard(brands){
  if(!brands || !brands.length) return "";
  var rows = brands.map(function(b){
    return '<div class="brandrow"><div><span class="bn">' + esc(b.name) + '</span>' +
      (b.note ? '<div class="rule-w">' + esc(b.note) + '</div>' : '') + '</div>' +
      (b.category ? '<span class="bc">' + esc(b.category) + '</span>' : '') + '</div>';
  }).join("");
  return head('Brands', 'Where the sizes are already known.') + rows;
}

function sizeCard(sz){
  if(!sz) return "";
  var FIELDS = [
    ["collar", "Collar"], ["shoulder", "Shoulder"], ["chest", "Chest"],
    ["belly", "Belly"], ["waist", "Waist"], ["hip", "Hip"],
    ["armLength", "Arm length"], ["sleeveLength", "Sleeve"],
    ["shirtLength", "Shirt length"]
  ];
  var rows = FIELDS.filter(function(f){ return sz[f[0]]; }).map(function(f){
    return '<div class="ref-item compact"><div class="ref-item-k">' + esc(f[1]) + '</div>' +
      '<div class="ref-item-v"><strong>' + esc(sz[f[0]]) + '</strong></div></div>';
  }).join("");
  var notes = (sz.notes || []).map(function(n){
    return '<div class="note">' + esc(n) + '</div>';
  }).join("");
  return head('Size', 'The one card that gets opened in a shop.') +
    '<div class="ref-body">' + rows + '</div>' + notes;
}

function chinoPlanCard(p){
  if(!p) return "";
  /* One row per phase, not one row per phase AND one per brand. Those used
     to be two separate arrays — purchases and roadmap — and rendered back to
     back with no label between them, so the same three brands scrolled past
     twice under different headings. Ralph Lauren spanning two phases is real
     information (it is bought twice, at different points); the duplication
     was not. */
  var rows = (p.roadmap || []).map(function(x){
    return '<div class="plan-item"><div class="pi-head">' +
      '<span class="pi-name">' + esc(x.phase) + '</span>' +
      (x.status ? '<span class="pi-status">' + esc(x.status) + '</span>' : '') + '</div>' +
      '<div class="pi-detail"><b>' + esc(x.brand) + '</b> — ' + esc(x.model) + '</div>' +
      '<div class="pi-detail">' + esc(x.colors) + '</div>' +
      (x.priceNew ? '<div class="pi-detail">' + esc(x.priceNew) + ' · ' + esc(x.whereNew) + '</div>' : '') +
      (x.purpose ? '<div class="pi-detail">' + esc(x.purpose) + '</div>' : '') +
      (x.secondHandSearch ? '<div class="pi-detail pi-muted">' + esc(x.secondHandSearch) + '</div>' : '') +
      '</div>';
  }).join("");

  /* The change itself is one line and stays visible; the paragraph arguing
     for it is what folds. Moved below the plan too — it used to sit between
     the heading and the fit, so the first thing this card said was a note
     about its own edit history. */
  var rev = p.revision
    ? fold("Revised " + p.revision.date,
        '<div class="rev"><p><strong>' + esc(p.revision.change) + '</strong></p>' +
        '<p>' + esc(p.revision.why) + '</p></div>')
    : "";

  return head('Chino plan', esc(p.goal)) +
    '<div class="ref-body">' +
    (p.midGoal ? '<div class="ref-item"><div class="ref-item-k">Interim</div><div class="ref-item-v">' + esc(p.midGoal) + '</div></div>' : "") +
    (p.fit ? '<div class="ref-item"><div class="ref-item-k">Fit</div><div class="ref-item-v">' + esc(p.fit) + '</div></div>' : "") +
    '</div>' + rows + rev;
}

function outfitPlannerCard(op){
  if(!op || !op.days) return "";
  var FIELDS = [
    ["top", "Top"], ["bottom", "Bottom"], ["shoes", "Shoes"],
    ["accessories", "Accessories"], ["outerwear", "Outerwear"]
  ];
  var rows = op.days.map(function(d){
    var filled = FIELDS.filter(function(f){ return d[f[0]]; });
    var body = filled.length
      ? '<dl>' + filled.map(function(f){
          return '<dt>' + esc(f[1]) + '</dt><dd>' + esc(d[f[0]]) + '</dd>';
        }).join("") + '</dl>'
      : '<div class="or-empty">Not planned yet</div>';
    return '<div class="outfitrow"><div class="or-day">' + esc(d.day) + '</div>' +
      '<div class="or-body">' + body + '</div></div>';
  }).join("");
  return head('Outfit planner', op.note ? esc(op.note) : "") + rows;
}

function renderStage(){
  var stage = document.getElementById("stage");
  var p = profile();

  if(!p){
    stage.innerHTML = '<div class="empty"><strong>No style profile yet</strong> for ' +
      esc(PW.PEOPLE[person()].name) + '. Philipp\'s is the first one in — Eunice\'s ' +
      'gets added the same way once there is something to transcribe.</div>';
    return;
  }

  /* Ordered by how much each one changes, not by how the source notes were
     filed: direction frames everything, hair outranks any garment, palette and
     silhouette are the rules, and only then the things you actually buy.
     The jump bar is what makes that order affordable — reading order stays
     by importance, and Size is still one tap away. */
  var CARDS = [
    ["Direction",  directionCard(p.direction)],
    ["Hair",       hairCard(p.hair)],
    ["Palette",    paletteCard(p.palette)],
    ["Looks",      looksCard(p.looks)],
    ["Silhouette", silhouetteCard(p.silhouette)],
    ["Buy next",   buyNextCard(p.buyNext)],
    ["Wardrobe",   seasonalWardrobeCard(p.seasonalWardrobe)],
    ["Chinos",     chinoPlanCard(p.chinoPlan)],
    ["Brands",     brandsCard(p.brands)],
    ["Size",       sizeCard(p.size)],
    ["Planner",    outfitPlannerCard(p.outfitPlanner)]
  ].filter(function(c){ return c[1]; });

  var jump = CARDS.length > 1
    ? '<nav class="jump" aria-label="Jump to section">' + CARDS.map(function(c){
        return '<a href="#' + slug(c[0]) + '">' + esc(c[0]) + '</a>';
      }).join("") + '</nav>'
    : "";

  stage.innerHTML = jump + CARDS.map(function(c){
    return '<section class="ref-card" id="' + slug(c[0]) + '">' + c[1] + '</section>';
  }).join("");
}

/* Delegated, so it survives every re-render on a person switch. Clipboard is
   async and blocked outside a secure context, so the textarea path stays as
   the fallback rather than leaving the button doing nothing. */
document.getElementById("stage").addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest(".pr-c") : null;
  if(!b) return;
  var text = b.getAttribute("data-prompt") || "";
  /* When the clipboard is refused — an insecure context, or a webview that
     withholds the permission — select the prompt itself. That leaves the
     phone's own copy handle over the right text, which is something a person
     can act on; a button that reports failure and does nothing is not. */
  function done(ok){
    b.textContent = ok ? "Copied" : "Selected — copy it";
    if(!ok){
      var p = b.parentNode.querySelector(".pr-t");
      if(p && window.getSelection && document.createRange){
        var r = document.createRange();
        r.selectNodeContents(p);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      }
    }
    setTimeout(function(){ b.textContent = "Copy prompt"; }, 2600);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); });
    return;
  }
  done(false);
});

PW.mountRail();
PW.mountSwitcher(document.getElementById("switcher"));
PW.mountTabs("style", "../");

window.addEventListener("pw:person", renderStage);

renderStage();
</script>

</body>
